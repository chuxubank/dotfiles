url = https://dav.jianguoyun.com/dav/
vendor = other
user = chuxubank@qq.com
pass = {{ includeTemplate "safe/pass" (merge (dict "path" "Personal/Nutstore/rclone" "field" "rclone") .) }}

[rpi]
