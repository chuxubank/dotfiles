onboarding = false

[theme]
name = "gruvbox"
auto_switch = true

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "heeler.pair"
description = "Pair Heeler"

[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "$HOME/bin/herdr-layout"
description = "Apply declared workspaces"

