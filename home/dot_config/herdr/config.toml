onboarding = false

[theme]
name = "gruvbox"
auto_switch = true

[keys]
# Mux layer. Direct chords are shared with Zellij. Prefix stays Herdr-native.
# Double-tap ctrl+; sends a literal C-; into the pane.
prefix = "ctrl+semicolon"

# Cmd+1..9 = workspaces. Numbered tabs stay on the prefix so they do not clash.
switch_workspace = "cmd+1..9"
switch_tab = "prefix+1..9"
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]

# Cmd+arrows = panes. prefix+h/j/k/l remains as the prefixed form.
focus_pane_left = ["prefix+h", "cmd+left"]
focus_pane_down = ["prefix+j", "cmd+down"]
focus_pane_up = ["prefix+k", "cmd+up"]
focus_pane_right = ["prefix+l", "cmd+right"]

# Sidebar: Herdr default prefix+b, plus Alt+0 (Emacs treemacs is M-0 in GUI).
toggle_sidebar = ["prefix+b", "alt+0"]

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "heeler.pair"
description = "Pair Heeler"

[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "$HOME/bin/herdr-layout"
description = "Apply declared workspaces"
