onboarding = false

[theme]
name = "gruvbox"
auto_switch = true

[keys]
# Mux layer. Super+1..9 remains terminal-native.
# Direct Ctrl+1..9 is left for pane apps (Grok, Codex).
# Prefix+1..9 switches mux tabs. Alt+1..9 switches workspaces.
# Double-tap ctrl+; sends a literal C-; into the pane.
prefix = "ctrl+semicolon"

switch_workspace = "alt+1..9"
switch_tab = "prefix+1..9"
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Super+arrows = panes. prefix+h/j/k/l remains as the prefixed form.
focus_pane_left = ["prefix+h", "cmd+left"]
focus_pane_down = ["prefix+j", "cmd+down"]
focus_pane_up = ["prefix+k", "cmd+up"]
focus_pane_right = ["prefix+l", "cmd+right"]

# Sidebar: Herdr default prefix+b, plus Alt+0 (Emacs treemacs is M-0 in GUI).
toggle_sidebar = ["prefix+b", "alt+0"]

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "heeler.pair"
description = "Pair Heeler"

[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "$HOME/bin/herdr-layout"
description = "Apply declared workspaces"
