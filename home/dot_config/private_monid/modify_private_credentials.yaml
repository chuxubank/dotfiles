{{- /* chezmoi:modify-template */ -}}
{{- /* Pass is the source of truth; preserve added_at and extra labels. */ -}}

{{- $cred := includeTemplate "monid/key" . | fromJson -}}
{{- if $cred.key -}}
{{- includeTemplate "config/merge" (dict
  "format" "yaml"
  "input" (dig "stdin" "" .chezmoi)
  "managed" (dict
    "keys" (dict
      "main" (dict
        "key" $cred.key
        "prefix" $cred.prefix
      )
    )
  )
) -}}
{{- else -}}
{{- dig "stdin" "" .chezmoi -}}
{{- end -}}
