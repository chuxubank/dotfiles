{{- /* Goose managed configuration. */ -}}
extensions:
  computercontroller:
    enabled: true
    type: builtin
    name: computercontroller
    description: ''
    display_name: Computer Controller
    timeout: 300
    bundled: true
    available_tools: []
  developer:
    enabled: true
    type: builtin
    name: developer
    description: ''
    display_name: Developer
    timeout: 300
    bundled: true
    available_tools: []
  memory:
    enabled: true
    type: builtin
    name: memory
    description: ''
    display_name: Memory
    timeout: 300
    bundled: true
    available_tools: []
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    description: ''
    display_name: Tutorial
    timeout: 300
    bundled: true
    available_tools: []
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    bundled: true
    available_tools: []
  chatrecall:
    enabled: true
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    bundled: true
    available_tools: []
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for Goose so it can keep track of what it is doing
    bundled: true
    available_tools: []
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    description: Data visualization and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
    available_tools: []
{{ includeTemplate "mcp/goose-extensions" . | indent 2}}
{{- $cfg := includeTemplate "llm/tool-config" (merge (dict "tool" "goose") .) | fromJson }}
GOOSE_MODEL: {{ $cfg.model }}
{{- range $provName, $ep := $cfg.providers }}
{{- if $ep.base_url }}
{{ $provName | upper }}_HOST: {{ $ep.base_url }}
{{- end }}
GOOSE_PROVIDER: {{ $provName }}
{{- end }}
