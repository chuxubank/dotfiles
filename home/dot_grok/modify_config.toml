{{- /* chezmoi:modify-template */ -}}

{{- $servers := includeTemplate "mcp/grok" (merge (dict "tool" "grok") .) | fromJson -}}
{{- $enabledPlugins := includeTemplate "plugins/enabled-names" (merge (dict "tool" "grok") .) | fromJson -}}

{{- $sources := list -}}
{{- range $marketplace := dig "marketplaces" (list) (dig "grok" (dict) .plugins) }}
  {{- $entry := dict "name" $marketplace.name -}}
  {{- if eq (default "git" $marketplace.source_type) "path" -}}
    {{- $_ := set $entry "path" $marketplace.source -}}
  {{- else -}}
    {{- $_ := set $entry "git" $marketplace.source -}}
  {{- end -}}
  {{- if hasKey $marketplace "branch" -}}
    {{- $_ := set $entry "branch" $marketplace.branch -}}
  {{- end -}}
  {{- $sources = append $sources $entry -}}
{{- end }}

{{- /* "auto" follows the OS light/dark appearance at runtime (polled every
       5s). Deliberately not `ternary ... .isDarkMode` — that is captured once
       when chezmoi init probes AppleInterfaceStyle, so it would freeze the
       theme and not even follow a later apply. */ -}}
{{- /* Grok 4.7 Fast at the 500k window. The catalog lists 256k and 500k and
       defaults the selected window to 256k; context_window is that default.
       The id is `${grok_primary}-build-fast`, the same 500k Fast choice as
       Pi's `@500k:fast` and OMP's `-500k-fast`. */ -}}
{{- $cfg := includeTemplate "llm/tool-config" (merge (dict "tool" "grok") .) | fromJson -}}
{{- $grokFast := printf "%s-build-fast" (index .llm.models "grok_primary") -}}
{{- $default := $grokFast -}}
{{- $managed := dict
  "ui" (dict "theme" "auto")
  "memory" (dict "enabled" true)
  "models" (dict "default" $default)
-}}
{{- $replace := dict
  "mcp_servers" $servers
  "plugins.enabled" $enabledPlugins
  "marketplace.sources" $sources
-}}
{{- $remove := list -}}
{{- /* One models endpoint is the whole picker. The winning candidate's base
       is endpoints.models_base_url, and its /v1/models list is what can be
       selected. models.default is that candidate's upstream id. pass-field
       prints the key. A literal api_key would be stored. A candidate with no
       base URL leaves the built-in catalog and the native Fast id. The model
       table is replaced whole so a leftover row whose id contains dots can
       be dropped. */ -}}
{{- $winner := dict -}}
{{- if and $cfg.model_provider (hasKey $cfg.providers $cfg.model_provider) -}}
  {{- $candidate := index $cfg.providers $cfg.model_provider -}}
  {{- if index $candidate "base_url" -}}
    {{- $winner = $candidate -}}
    {{- $_ := set $managed "models" (dict "default" $cfg.model_id) -}}
    {{- $endpoint := includeTemplate "llm/model-endpoint" $candidate | fromJson -}}
    {{- $_ := set $replace "endpoints.models_base_url" $endpoint.api_base_url -}}
    {{- if $candidate.auth_path -}}
      {{- $passField := joinPath .chezmoi.homeDir "bin" "pass-field" -}}
      {{- $helper := list (printf "'%s'" (replace "'" "'\\''" $passField)) (printf "'%s'" (replace "'" "'\\''" $candidate.auth_path)) -}}
      {{- if $candidate.auth_field -}}
        {{- $helper = append $helper (printf "'%s'" (replace "'" "'\\''" $candidate.auth_field)) -}}
      {{- end -}}
      {{- $_ := set $replace "auth.auth_provider_command" (join " " $helper) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $existing := dict -}}
{{- $prior := trim (dig "stdin" "" .chezmoi) -}}
{{- if $prior -}}{{- $existing = $prior | fromToml -}}{{- end -}}
{{- $existingModels := dict -}}
{{- $existingAuth := dict -}}
{{- $existingProviders := dict -}}
{{- $existingEndpoints := dict -}}
{{- $existingAuthTable := dict -}}
{{- if hasKey $existing "model" -}}{{- $existingModels = index $existing "model" -}}{{- end -}}
{{- if hasKey $existing "auth_provider" -}}{{- $existingAuth = index $existing "auth_provider" -}}{{- end -}}
{{- if hasKey $existing "model_providers" -}}{{- $existingProviders = index $existing "model_providers" -}}{{- end -}}
{{- if hasKey $existing "endpoints" -}}{{- $existingEndpoints = index $existing "endpoints" -}}{{- end -}}
{{- if hasKey $existing "auth" -}}{{- $existingAuthTable = index $existing "auth" -}}{{- end -}}
{{- $endpointAliases := dict -}}
{{- range $alias, $prov := .llm.providers -}}
  {{- if or (hasKey $prov "base_url") (hasKey $prov "public_domain") -}}
    {{- $_ := set $endpointAliases $alias true -}}
  {{- end -}}
{{- end -}}
{{- $models := dict -}}
{{- range $key, $entry := $existingModels -}}
  {{- $drop := false -}}
  {{- if hasKey $endpointAliases $key -}}
    {{- $drop = true -}}
  {{- else if eq (kindOf $entry) "map" -}}
    {{- $mp := index $entry "model_provider" -}}
    {{- if and $mp (hasKey $endpointAliases $mp) -}}
      {{- $drop = true -}}
    {{- end -}}
  {{- end -}}
  {{- if not $drop -}}{{- $_ := set $models $key $entry -}}{{- end -}}
{{- end -}}
{{- $fast := dict "context_window" 500000 -}}
{{- if hasKey $models $grokFast -}}
  {{- $previous := index $models $grokFast -}}
  {{- if eq (kindOf $previous) "map" -}}
    {{- $fast = mergeOverwrite (deepCopy $previous) $fast -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $models $grokFast $fast -}}
{{- $_ := set $replace "model" $models -}}
{{- range $alias, $_ := $endpointAliases -}}
  {{- if hasKey $existingProviders $alias -}}{{- $remove = append $remove (printf "model_providers.%s" $alias) -}}{{- end -}}
  {{- if hasKey $existingAuth $alias -}}{{- $remove = append $remove (printf "auth_provider.%s" $alias) -}}{{- end -}}
{{- end -}}
{{- if not $winner -}}
  {{- if hasKey $existingEndpoints "models_base_url" -}}{{- $remove = append $remove "endpoints.models_base_url" -}}{{- end -}}
  {{- if hasKey $existingAuthTable "auth_provider_command" -}}{{- $remove = append $remove "auth.auth_provider_command" -}}{{- end -}}
{{- end -}}

{{ includeTemplate "config/merge" (dict
  "format" "toml"
  "input" (dig "stdin" "" .chezmoi)
  "managed" $managed
  "replace" $replace
  "remove" $remove
) }}
