{{- /* chezmoi:modify-template */ -}}

{{- $servers := includeTemplate "mcp/grok" (merge (dict "tool" "grok") .) | fromJson -}}
{{- $enabledPlugins := includeTemplate "plugins/enabled-names" (merge (dict "tool" "grok") .) | fromJson -}}

{{- $sources := list -}}
{{- range $marketplace := dig "marketplaces" (list) (dig "grok" (dict) .plugins) }}
  {{- $entry := dict "name" $marketplace.name -}}
  {{- if eq (default "git" $marketplace.source_type) "path" -}}
    {{- $_ := set $entry "path" $marketplace.source -}}
  {{- else -}}
    {{- $_ := set $entry "git" $marketplace.source -}}
  {{- end -}}
  {{- if hasKey $marketplace "branch" -}}
    {{- $_ := set $entry "branch" $marketplace.branch -}}
  {{- end -}}
  {{- $sources = append $sources $entry -}}
{{- end }}

{{- /* "auto" follows the OS light/dark appearance at runtime (polled every
       5s). Deliberately not `ternary ... .isDarkMode` — that is captured once
       when chezmoi init probes AppleInterfaceStyle, so it would freeze the
       theme and not even follow a later apply. */ -}}
{{- /* Pin the native Fast fallback's context separately from gateway SKUs;
       the native catalog otherwise selects its smaller default window. */ -}}
{{- $cfg := includeTemplate "llm/tool-config" (merge (dict "tool" "grok") .) | fromJson -}}
{{- $grokFast := printf "%s-build-fast" (index .llm.models "grok_primary") -}}
{{- $default := $grokFast -}}
{{- $managed := dict
  "ui" (dict "theme" "auto")
  "memory" (dict "enabled" true)
  "models" (dict "default" $default)
-}}
{{- $replace := dict
  "mcp_servers" $servers
  "plugins.enabled" $enabledPlugins
  "marketplace.sources" $sources
-}}
{{- $remove := list -}}
{{- /* A global authenticated models endpoint hides local model tables.
       Use provider-qualified local keys instead, so choosing a model also
       chooses its endpoint and credential without changing session auth. */ -}}
{{- if $cfg.model -}}
  {{- $_ := set $managed "models" (dict "default" $cfg.model) -}}
{{- end -}}
{{- $existing := dict -}}
{{- $prior := trim (dig "stdin" "" .chezmoi) -}}
{{- if $prior -}}{{- $existing = $prior | fromToml -}}{{- end -}}
{{- $existingModels := dict -}}
{{- $existingAuth := dict -}}
{{- $existingProviders := dict -}}
{{- $existingEndpoints := dict -}}
{{- $existingAuthTable := dict -}}
{{- if hasKey $existing "model" -}}{{- $existingModels = index $existing "model" -}}{{- end -}}
{{- if hasKey $existing "auth_provider" -}}{{- $existingAuth = index $existing "auth_provider" -}}{{- end -}}
{{- if hasKey $existing "model_providers" -}}{{- $existingProviders = index $existing "model_providers" -}}{{- end -}}
{{- if hasKey $existing "endpoints" -}}{{- $existingEndpoints = index $existing "endpoints" -}}{{- end -}}
{{- if hasKey $existing "auth" -}}{{- $existingAuthTable = index $existing "auth" -}}{{- end -}}
{{- $endpointAliases := dict -}}
{{- range $alias, $prov := .llm.providers -}}
  {{- if or (hasKey $prov "base_url") (hasKey $prov "public_domain") -}}
    {{- $_ := set $endpointAliases $alias true -}}
  {{- end -}}
{{- end -}}
{{- /* Include alias refs before host/protocol filtering: a disabled alias
       must still own and remove its formerly rendered rows. */ -}}
{{- range $refs := concat (list (default dict (index .llm "default_providers"))) (values (default dict (index .llm "provider_sets"))) (list (default dict (index (index .llm.tools "grok") "providers"))) -}}
  {{- if eq (kindOf $refs) "slice" -}}
    {{- range $alias := $refs -}}{{- $_ := set $endpointAliases $alias true -}}{{- end -}}
  {{- else -}}
    {{- range $alias, $_ := $refs -}}{{- $_ := set $endpointAliases $alias true -}}{{- end -}}
  {{- end -}}
{{- end -}}
{{- $models := dict -}}
{{- range $key, $entry := $existingModels -}}
  {{- $drop := false -}}
  {{- if or (hasKey $endpointAliases $key) (hasKey $endpointAliases (first (splitList "/" $key))) -}}
    {{- $drop = true -}}
  {{- else if eq (kindOf $entry) "map" -}}
    {{- $mp := index $entry "model_provider" -}}
    {{- if and $mp (hasKey $endpointAliases $mp) -}}
      {{- $drop = true -}}
    {{- end -}}
  {{- end -}}
  {{- if not $drop -}}{{- $_ := set $models $key $entry -}}{{- end -}}
{{- end -}}
{{- $fast := dict "context_window" 500000 -}}
{{- if hasKey $models $grokFast -}}
  {{- $previous := index $models $grokFast -}}
  {{- if eq (kindOf $previous) "map" -}}
    {{- $fast = mergeOverwrite (deepCopy $previous) $fast -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $models $grokFast $fast -}}
{{- $providers := deepCopy $existingProviders -}}
{{- $auth := deepCopy $existingAuth -}}
{{- range $alias, $_ := $endpointAliases -}}
  {{- $_ := unset $providers $alias -}}
  {{- $_ := unset $auth $alias -}}
{{- end -}}
{{- $passField := joinPath .chezmoi.homeDir "bin" "pass-field" -}}
{{- range $alias, $ep := $cfg.providers -}}
  {{- if $ep.base_url -}}
    {{- $endpoint := includeTemplate "llm/model-endpoint" $ep | fromJson -}}
    {{- $backend := "chat_completions" -}}
    {{- if eq $ep.type "openai-responses" -}}{{- $backend = "responses" -}}
    {{- else if eq $ep.type "anthropic-messages" -}}{{- $backend = "messages" -}}{{- end -}}
    {{- $base := trimSuffix "/" $endpoint.api_base_url -}}
    {{- if and (eq $backend "messages") (not (hasSuffix "/v1" $base)) -}}
      {{- $base = printf "%s/v1" $base -}}
    {{- end -}}
    {{- $provider := dict "base_url" $base "api_backend" $backend -}}
    {{- if hasKey $ep "headers" -}}{{- $_ := set $provider "extra_headers" $ep.headers -}}{{- end -}}
    {{- $usesHelper := ne $ep.auth_path "" -}}
    {{- if $usesHelper -}}
      {{- $args := list $ep.auth_path -}}
      {{- if $ep.auth_field -}}{{- $args = append $args $ep.auth_field -}}{{- end -}}
      {{- $_ := set $auth $alias (dict "command" $passField "args" $args) -}}
    {{- else if $ep.auth_key -}}
      {{- $_ := set $provider "api_key" $ep.auth_key -}}
    {{- end -}}
    {{- $_ := set $providers $alias $provider -}}
    {{- $source := dict -}}
    {{- if hasKey $ep "models" -}}
      {{- if eq (kindOf $ep.models) "slice" -}}
        {{- range $id := $ep.models -}}{{- $_ := set $source $id (dict "name" $id) -}}{{- end -}}
      {{- else if eq (kindOf $ep.models) "map" -}}
        {{- range $id, $name := $ep.models -}}{{- $_ := set $source $id (dict "name" $name) -}}{{- end -}}
      {{- end -}}
    {{- else -}}
      {{- $source = includeTemplate "llm/fetch-models" (merge (dict "metadata" true) $ep) | fromJson -}}
    {{- end -}}
    {{- $metadata := dict -}}
    {{- if hasKey $ep "model_metadata_args" -}}
      {{- $metadata = includeTemplate "llm/fetch-data-set" ($ep.model_metadata_args | fromJson) | fromJson -}}
    {{- end -}}
    {{- range $id, $discovered := $source -}}
      {{- $card := mergeOverwrite (deepCopy (default dict (index $metadata $id))) $discovered -}}
      {{- $card = mergeOverwrite $card (deepCopy (dig "model_overrides" $id (dict) $ep)) -}}
      {{- $entry := dict "model" $id "model_provider" $alias "name" (printf "%s/%s" $alias (default $id (index $card "name"))) -}}
      {{- if $usesHelper -}}{{- $_ := set $entry "auth_provider" $alias -}}{{- end -}}
      {{- $context := dig "limit" "context" 0 $card -}}
      {{- $output := dig "limit" "output" 0 $card -}}
      {{- if $context -}}{{- $_ := set $entry "context_window" $context -}}{{- end -}}
      {{- if $output -}}{{- $_ := set $entry "max_completion_tokens" $output -}}{{- end -}}
      {{- $_ := set $models (printf "%s/%s" $alias $id) $entry -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $replace "model" $models -}}
{{- $_ := set $replace "model_providers" $providers -}}
{{- $_ := set $replace "auth_provider" $auth -}}
{{- /* Remove the old single-endpoint mode, including a separate list URL
       which would otherwise keep the picker locked to the old catalog. */ -}}
{{- range $key := list "models_base_url" "models_list_url" -}}
  {{- if hasKey $existingEndpoints $key -}}{{- $remove = append $remove (printf "endpoints.%s" $key) -}}{{- end -}}
{{- end -}}
{{- if hasKey $existingAuthTable "auth_provider_command" -}}{{- $remove = append $remove "auth.auth_provider_command" -}}{{- end -}}

{{ includeTemplate "config/merge" (dict
  "format" "toml"
  "input" (dig "stdin" "" .chezmoi)
  "managed" $managed
  "replace" $replace
  "remove" $remove
) }}
