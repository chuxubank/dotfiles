{{- /* chezmoi:modify-template */ -}}

{{- $servers := includeTemplate "mcp/codex" . | fromJson -}}

{{- /* Projects trust map */ -}}
{{- $projects := dict -}}
{{- $trustedLevel := dict "trust_level" "trusted" -}}
{{- $trustedPaths := list
  .chezmoi.homeDir
  .chezmoi.workingTree
-}}
{{- range $path := values (omit .path.personal "pass") }}
  {{- $trustedPaths = append $trustedPaths (joinPath $.chezmoi.homeDir $path) -}}
{{- end }}
{{- range $path := $trustedPaths }}
  {{- $_ := set $projects $path $trustedLevel -}}
{{- end }}
{{- $trustedTreeKeys := list "iv" "aa" "asahiart" "xz" -}}
{{- range $k := $trustedTreeKeys }}
  {{- $root := joinPath $.chezmoi.homeDir (index $.path $k) -}}
  {{- if stat $root }}
    {{- $dirs := output "fd" "--hidden" "--no-ignore" "--min-depth" "1" "--max-depth" "1" "--type" "d" "--absolute-path" "--format" "{}" "." $root -}}
    {{- range $dir := splitList "\n" ($dirs | trim) }}
      {{- if $dir }}
        {{- $_ := set $projects $dir $trustedLevel -}}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- $cfg := includeTemplate "llm/tool-config" (merge (dict "tool" "codex") .) | fromJson -}}
{{- $model := $cfg.model -}}
{{- $modelProvider := "" -}}
{{- $modelParts := splitList "/" $model -}}
{{- if and (gt (len $modelParts) 1) (hasKey $cfg.providers (index $modelParts 0)) -}}
  {{- $modelProvider = index $modelParts 0 -}}
  {{- $model = join "/" (slice $modelParts 1) -}}
{{- end -}}
{{- if eq $modelProvider "openai" -}}{{- $modelProvider = "" -}}{{- end -}}
{{- $modelProviders := dict -}}
{{- range $alias, $ep := $cfg.providers }}
  {{- if eq $alias "openai" }}{{ continue }}{{ end -}}
  {{- $baseURL := trimSuffix "/" $ep.base_url -}}
  {{- if and $baseURL (not (hasSuffix "/v1" $baseURL)) -}}
    {{- $baseURL = printf "%s/v1" $baseURL -}}
  {{- end -}}
  {{- $provider := dict
    "name" $alias
    "base_url" $baseURL
  -}}
  {{- if $ep.auth_path }}
    {{- $args := list $ep.auth_path -}}
    {{- if $ep.auth_field }}
      {{- $args = list $ep.auth_path $ep.auth_field -}}
    {{- end }}
    {{- $_ := set $provider "auth" (dict
      "command" (joinPath $.chezmoi.homeDir "bin" "pass-field")
      "args" $args
      "timeout_ms" 5000
      "refresh_interval_ms" 300000
    ) -}}
  {{- end }}
  {{- $_ := set $modelProviders $alias $provider -}}
{{- end }}

{{- $managed := dict
  "model" $model
  "model_reasoning_effort" $cfg.reasoning_effort
  "mcp_servers" $servers
  "personality" "pragmatic"
  "features" (dict
    "multi_agent" true
    "goals" true
    "shell_snapshot" true
    "unified_exec" true
  )
  "tui" (dict "model_availability_nux" (dict "gpt-5.5" 4))
-}}
{{- $remove := list -}}
{{- if $modelProvider -}}
  {{- $_ := set $managed "model_provider" $modelProvider -}}
{{- else -}}
  {{- $remove = append $remove "model_provider" -}}
{{- end -}}
{{- $replace := dict "projects" $projects -}}
{{- if gt (len $modelProviders) 0 -}}
  {{- $_ := set $replace "model_providers" $modelProviders -}}
{{- else -}}
  {{- $remove = append $remove "model_providers" -}}
{{- end -}}

{{- $plugins := includeTemplate "plugins/enabled-map" (merge (dict "tool" "codex") .) | fromJson -}}
{{- $managedPlugins := dict -}}
{{- range $plugin, $enabled := $plugins -}}
  {{- $managedPlugins = setValueAtPath (printf "%s.enabled" $plugin) $enabled $managedPlugins -}}
{{- end -}}
{{- $_ := set $managed "plugins" $managedPlugins -}}

{{- $desktop := dict
  "ambient-suggestions-enabled" true
  "appearanceLightCodeThemeId" "codex"
  "conversationDetailMode" "STEPS_COMMANDS"
  "enabled-reasoning-efforts" (list "low" "medium" "high" "xhigh" "ultra" "max")
  "git-pull-request-merge-method" "merge"
  "git-show-sidebar-pr-icons" true
  "keepRemoteControlAwakeWhilePluggedIn" true
  "preventSleepWhileRunning" true
  "show-context-window-usage" true
-}}
{{- $_ := set $managed "desktop" $desktop -}}

{{ includeTemplate "config/merge" (dict
  "format" "toml"
  "input" (dig "stdin" "" .chezmoi)
  "managed" $managed
  "replace" $replace
  "remove" $remove
) }}
