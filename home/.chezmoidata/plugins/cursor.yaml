# yaml-language-server: $schema=../../../schemas/plugins.schema.json
plugins:
  # Cursor local plugins are archive externals, not account-level marketplace
  # installs. source is an archive URL; name is its top-level plugin directory.
  # home/dot_cursor/plugins/local/.chezmoiexternal.toml.tmpl extracts only that
  # directory. Cursor discovers the unpacked manifest on reload.
  cursor:
    providers:
      - name: pstack
        description: Rigorous engineering workflows, skills, and review agents
        source: https://github.com/cursor/plugins/archive/refs/heads/main.tar.gz
