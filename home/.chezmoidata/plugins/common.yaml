plugins:
  # Cross-tool plugins. Each entry needs a `sources` map keyed by tool name;
  # a tool absent from `sources` simply does not get the plugin.
  # Tool-specific plugins live in plugins/<tool>.yaml instead.
  providers:
    - name: superpowers
      description: Superpowers skills and workflows
      sources:
        claude-code: superpowers@claude-plugins-official
        codex: superpowers@openai-curated
        opencode: superpowers@git+https://github.com/obra/superpowers.git
      when:
        enabled: false
