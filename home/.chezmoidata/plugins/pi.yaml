plugins:
  # pi-only packages (plugins/pi.yaml). The tool is implied by the filename,
  # so a plain `source` string is enough. `when` conditions work the same as
  # elsewhere.
  #
  # Sources follow pi's package spec: `npm:<pkg>[@version]`, `git:<host>/<repo>[@ref]`,
  # or an absolute/relative local path. Versioned specs are pinned and skipped
  # by `pi update`.
  pi:
    providers:
      - name: pi-mcp-adapter
        description: >-
          MCP client for pi, exposed as one proxy tool instead of hundreds of
          tool definitions. pi ships no built-in MCP, so this is what makes
          mcp.yaml reachable. Reads <pi agent dir>/mcp.json.
          Needs the @earendil-works pi (>= 2.11 peers on @earendil-works/pi-ai);
          it fails to load against the retired @mariozechner build.
        source: npm:pi-mcp-adapter

      - name: pi-computer-use
        description: >-
          Desktop computer-use tools for Pi on macOS, Windows, and Linux.
          macOS requires Accessibility and Screen Recording permissions.
        source: npm:@injaneity/pi-computer-use

      - name: pi-subagents
        description: >-
          Delegate work to focused child Pi agents (scout, researcher, worker,
          reviewer, oracle) with foreground/background runs and fleet view.
        source: npm:pi-subagents

      - name: pi-web-access
        description: >-
          Web search and URL fetching for Pi, with additional GitHub, PDF,
          YouTube, and local-video content extraction.
        source: npm:pi-web-access

      - name: pi-edit-session-in-place
        description: >-
          Re-edit or delete an earlier user or assistant message in the
          current Pi session branch.
        source: npm:pi-edit-session-in-place

      - name: pi-input-history
        description: >-
          Persist prompt history across sessions and provide fuzzy reverse
          search from the editor.
        source: npm:pi-input-history
