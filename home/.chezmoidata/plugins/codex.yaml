plugins:
  # Codex-only plugins (plugins/codex.yaml). The tool is implied by the
  # filename, so a plain `source` string is enough. `when` conditions work
  # the same as elsewhere.
  codex:
    marketplaces:
      - name: mindreset-dot-skill
        source: https://github.com/MindReset/dot_skill.git
        source_type: git

      - name: sentry-plugin-marketplace
        source: https://github.com/getsentry/plugin-codex.git
        source_type: git

    providers:
      - name: github
        description: GitHub repository and PR workflows
        source: github@openai-curated

      - name: kotlin-agent-skills
        description: Kotlin tooling and migration skills
        source: kotlin-agent-skills@Kotlin

      - name: test-android-apps
        description: Android emulator QA workflows
        source: test-android-apps@openai-curated

      - name: zotero
        description: Search the local Zotero library, export BibTeX, and insert citations
        source: zotero@openai-curated
        when:
          enabled: false

      - name: browser
        source: browser@openai-bundled

      - name: browser-use
        source: browser-use@openai-bundled

      - name: chrome
        source: chrome@openai-bundled

      - name: computer-use
        source: computer-use@openai-bundled

      - name: latex
        source: latex@openai-bundled

      - name: record-and-replay
        source: record-and-replay@openai-bundled

      - name: documents
        source: documents@openai-primary-runtime

      - name: dot-skill
        description: Dot. device control and Canvas layout skills
        source: dot-skill@mindreset-dot-skill

      - name: presentations
        source: presentations@openai-primary-runtime

      - name: spreadsheets
        source: spreadsheets@openai-primary-runtime
