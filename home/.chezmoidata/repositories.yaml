# Git repositories managed by chezmoi externals.
# path resolves through path.toml; dest appends a repo directory to a tree root.
# Keep entries in path.toml namespace/key order.
repository_conditions:
  non_ci: &non_ci
    disabled:
      host_env: [ci]
  personal_only: &personal_only
    enabled:
      host_env: [personal]
  personal_or_iv: &personal_or_iv
    enabled:
      host_env: [personal, iv]
  aa_only: &aa_only
    enabled:
      host_env: [aa]

repositories:
  # path.personal
  - path: [personal, pass]
    url: https://github.com/chuxubank/pass
    refresh_period: 4h
    when: *non_ci

  - path: [personal, beancount]
    url: https://github.com/chuxubank/beancount
    refresh_period: 24h
    when: *non_ci

  - path: [personal, proxy]
    url: https://github.com/chuxubank/proxy-config
    refresh_period: 4h
    branch: stable
    when: *non_ci

  - path: [personal, keyboard]
    url: https://github.com/chuxubank/keyboard-config
    refresh_period: 4h
    when: *non_ci

  - path: [personal, emacs]
    url: https://github.com/cat-emacs/cat-emacs
    refresh_period: 4h
    when: *non_ci

  - path: [personal, org]
    url: https://github.com/chuxubank/org
    refresh_period: 4h
    when: *non_ci

  - path: [personal, org-roam]
    url: https://github.com/chuxubank/org-roam
    refresh_period: 4h
    when: *non_ci

  - path: [personal, blog]
    url: https://github.com/chuxubank/chuxubank.github.io
    refresh_period: 4h
    when: *non_ci

  - path: [personal, skills]
    url: https://github.com/chuxubank/skills
    refresh_period: 4h
    when: *non_ci

  # path.workspace.asahiart
  - path: [workspace, asahiart]
    dest: Arborist
    url: https://github.com/AsahiArt/Arborist
    refresh_period: 4h
    when: *personal_only

  - path: [workspace, asahiart]
    dest: Luvia
    url: https://github.com/AsahiArt/Luvia
    refresh_period: 4h
    when: *personal_or_iv

  - path: [workspace, asahiart]
    dest: font-subset-gradle-plugin
    url: https://github.com/AsahiArt/font-subset-gradle-plugin
    refresh_period: 4h
    when: *personal_only

  - path: [workspace, asahiart]
    dest: org-parser
    url: https://github.com/AsahiArt/org-parser
    refresh_period: 4h
    when: *personal_only

  - path: [workspace, asahiart]
    dest: quote0-school-calendar
    url: https://github.com/AsahiArt/quote0-school-calendar
    refresh_period: 4h
    when: *personal_only

  - path: [workspace, asahiart]
    dest: tree-sitter-template
    url: https://github.com/AsahiArt/tree-sitter-template
    refresh_period: 4h
    when: *personal_only

  # path.workspace.iv
  - path: [workspace, iv]
    dest: agentia
    url: git@git.infinityparadise.com:agentia/agentia.git
    refresh_period: 4h
    when: *personal_or_iv

  - path: [workspace, iv]
    dest: ivc
    url: git@git.infinityparadise.com:mobile/ivc.git
    refresh_period: 4h
    when: *personal_or_iv

  # path.workspace.opentactic
  - path: [workspace, opentactic]
    dest: OpenTactic
    url: https://github.com/OpenTactic/OpenTactic
    refresh_period: 4h
    when: *personal_only

  # path.workspace.xz source trees
  - path: [workspace, xz]
    dest: AndroidCI
    url: https://github.com/OpenXingZhi/AndroidCI
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: HardwareServerContainer
    url: https://github.com/OpenXingZhi/HardwareServerContainer
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: Inventory
    url: https://github.com/OpenXingZhi/Inventory
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: RobotDroid
    url: https://github.com/OpenXingZhi/RobotDroid
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: license-library
    url: https://github.com/OpenXingZhi/license-library
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: remote-config
    url: https://github.com/OpenXingZhi/remote-config
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: rfid-codec
    url: https://github.com/OpenXingZhi/rfid-codec
    refresh_period: 48h
    when: *personal_only

  - path: [workspace, xz]
    dest: trusted-time
    url: https://github.com/OpenXingZhi/trusted-time
    refresh_period: 48h
    when: *personal_only

  # Gitee write targets and runtime sources; available on every non-CI host.
  - path: [workspace, xz]
    dest: InventoryConfig
    url: https://gitee.com/star-spider-intelligence/inventory-config
    refresh_period: 48h
    when: *non_ci

  - path: [workspace, xz]
    dest: RobotDroidConfig
    url: https://gitee.com/star-spider-intelligence/robot-droid-config
    refresh_period: 48h
    when: *non_ci

  # path.workspace.oss — third-party projects we contribute to. url is our
  # fork (origin, where we push); upstream is what refresh follows.
  - path: [workspace, oss]
    dest: beancount-language-server
    url: https://github.com/cat-emacs/beancount-language-server
    upstream: https://github.com/polarmutex/beancount-language-server
    refresh_period: 48h
    branch: main
    when: *non_ci

  - path: [workspace, oss]
    dest: chezmoi
    url: https://github.com/chuxubank/chezmoi
    upstream: https://github.com/twpayne/chezmoi
    refresh_period: 48h
    branch: master
    when: *non_ci

  - path: [workspace, oss]
    dest: luvus
    url: https://github.com/chuxubank/luvus
    upstream: https://github.com/RizRiyz/luvus
    refresh_period: 48h
    branch: main
    when: *non_ci

  # path.workspace.example — third-party trees we only read or build against.
  - path: [workspace, example]
    dest: Android/nowinandroid
    url: https://github.com/android/nowinandroid.git
    refresh_period: 168h
    when: *non_ci

  - path: [workspace, example]
    dest: KMP/compose-multiplatform
    url: https://github.com/JetBrains/compose-multiplatform.git
    refresh_period: 168h
    when: *non_ci

  - path: [workspace, example]
    dest: Raycast/script-commands
    url: https://github.com/raycast/script-commands.git
    refresh_period: 24h
    depth: 1
    when:
      enabled:
        os: darwin
      disabled:
        host_env: [ci]

  - path: [workspace, example]
    dest: Concourse/ci
    url: https://github.com/concourse/ci
    refresh_period: 24h
    when: *aa_only

  - path: [workspace, example]
    dest: Concourse/examples
    url: https://github.com/concourse/examples
    refresh_period: 24h
    when: *aa_only

  - path: [workspace, example]
    dest: QMK
    url: https://github.com/qmk/qmk_firmware
    refresh_period: 48h
    when:
      enabled:
        roles: [qmk]
      disabled:
        host_env: [ci]

  # path.tool
  - path: [tool, plum]
    url: https://github.com/rime/plum
    refresh_period: 168h
