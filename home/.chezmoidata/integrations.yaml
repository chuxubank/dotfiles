# yaml-language-server: $schema=../../schemas/integrations.schema.json
# Shared target-agent roots for conservative empty-directory cleanup.
integration_agents:
  claude-code: ".claude"
  codex: ".codex"
  cursor: ".cursor"
  gemini-cli: ".gemini"
  github-copilot: ".copilot"
  grok: ".grok"
  opencode: ".config/opencode"
  omp: ".omp"
  pi: ".pi"

# Integration owners are lifecycle-affiliated with matching tools.yaml names.
integration_owners:
  herdr:
    lifecycle:
      label: Herdr
      binary: herdr
      install: [herdr, integration, install, "{args}"]
      uninstall: [herdr, integration, uninstall, "{args}"]
      uninstall_disabled: true
      skip_errors: ["not found"]
      uninstall_all: [pi, omp, claude, codex, copilot, devin, droid, kimi,
        opencode, kilo, hermes, qodercli, cursor, mastracode, antigravity-cli, grok]
      cleanup:
        needles: [herdr-agent-state.sh, herdr-agent-state.ts, herdr-agent-state.js]
        standalone:
          claude-code: [.claude/hooks/herdr-agent-state.sh]
          codex: [.codex/herdr-agent-state.sh]
          cursor: [.cursor/herdr-agent-state.sh]
          gemini-cli: [.gemini/config/hooks/herdr-agent-state.sh]
          github-copilot: [.copilot/hooks/herdr-agent-state.sh]
          grok: [.grok/hooks/herdr-agent-state.sh, .grok/hooks/herdr.json]
          opencode: [.config/opencode/plugins/herdr-agent-state.js]
          pi: [.pi/agent/extensions/herdr-agent-state.ts]
        json_hooks:
          claude-code: [.claude/settings.json]
          codex: [.codex/hooks.json]
          cursor: [.cursor/hooks.json]
        extras:
          - .omp/agent/extensions/herdr-omp-agent-state.ts
          - .config/devin/herdr-agent-state.sh
          - .factory/hooks/herdr-agent-state.sh
          - .kimi-code/hooks/herdr-agent-state.sh
          - .config/kilo/plugin/herdr-agent-state.js
          - .hermes/plugins/herdr-agent-state/__init__.py
          - .qoder/hooks/herdr-agent-state.sh
          - .mastracode/hooks/herdr-agent-state.sh
    targets:
      - tool: claude-code
        args: ["claude"]
      - tool: codex
        args: ["codex"]
      - tool: cursor
        args: ["cursor"]
      - tool: gemini-cli
        args: ["antigravity-cli"]
      - tool: github-copilot
        args: ["copilot"]
      - tool: grok
        args: ["grok"]
      - tool: opencode
        args: ["opencode"]
      - tool: pi
        args: ["pi"]

  orca:
    lifecycle:
      label: Orca
      setup: false
      cleanup:
        needles: [.orca/agent-hooks/, ORCA_AGENT_HOOK_, "@orca-managed"]
        command_fields: [command, bash]
        standalone:
          github-copilot: [.copilot/hooks/orca.json]
          grok: [.grok/hooks/orca-status.json]
          pi:
            - .pi/agent/extensions/orca-agent-status.ts
            - .pi/agent/extensions/orca-prefill.ts
            - .pi/agent/extensions/orca-titlebar-spinner.ts
        json_hooks:
          claude-code: [.claude/settings.json, .claude/hooks.json]
          codex: [.codex/hooks.json, .codex/hooks.json.bak]
          cursor: [.cursor/hooks.json, .cursor/hooks.json.bak]
        managed_blocks:
          - path: .kimi-code/config.toml
            start: "# >>> orca-managed-kimi-hooks"
            end: "# <<< orca-managed-kimi-hooks <<<"
    targets:
      - tool: claude-code
      - tool: codex
      - tool: cursor
      - tool: gemini-cli
      - tool: github-copilot
      - tool: grok
      - tool: opencode
      - tool: pi

  rtk:
    lifecycle:
      label: RTK
      os: [android, darwin, linux]
      binary: rtk
      install: [rtk, init, "{args}"]
      uninstall: [rtk, init, "{args}", --uninstall]
      skip_errors: ["no such file", "not found"]
      cleanup:
        standalone:
          claude-code: [.claude/RTK.md]
          codex: [.codex/RTK.md]
          gemini-cli: [.gemini/hooks/rtk-hook-gemini.sh, .gemini/hooks/.rtk-hook.sha256]
          github-copilot: [.copilot/hooks/rtk-rewrite.json]
          opencode: [.config/opencode/plugins/rtk.ts]
          pi: [.pi/agent/extensions/rtk.ts]
        json_hooks:
          claude-code: [.claude/settings.json]
          cursor: [.cursor/hooks.json]
          gemini-cli: [.gemini/settings.json]
        command_exact: [rtk]
        command_prefixes: ["rtk "]
        needles: ["rtk hook", rtk-hook-]
        markdown_refs:
          patterns: ['^@(?:.*/)?RTK\.md\s*$']
          agents:
            claude-code: [.claude/CLAUDE.md]
            codex: [.codex/AGENTS.md]
        marked_files:
          gemini-cli:
            - path: .gemini/GEMINI.md
              contains: ["Rust Token Killer"]
              head_contains: ["# RTK"]
              head_chars: 120
          github-copilot:
            - path: .copilot/copilot-instructions.md
              contains: ["Rust Token Killer"]
              head_contains: ["# RTK"]
              head_chars: 120
    targets:
      - tool: claude-code
        args: ["--global", "--auto-patch"]
      - tool: codex
        args: ["--global", "--codex"]
      - tool: gemini-cli
        args: ["--global", "--gemini", "--auto-patch"]
      - tool: opencode
        args: ["--global", "--opencode"]
      - tool: pi
        args: ["--global", "--agent", "pi"]
      - tool: cursor
        args: ["--global", "--agent", "cursor", "--auto-patch"]
      - tool: github-copilot
        args: ["--global", "--copilot"]

  termio:
    lifecycle:
      label: Termio
      binary: termio
      cleanup:
        needles: [termio-hooks, "termio agent report", "Application Support/termio"]
        standalone:
          grok: [.grok/hooks/termio.json]
          opencode: [.config/opencode/plugin/termio.js]
          pi: [.pi/agent/extensions/termio.js]
        json_hooks:
          claude-code: [.claude/settings.json]
          codex: [.codex/hooks.json]
          cursor: [.cursor/hooks.json]
        extras: [.config/amp/plugins/termio.ts]
    targets:
      - tool: claude-code
      - tool: codex
      - tool: cursor
      - tool: grok
      - tool: opencode
      - tool: pi

  worktrunk:
    lifecycle:
      label: Worktrunk
      os: [android, darwin, linux]
      binary: wt
      install: [wt, config, plugins, "{args}", install, --yes]
      uninstall: [wt, config, plugins, "{args}", uninstall, --yes]
      uninstall_disabled: true
      skip_errors: ["not found", "no such file", "unrecognized subcommand"]
      target_env:
        pi:
          PI_CODING_AGENT_DIR: "~/.pi/agent"
          PI_PROFILE: null
          OMP_PROFILE: null
        omp:
          PI_CODING_AGENT_DIR: null
          PI_CONFIG_DIR: null
          PI_PROFILE: null
          OMP_PROFILE: null
      cleanup:
        standalone:
          pi:
            - .pi/agent/extensions/worktrunk.ts
            - .pi/agent/hooks/pre/worktrunk.ts
      post_install:
        pi:
          move:
            from: .pi/agent/hooks/pre/worktrunk.ts
            to: .pi/agent/extensions/worktrunk.ts
          replacements:
            - ['import type { HookAPI } from "@oh-my-pi/pi-coding-agent/extensibility/hooks"', 'import type { ExtensionAPI } from "@earendil-works/pi-coding-agent"']
            - [HookAPI, ExtensionAPI]
    # Worktrunk's `pi` plugin writes hooks/pre/worktrunk.ts (OMP layout).
    # Earendil Pi renamed hooks/ to extensions/, so the runner relocates
    # that file to ~/.pi/agent/extensions/worktrunk.ts after install.
    targets:
      - tool: claude-code
        args: ["claude"]
        installed:
          path: .claude/plugins/installed_plugins.json
          contains: ['"worktrunk@worktrunk"', '"scope": "user"']
      - tool: codex
        args: ["codex"]
        installed:
          path: .codex/config.toml
          contains:
            - |-
              [plugins."worktrunk@worktrunk"]
                  enabled = true
      - tool: opencode
        args: ["opencode"]
        installed:
          path: .config/opencode/plugins/worktrunk.ts
          contains: ["Worktrunk activity tracking plugin for OpenCode"]
      - tool: omp
        args: ["pi"]
        installed:
          path: .omp/agent/hooks/pre/worktrunk.ts
          contains: ["Worktrunk activity tracking hook for Pi / oh-my-pi", "HookAPI"]
      - tool: pi
        args: ["pi"]
        installed:
          path: .pi/agent/extensions/worktrunk.ts
          contains: ["Worktrunk activity tracking hook for Pi / oh-my-pi", "ExtensionAPI"]
