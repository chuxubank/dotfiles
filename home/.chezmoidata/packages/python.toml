[packages.python]
tools = [
  "beancount",
  "black",
  "fava",
  "git-filter-repo",
  "homeassistant-cli",
  "keymap-drawer",
  "kimi-cli",
  "my_cookies",
  "pygments",
  "pylint",
  "python-lsp-server",
  "you-get",
  "yt-dlp[default]",
  { name = "markitdown[all]", version = "3.12" },
  { name = "aider-chat[help]", version = "3.12", with = "pip,playwright", when.enabled = false },
  { name = "ansible", with-exec = "ansible-core,ansible-lint", with = "requests" },
  { name = "pyglossary", with = "prompt_toolkit,python-idzip,lxml" },
  { name = "qmk", with-exec = "argcomplete" },
]
