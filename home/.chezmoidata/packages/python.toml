[packages.python]
tools = [
  "beancount",
  "black",
  "fava",
  "git-filter-repo",
  "hf",
  "homeassistant-cli",
  "keymap-drawer",
  "kimi-cli",
  "my-cookies",
  "pygments",
  "pylint",
  "python-lsp-server",
  "you-get",
  { name = "aider-chat", extra = "help", version = "3.12", with = "pip,playwright", when.enabled = false },
  { name = "ansible", with-exec = "ansible-core,ansible-lint", with = "requests" },
  { name = "mlx-vlm", with-exec = "mlx-lm", when.enabled = { os = "darwin", roles = "llm" } },
  { name = "markitdown", extra = "all", version = "3.12" },
  { name = "pyglossary", with = "prompt_toolkit,python-idzip,lxml" },
  { name = "qmk", with-exec = "argcomplete", when.enabled.roles = "qmk" },
  { name = "yt-dlp", extra = "default" },
]
