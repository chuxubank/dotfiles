[packages.rust]
cargo = [
  "cargo-update",
  # Homebrew bottles the release tag. Install the fork's main so the binary
  # matches its upstream fast-forward.
  { name = "beancount-language-server", git = "https://github.com/cat-emacs/beancount-language-server.git", branch = "main" },
  { name = "dot-aep", git = "https://github.com/virtualritz/dot-aep", example = "dump", owner = "dot-aep" },
  # The npm wrapper resolves upstream's released platform binary, so build the
  # fork directly to include its Rust changes.
  { name = "lsp-proxy", git = "https://github.com/cat-emacs/lsp-proxy.git", branch = "feat/project-activation" },
  { name = "lukaj", when.enabled.os = "darwin" },
  "mermaid-rs-renderer",
  "rust-script",
  { name = "starlists", git = "https://github.com/chuxubank/starlists" },
]
