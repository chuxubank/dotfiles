[packages.apt]
pkg = [
  "aspell",
  "aspell-en",
  "cmake",
  { name = "emacs", when.disabled.host_env = ["cloud"] },
  { name = "emacs-nox", when.enabled.host_env = ["cloud"] },
  { name = "fd-find", when.enabled.host_env = ["cloud"] },
  "fzf",
  "gh",
  "git",
  "git-lfs",
  "gnupg",
  "golang-go",
  "imagemagick",
  { name = "ispell", when.enabled.host_env = ["cloud"] },
  "isync",
  "jq",
  "libssl-dev",
  "logrotate",
  { name = "maildir-utils", when.enabled.host_env = ["cloud"] },
  "nodejs",
  "npm",
  "pass",
  "pkg-config",
  "plantuml",
  "python3",
  { name = "python3-dev", when.enabled.host_env = ["cloud"] },
  { name = "rclone", owner = "rclone" },
  "ripgrep",
  "rsync",
  "rustup",
  "shellcheck",
  "sshpass",
  "tmux",
  "wget",
  "zip",
  "zsh",
]
