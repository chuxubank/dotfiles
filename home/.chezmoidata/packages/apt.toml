[packages.apt]
pkg = [
  "aspell",
  "aspell-en",
  "cmake",
  "fzf",
  "gh",
  "git",
  "git-lfs",
  "gnupg",
  "jq",
  "libssl-dev",
  "logrotate",
  "pass",
  "pkg-config",
  "rclone",
  "ripgrep",
  "rsync",
  "rustup",
  "sshpass",
  "tmux",
  "wget",
  "zip",
  "zsh",
  { name = "emacs", when.disabled.host_env = ["ci"] },
  { name = "imagemagick", when.disabled.host_env = ["ci"] },
  { name = "isync", when.disabled.host_env = ["ci"] },
  { name = "nodejs", when.disabled.host_env = ["ci"] },
  { name = "npm", when.disabled.host_env = ["ci"] },
  { name = "plantuml", when.disabled.host_env = ["ci"] },
]
