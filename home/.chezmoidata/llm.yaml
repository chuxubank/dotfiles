llm:
  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools can override auth.field to use a different API key from the
  # same pass path.
  #
  # type: openai (default) | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  providers:
    iv:
      base_url: "http://llm.invalley.co"
      auth:
        path: Work/IV/LLM
        field: cc-auth-token
      when:
        enabled:
          host_env: ["iv"]

    openai:
      auth:
        path: Personal/Tech/AI/OpenAI
        field: api-key

    google:
      type: gemini
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    openrouter:
      base_url: "https://openrouter.ai"
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      when:
        enabled:
          roles: ["llm"]

  # ── Tool defaults ──────────────────────────────────────────────────
  # Per-tool model selection.  `providers` overrides only the auth
  # field used for a given provider (the base_url stays the same).
  #
  # Provider reference formats:
  #   Short:  providers: [iv, ollama]
  #   Map:    providers:
  #             anthropic:
  #               provider: iv
  #               auth_field: cc-auth-token
  tools:
    opencode:
      model: anthropic/claude-opus-4-7
      small_model: iv/qwen3.6-plus
      providers:
        anthropic:
          provider: iv
          models: false
        iv:
          provider: iv
          auth_field: anthropic-auth-token
        ollama:
          provider: ollama

    claude-code:
      model: opusplan
      providers:
        anthropic:
          provider: iv

    codex:
      model: gpt-5.4
      reasoning_effort: medium

    aider:
      model: gemini-2.5-pro
      providers:
        gemini:
          provider: google
          auth_field: aider-gemini-api-key

    goose:
      model: z-ai/glm-4.5-air:free
      providers: [openrouter]
