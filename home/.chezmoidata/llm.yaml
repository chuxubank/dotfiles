llm:
  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools can override auth.field to use a different API key from the
  # same pass path.
  #
  # type: openai (default) | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  providers:
    iv:
      base_url: "http://llm.invalley.co"
      auth:
        path: Work/IV/LLM
      when:
        enabled:
          host_env: ["iv"]

    openai:
      base_url: "https://api.openai.com"
      auth:
        path: Personal/Tech/AI/OpenAI
        field: api-key

    google:
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    openrouter:
      base_url: "https://openrouter.ai"
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      when:
        enabled:
          roles: ["llm"]

    opencode:
      base_url: "https://models.dev"
      type: opencode

  # ── Tool defaults ──────────────────────────────────────────────────
  # Per-tool model selection.  `providers` overrides only the auth
  # field used for a given provider (the base_url stays the same).
  #
  # Provider reference formats:
  #   Short:  providers: [iv, ollama]
  #   Map:    providers:
  #             anthropic:
  #               provider: iv
  #               auth_field: cc-auth-token
  tools:
    opencode:
      model:
        - openai/gpt-5.5
        - anthropic/claude-opus-4-7
        - opencode/deepseek-v4-flash-free
      small_model:
        - iv/deepseek-v4-flash
        - openrouter/openai/gpt-oss-120b:free
      providers:
        openai:
          provider: iv
          models: false
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          models: false
          auth_field: cc-auth-token
        iv:
          provider: iv
          auth_field: default-auth-token
        ollama:
          provider: ollama
        opencode:
          provider: opencode

    claude-code:
      model: opusplan
      providers:
        anthropic:
          provider: iv
          auth_field: cc-auth-token

    codex:
      model: gpt-5.5
      reasoning_effort: medium

    aider:
      model: gemini-2.5-pro
      providers:
        gemini:
          provider: google
          auth_field: aider-gemini-api-key

    goose:
      model: z-ai/glm-4.5-air:free
      providers: [openrouter]
