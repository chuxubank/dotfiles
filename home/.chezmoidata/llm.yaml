llm:
  # ── Data sets (model catalogs, independent from inference providers) ──
  data_sets:
    models-dev:
      type: models-dev
      file_path: models-dev-api

  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools can override auth.field to use a different API key from the
  # same pass path.
  #
  # type: openai (default) | anthropic | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  providers:
    iv:
      name: IV
      data_set: models-dev
      base_url: "http://llm.invalley.co"
      auth:
        path: Work/IV/LLM
      when:
        enabled:
          host_env: ["iv"]

    openai:
      name: OpenAI
      base_url: "https://api.openai.com"
      auth:
        path: Personal/Tech/AI/OpenAI
        field: api-key

    google:
      name: Google
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    openrouter:
      name: OpenRouter
      base_url: "https://openrouter.ai/api"
      timeout: 10
      models_cache: openrouter-models-api
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      name: Ollama
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      when:
        enabled:
          roles: ["llm"]

    opencode:
      data_set: models-dev
      provider: opencode
      filter:
        cost:
          input: 0
          output: 0
        modalities:
          input: ["text", "image"]

  # ── Tool defaults ──────────────────────────────────────────────────
  # Per-tool model selection.  `providers` overrides only the auth
  # field used for a given provider (the base_url stays the same).
  #
  # Provider reference formats:
  #   Short:  providers: [iv, ollama]
  #   Map:    providers:
  #             anthropic:
  #               provider: iv
  #               type: anthropic
  #               auth_field: cc-auth-token
  tools:
    opencode:
      model:
        - anthropic/claude-opus-4-8
        - openai/gpt-5.6-sol
        - opencode/deepseek-v4-flash-free
      small_model:
        - iv/deepseek-v4-flash
        - opencode/deepseek-v4-flash-free
        - openrouter/openai/gpt-oss-120b:free
      providers:
        openai:
          provider: iv
          models: false
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          models: false
          auth_field: cc-auth-token
        iv:
          provider: iv
          auth_field: default-auth-token
        ollama:
          provider: ollama
        openrouter:
          provider: openrouter
        opencode:
          provider: opencode

    claude-code:
      model: opusplan
      # Each key → ANTHROPIC_DEFAULT_<KEY>_MODEL env var (opus/sonnet/haiku/fable).
      # Only emitted when an anthropic provider resolves (i.e. iv is enabled).
      default_models:
        opus: claude-opus-4-8
        sonnet: claude-sonnet-5
        haiku: claude-haiku-4-5-20251001
      providers:
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token

    codex:
      model:
        - iv/gpt-5.6-sol
        - openai/gpt-5.5
        - openrouter/openai/gpt-oss-120b:free
      reasoning_effort: high
      providers:
        iv:
          provider: iv
          auth_field: codex-auth-token
        openai:
          provider: openai
        openrouter:
          provider: openrouter

    aider:
      model: gemini-2.5-pro
      providers:
        gemini:
          provider: google
          auth_field: aider-gemini-api-key

    goose:
      model: z-ai/glm-4.5-air:free
      providers: [openrouter]

    craft-agents:
      model:
        - openai/gpt-5.5
        - anthropic/claude-opus-4-7
        - opencode/deepseek-v4-flash-free
      providers:
        openai:
          name: OpenAI (IV)
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          name: Anthropic (IV)
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        iv:
          provider: iv
          auth_field: default-auth-token
        openrouter:
          provider: openrouter
        ollama:
          provider: ollama
