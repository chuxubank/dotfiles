# Declared tools. A name listed here is the single enablement switch.
# Lifecycle affiliation in data files is `owner` (packages, skill
# providers, defaults). Services and environment groups use `tool` as
# identity and set `owner` only when they should follow a switch.
# Skill `when.*.tool`, plugin/mcp `tool`, and integrations `tool`
# values are the target agent, not the owner. Tools with integrations declare
# install, uninstall, and conservative cleanup actions in integration_lifecycle;
# the shared integration engine executes only its finite action schema.
# Every `owner` must be a name listed here.
#
# remove: chezmoi-managed dest paths deleted via .chezmoiremove when the
# tool is off. purge: runtime data (login state, history, caches); applied
# only when policies.purge_disabled_tools is on.
# A trailing /** wipes directory contents. The directory itself is ignored
# in the source state so apply does not recreate it (ignore of that exact
# path would also block .chezmoiremove). Managed files at the dest root
# (e.g. .claude.json) are emptied in their templates instead.
# Every remove/purge path must sit under a directory this tool owns, so the
# parent that disabled-ignore derives is never a shared tree. A managed file
# in a shared tree (e.g. bin/) belongs in neither list: gate its template on
# tool/enabled and it renders empty, which chezmoi removes on its own.
tools:
  claude-code:
    when:
      enabled:
        host_env: [iv]
    remove:
      - ".claude/settings.json"
      - ".claude/statusline.sh"
    purge:
      - ".claude.json.backup"
      - ".claude/**"

  codex:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".codex/config.toml"
      - ".codex/model-catalog.json"
    purge:
      - ".codex/**"

  cursor:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".cursor/mcp.json"
      - ".cursor/cli-config.json"
    purge:
      - ".cursor/**"

  gemini-cli:
    when:
      enabled: false
    remove:
      - ".gemini/antigravity-cli/mcp_config.json"
    purge:
      - ".gemini/**"

  goose:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/goose/config.yaml"
    purge:
      - ".config/goose/**"

  grok:
    remove:
      - ".grok/config.toml"
      - ".grok/trusted_folders.toml"
    purge:
      - ".grok/**"

  github-copilot:
    when:
      disabled:
        host_env: [ci]
    purge:
      - ".copilot/**"

  hermes:
    when:
      enabled: false
    remove:
      - ".hermes/config.yaml"
      - ".hermes/SOUL.md"
    purge:
      # The vendor checkout lives at .hermes/hermes-agent/. Do not
      # purge .hermes/** or a disable wipes the install.
      - ".hermes/auth.json"
      - ".hermes/.env"
      - ".hermes/memories/**"
      - ".hermes/sessions/**"
      - ".hermes/cron/**"
      - ".hermes/logs/**"
      - ".hermes/mcp-tokens/**"

  herdr:
    when:
      enabled: false
    remove:
      - ".config/herdr/config.toml"
      - ".config/herdr/plugins/config/herdr-spreader/config.yaml"
    purge:
      - ".config/herdr/**"
    # Agent-owned hook files cannot live in remove/purge because
    # disabled-ignore would then skip the target agent's parent directory.
    integration_lifecycle:
      label: Herdr
      binary: herdr
      install: [herdr, integration, install, "{args}"]
      uninstall: [herdr, integration, uninstall, "{args}"]
      uninstall_disabled: true
      skip_errors: ["not found"]
      uninstall_all: [pi, omp, claude, codex, copilot, devin, droid, kimi,
        opencode, kilo, hermes, qodercli, cursor, mastracode, antigravity-cli, grok]
      cleanup:
        needles: [herdr-agent-state.sh, herdr-agent-state.ts, herdr-agent-state.js]
        standalone:
          claude-code: [.claude/hooks/herdr-agent-state.sh]
          codex: [.codex/herdr-agent-state.sh]
          cursor: [.cursor/herdr-agent-state.sh]
          gemini-cli: [.gemini/config/hooks/herdr-agent-state.sh]
          github-copilot: [.copilot/hooks/herdr-agent-state.sh]
          grok: [.grok/hooks/herdr-agent-state.sh, .grok/hooks/herdr.json]
          opencode: [.config/opencode/plugins/herdr-agent-state.js]
          pi: [.pi/agent/extensions/herdr-agent-state.ts]
        json_hooks:
          claude-code: [.claude/settings.json]
          codex: [.codex/hooks.json]
          cursor: [.cursor/hooks.json]
        extras:
          - .omp/agent/extensions/herdr-omp-agent-state.ts
          - .config/devin/herdr-agent-state.sh
          - .factory/hooks/herdr-agent-state.sh
          - .kimi-code/hooks/herdr-agent-state.sh
          - .config/kilo/plugin/herdr-agent-state.js
          - .hermes/plugins/herdr-agent-state/__init__.py
          - .qoder/hooks/herdr-agent-state.sh
          - .mastracode/hooks/herdr-agent-state.sh
    integrations:
      - tool: claude-code
        args: ["claude"]
      - tool: codex
        args: ["codex"]
      - tool: cursor
        args: ["cursor"]
      - tool: gemini-cli
        args: ["antigravity-cli"]
      - tool: github-copilot
        args: ["copilot"]
      - tool: grok
        args: ["grok"]
      - tool: opencode
        args: ["opencode"]
      - tool: pi
        args: ["pi"]

  luvus:
    remove:
      - ".luvus/config.json"
    purge:
      - ".luvus/luvus.sock"
      - ".luvus/luvus-client.sock"
      - ".luvus/session.json"
      - ".luvus/orch.json"
      - ".luvus/modules.json"
      - ".luvus/modules/**"
      - ".luvus/sessions/**"
      - ".luvus/worktrees/**"
      - ".luvus/reviews/**"

  lody:
    when:
      enabled: false
    purge:
      - ".lody/**"

  omp:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".omp/agent/config.yml"
      - ".omp/agent/keybindings.yml"
      - ".omp/agent/mcp.json"
      - ".omp/agent/extensions/emacs-eof.ts"
      - ".omp/agent/models.yml"
    purge:
      - ".omp/**"

  openclaw:
    when:
      enabled: false
    purge:
      - ".openclaw/**"

  opencode:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/opencode/opencode.json"
      - ".config/opencode/tui.json"
    purge:
      - ".config/opencode/**"
      - ".local/share/opencode/**"

  orca:
    when:
      enabled: false
    remove:
      - ".config/orca/profiles/local-default/orca-data.json"
    purge:
      - ".orca/**"
      - ".config/orca/**"
      - ".config/Orca/**"
      - "Library/Application Support/orca/**"
    # Orca injects hooks into agent-owned config trees. Keep these out of
    # remove/purge so disabling Orca does not ignore another tool's parent.
    integration_lifecycle:
      label: Orca
      setup: false
      cleanup:
        needles: [.orca/agent-hooks/, ORCA_AGENT_HOOK_, "@orca-managed"]
        command_fields: [command, bash]
        standalone:
          github-copilot: [.copilot/hooks/orca.json]
          grok: [.grok/hooks/orca-status.json]
          pi:
            - .pi/agent/extensions/orca-agent-status.ts
            - .pi/agent/extensions/orca-prefill.ts
            - .pi/agent/extensions/orca-titlebar-spinner.ts
        json_hooks:
          claude-code: [.claude/settings.json, .claude/hooks.json]
          codex: [.codex/hooks.json, .codex/hooks.json.bak]
          cursor: [.cursor/hooks.json, .cursor/hooks.json.bak]
        managed_blocks:
          - path: .kimi-code/config.toml
            start: "# >>> orca-managed-kimi-hooks"
            end: "# <<< orca-managed-kimi-hooks <<<"
    integrations:
      - tool: claude-code
      - tool: codex
      - tool: cursor
      - tool: gemini-cli
      - tool: github-copilot
      - tool: grok
      - tool: opencode
      - tool: pi

  pi:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".pi/agent/models.json"
      - ".pi/agent/settings.json"
      - ".pi/agent/trust.json"
      - ".pi/agent/mcp.json"
      - ".pi/agent/keybindings.json"
      - ".pi/agent/pi-autoname.json"
      - ".config/pi/web-search.json"
    purge:
      - ".pi/**"
      - ".config/pi/**"

  rclone:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/rclone/rclone.conf"
    purge:
      - ".config/rclone/**"

  rtk:
    when:
      enabled: false
    remove:
      - ".config/rtk/config.toml"
    purge:
      # rtk init --uninstall leaves runtime data (history.db, tee/,
      # trusted_filters.json, telemetry). macOS Application Support is a
      # symlink to .config/rtk, so only the canonical directory is purged.
      - ".config/rtk/**"
      - ".local/share/rtk/**"
      - ".local/state/rtk/**"
      - ".cache/rtk/**"
      - "Library/Caches/rtk/**"
      - "AppData/Local/rtk/**"
    # Target agent for `rtk init`. `tool` here is the agent, not owner.
    # Agent-owned files (RTK.md, hooks) live inside other tools' dirs, so
    # they cannot be in remove/purge (disabled-ignore would skip the parent).
    integration_lifecycle:
      label: RTK
      os: [android, darwin, linux]
      binary: rtk
      install: [rtk, init, "{args}"]
      uninstall: [rtk, init, "{args}", --uninstall]
      skip_errors: ["no such file", "not found"]
      cleanup:
        standalone:
          claude-code: [.claude/RTK.md]
          codex: [.codex/RTK.md]
          gemini-cli: [.gemini/hooks/rtk-hook-gemini.sh, .gemini/hooks/.rtk-hook.sha256]
          github-copilot: [.copilot/hooks/rtk-rewrite.json]
          opencode: [.config/opencode/plugins/rtk.ts]
          pi: [.pi/agent/extensions/rtk.ts]
        json_hooks:
          claude-code: [.claude/settings.json]
          cursor: [.cursor/hooks.json]
          gemini-cli: [.gemini/settings.json]
        command_exact: [rtk]
        command_prefixes: ["rtk "]
        needles: ["rtk hook", rtk-hook-]
        markdown_refs:
          patterns: ['^@(?:.*/)?RTK\.md\s*$']
          agents:
            claude-code: [.claude/CLAUDE.md]
            codex: [.codex/AGENTS.md]
        marked_files:
          gemini-cli:
            - path: .gemini/GEMINI.md
              contains: ["Rust Token Killer"]
              head_contains: ["# RTK"]
              head_chars: 120
          github-copilot:
            - path: .copilot/copilot-instructions.md
              contains: ["Rust Token Killer"]
              head_contains: ["# RTK"]
              head_chars: 120
    integrations:
      - tool: claude-code
        args: ["--global", "--auto-patch"]
      - tool: codex
        args: ["--global", "--codex"]
      - tool: gemini-cli
        args: ["--global", "--gemini", "--auto-patch"]
      - tool: opencode
        args: ["--global", "--opencode"]
      - tool: pi
        args: ["--global", "--agent", "pi"]
      - tool: cursor
        args: ["--global", "--agent", "cursor", "--auto-patch"]
      - tool: github-copilot
        args: ["--global", "--copilot"]

  sentry:
    when:
      enabled:
        host_env: [iv]

  sim-use:
    when:
      enabled: false

  termio:
    when:
      enabled: false
    remove:
      - ".termio/settings.json"
    purge:
      - ".termio/**"
    # Termio writes hooks itself when the app runs. These names are the
    # agent dirs to strip when Termio or the target agent is off.
    integration_lifecycle:
      label: Termio
      binary: termio
      cleanup:
        needles: [termio-hooks, "termio agent report", "Application Support/termio"]
        standalone:
          grok: [.grok/hooks/termio.json]
          opencode: [.config/opencode/plugin/termio.js]
          pi: [.pi/agent/extensions/termio.js]
        json_hooks:
          claude-code: [.claude/settings.json]
          codex: [.codex/hooks.json]
          cursor: [.cursor/hooks.json]
        extras: [.config/amp/plugins/termio.ts]
    integrations:
      - tool: claude-code
      - tool: codex
      - tool: cursor
      - tool: grok
      - tool: opencode
      - tool: pi

  warp:
    when:
      enabled:
        disk_gb:
          min: 256
    remove:
      - ".warp/settings.toml"
      - ".warp/tab_configs/startup_config.toml"
    purge:
      - ".warp/**"

  worktrunk:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/worktrunk/config.toml"
    purge:
      - ".config/worktrunk/**"
    # `wt config plugins <args> install|uninstall`.
    integration_lifecycle:
      label: Worktrunk
      os: [android, darwin, linux]
      binary: wt
      install: [wt, config, plugins, "{args}", install, --yes]
      uninstall: [wt, config, plugins, "{args}", uninstall, --yes]
      uninstall_disabled: true
      skip_errors: ["not found", "no such file", "unrecognized subcommand"]
      target_env:
        pi:
          PI_CODING_AGENT_DIR: "~/.pi/agent"
          PI_PROFILE: null
          OMP_PROFILE: null
        omp:
          PI_CODING_AGENT_DIR: null
          PI_CONFIG_DIR: null
          PI_PROFILE: null
          OMP_PROFILE: null
      cleanup:
        standalone:
          pi:
            - .pi/agent/extensions/worktrunk.ts
            - .pi/agent/hooks/pre/worktrunk.ts
      post_install:
        pi:
          move:
            from: .pi/agent/hooks/pre/worktrunk.ts
            to: .pi/agent/extensions/worktrunk.ts
          replacements:
            - ['import type { HookAPI } from "@oh-my-pi/pi-coding-agent/extensibility/hooks"', 'import type { ExtensionAPI } from "@earendil-works/pi-coding-agent"']
            - [HookAPI, ExtensionAPI]
    # Worktrunk's `pi` plugin writes hooks/pre/worktrunk.ts (OMP layout).
    # Earendil Pi renamed hooks/ to extensions/, so the runner relocates
    # that file to ~/.pi/agent/extensions/worktrunk.ts after install.
    integrations:
      - tool: claude-code
        args: ["claude"]
      - tool: codex
        args: ["codex"]
      - tool: opencode
        args: ["opencode"]
      - tool: omp
        args: ["pi"]
      - tool: pi
        args: ["pi"]

  talkify:
    when:
      enabled:
        host_env: [personal]
        os:
          type: darwin
          version: ">=26"
    purge:
      - "Library/Application Support/Talkify/**"
