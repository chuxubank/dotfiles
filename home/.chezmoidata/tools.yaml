# yaml-language-server: $schema=../../schemas/tools.schema.json
# Declared tools. A name listed here is the single enablement switch.
# Lifecycle affiliation in data files is `owner` (packages, skill
# providers, defaults). Services and environment groups use `tool` as
# identity and set `owner` only when they should follow a switch.
# Skill `when.*.tool`, plugin/mcp `tool`, and integration target `tool`
# values are the target agent, not the owner. Integration lifecycle and
# cleanup declarations live in integrations.yaml.
# Every `owner` must be a name listed here.
#
# remove: chezmoi-managed dest paths deleted via .chezmoiremove when the
# tool is off. purge: runtime data (login state, history, caches); applied
# only when policies.purge_disabled_tools is on.
# purge accepts path strings or {command?, paths, env?, when?} objects. Command
# entries run before managed files are removed; their paths declare cleanup
# scope and must be absent after success (trailing /** checks the tree root).
# They are never deleted by generic purges. command is optional literal argv,
# env is per-command, and a leading {home} expands to HOME. When command is
# set, run it first if available (warn on failure), then move declared paths
# to Trash. Without command, only that Trash step runs. Success means all
# declared paths are absent. when uses the shared condition schema.
# Command paths ignore exact targets (/** ignores its root), never a parent.
# setup: initialization commands run by the shared tool setup executor; pass
# arguments resolve at runtime. Retry and ownership rules: docs/tool-lifecycle.md.
# plugin_upgrades: weekly commands, executed in order after plugin reconciliation.
# for_each: enabled_plugins expands {source} from plugin declarations.
# All enabled tools share one weekly chezmoi success/retry unit; individual
# command failures are collected rather than stopping later upgrades.
# A trailing /** wipes directory contents. The directory itself is ignored
# in the source state so apply does not recreate it (ignore of that exact
# path would also block .chezmoiremove). Managed files at the dest root
# (e.g. .claude.json) are emptied in their templates instead.
# Every remove/purge string path must sit under a directory this tool owns, so
# the parent that disabled-ignore derives is never a shared tree. For command
# entries, exact file paths may sit in shared trees. Managed files in shared
# trees should instead gate their templates on tool/enabled.
tool_conditions:
  disabled: &disabled { enabled: false }
  non_ci: &non_ci { disabled: { host_env: [ci] } }
  iv_only: &iv_only { enabled: { host_env: [iv] } }

tools:
  # CLI via bun; the official discovery skill follows this switch. Chrome
  # downloads are a separate retry unit from the global package install.
  agent-browser:
    when:
      enabled:
        os: [darwin, linux, windows]
      disabled:
        host_env: [ci]
    purge:
      - ".agent-browser/**"

  # Off. Turning this on restores the cask and mcp.json. Settings,
  # provider secrets, and chat state stay in Application Support; brew zap
  # covers those plus Preferences, ByHost, and SFL under shared parents.
  # Plugin packages are installed by the app and are not vendored. Bundled
  # skills are app-owned copies. mcp.json is rendered from mcp.providers;
  # the computer-use entry matches the one Alma's registrar writes, so
  # launch does not rewrite the file.
  alma:
    when: *disabled
    remove:
      - ".config/alma/mcp.json"
    purge:
      - ".alma/**"
      - ".cache/alma/**"
      - ".config/alma/**"
      - "Library/Application Support/alma/**"
      - "Library/Caches/alma-ocr/**"
      - "Library/Caches/alma-updater/**"
      - "Library/Caches/com.yetone.alma/**"
      - "Library/Caches/com.yetone.alma.ShipIt/**"
      - "Library/HTTPStorages/com.yetone.alma/**"

  # CLI via bun. No managed dest files.
  amp:
    when: *disabled
    purge:
      - ".amp/**"
      - ".config/amp/**"
      - ".local/share/amp/**"

  android-project:
    when: *non_ci

  # Android device agent. The example checkout, MCP entry, and launchers
  # follow this switch. Off until a model provider is chosen. Turning it
  # on should keep it to macOS and exclude CI.
  artemis:
    when: *disabled
    remove:
      - ".local/share/artemis/.env"
    purge:
      - ".local/share/artemis/**"

  # Multi-shell completion provider. Configuration is ready, but fzf-tab is
  # the preferred completion UI; enable this separately when its specs are
  # wanted in addition to native Zsh completions.
  carapace:
    when: *disabled
    zshrc:
      - at: after-compinit
        body: |
          # Add Carapace's specs to Zsh completion without reintroducing the disabled
          # inshellisense PTY bridge. This must run after compinit and before fzf-tab.
          if command -v carapace >/dev/null 2>&1; then
            export CARAPACE_BRIDGES='zsh,fish,bash'
            source <(command carapace _carapace)
          fi

  claude-code:
    when: *disabled
    plugin_upgrades:
      - command: [claude, plugin, marketplace, update]
      - command: [claude, plugin, update, "{source}"]
        for_each: enabled_plugins
    remove:
      - ".claude/settings.json"
      - ".claude/statusline.sh"
    purge:
      - ".claude.json.backup"
      - ".claude/**"

  # Desktop and mobile client for Claude Code, Codex, and Pi. Homebrew has
  # no cask, so the notarized global DMG is unpacked by the Applications
  # external. Electron state is under Library/Application Support/Cindy, a
  # shared parent, so brew-style zap is not declared here.
  cindy:
    when:
      enabled:
        host_env: [personal, iv]
        os: [darwin]
        disk_available_gb:
          min: 50

  # CLI via bun; agent wiring is MCP + env. No managed dest files.
  codegraph: {}

  compose-preview:
    when: *non_ci

  codex:
    when: *disabled
    zshrc:
      - at: tail
        body: |
          if command -v codex >/dev/null 2>&1; then
            eval "$(codex completion zsh)"
          fi
          alias codex="codex --yolo"
    plugin_upgrades:
      - command: [codex, plugin, marketplace, upgrade]
    remove:
      - ".codex/config.toml"
      - ".codex/model-catalog.json"
    purge:
      - ".codex/**"

  cursor:
    when: *non_ci
    remove:
      - ".cursor/mcp.json"
      # CLI reads $XDG_CONFIG_HOME/cursor/cli-config.json. Data stays in ~/.cursor.
      - ".config/cursor/cli-config.json"
    purge:
      - ".cursor/**"

  gemini-cli:
    when: *disabled
    remove:
      - ".gemini/antigravity-cli/mcp_config.json"
    purge:
      - ".gemini/**"

  # Fuzzy UI for Zsh's native completion system. Unlike PTY wrappers, this
  # stays inside ZLE and does not interfere with terminal protocols.
  # Load after compinit but before plugins that wrap ZLE widgets.
  fzf-tab:
    zshrc:
      - at: completion-ui
        body: |
          zstyle ':completion:*' menu no
          zstyle ':completion:*:descriptions' format '[%d]'
          zstyle ':fzf-tab:*' switch-group '<' '>'
          zstyle ':fzf-tab:*' fzf-flags --height=70% --layout=reverse --border
          zstyle ':fzf-tab:complete:cd:*' fzf-preview 'command ls -la --color=always $realpath 2>/dev/null || command ls -laG $realpath'
          zstyle ':fzf-tab:complete:git-(checkout|switch):*' sort false
          zstyle ':fzf-tab:complete:git-(checkout|switch):*' fzf-preview 'command git log --oneline --decorate --color=always $word 2>/dev/null | command head -100'
          source_if $HOMEBREW_PREFIX/opt/fzf-tab/share/fzf-tab/fzf-tab.zsh
          source_if /usr/share/zsh/plugins/fzf-tab-git/fzf-tab.plugin.zsh
          source_if /usr/share/zsh/plugins/fzf-tab/fzf-tab.plugin.zsh

  goose:
    when: *non_ci
    remove:
      - ".config/goose/config.yaml"
    purge:
      - ".config/goose/**"

  grok:
    plugin_upgrades:
      - command: [grok, plugin, marketplace, update]
      - command: [grok, plugin, update]
    remove:
      - ".grok/config.toml"
      - ".grok/trusted_folders.toml"
    purge:
      - ".grok/**"

  github-copilot:
    when: *non_ci
    purge:
      - ".copilot/**"

  # The Homebrew formula exists only to serve this MCP. Off while gh covers
  # the same GitHub work.
  github-mcp-server:
    when: *disabled

  # glab stays installed on iv. This switch only owns the self-hosted MCP.
  gitlab:
    when: *disabled

  hermes:
    when: *disabled
    remove:
      - ".hermes/config.yaml"
      - ".hermes/SOUL.md"
    purge:
      - command: ["{home}/.local/bin/hermes", uninstall, --full, --yes]
        when:
          enabled:
            os: [darwin, linux]
        env:
          HERMES_HOME: "{home}/.hermes"
          HERMES_INSTALL_DIR: "{home}/.hermes/hermes-agent"
        paths:
          - ".hermes/**"
          - ".local/bin/hermes"
          - ".local/bin/hermes-agent"
          - ".local/bin/hermes-acp"

  # Formula, herdrm, and the official herdr-app cask. The cask is
  # arm64-only and self-updates. Its config is not .config/herdr.
  herdr:
    when: *disabled
    remove:
      - ".config/herdr/config.toml"
      - ".config/herdr/plugins/config/herdr-spreader/config.yaml"
    purge:
      - ".config/herdr/**"
      - ".config/herdr-app/**"
      # Exact file. Preferences is shared, so a string purge would ignore it.
      - paths:
          - "Library/Preferences/dev.herdr.app.plist"

  # Mac App Store app installed through brew mas, plus the managed config and
  # the macOS import helper. The helper is a bin/ script, so it is gated in
  # its template rather than listed here.
  immersive-translate:
    when: *disabled
    remove:
      - ".config/immersive-translate/config.json"
    purge:
      - ".config/immersive-translate/**"

  # Fig-style PTY autocomplete. Disabled because its Node readline proxy blocks
  # Kitty keyboard protocol query/set/push/pop sequences, breaking enhanced
  # keyboard input in terminal multiplexers such as Luvus and Herdr.
  inshellisense:
    when: *disabled
    zshrc:
      - at: last
        body: |
          # PTY wrap; must stay last. Skip Emacs/SSH. Unpack lazily from the bun
          # global cwd so Fig specs resolve (process.cwd()/node_modules).
          if [[ -z "${ISTERM}" && $- = *i* && ${+ZSH_EXECUTION_STRING} -eq 0
                && -z "${VSCODE_RESOLVING_ENVIRONMENT}"
                && -z "${INSIDE_EMACS}" && -z "${SSH_CONNECTION}" ]] \
              && command -v is >/dev/null 2>&1; then
            () {
              local root="${BUN_INSTALL:-$HOME/.bun}/install/global"
              local data="${XDG_DATA_HOME:-$HOME/.local/share}/inshellisense"
              local unpacked="" pkg
              [[ -d "$root/node_modules/@chuxubank/inshellisense" ]] || return
              [[ -r "$data/version.txt" ]] && unpacked=$(<"$data/version.txt")
              pkg=$(command is -v 2>/dev/null) || return
              if [[ "$unpacked" != "$pkg" ]]; then
                (cd "$root" && command is init zsh >/dev/null)
              fi
              if [[ -o login ]]; then
                command is -s zsh --login && exit
              else
                command is -s zsh && exit
              fi
            }
          fi
    purge:
      - ".inshellisense/**"
      - ".local/share/inshellisense/**"
      - ".config/inshellisense/**"

  # Amazon Kiro CLI (ex-CodeWhisperer). Shell pre/post hooks live in the
  # shared zshrc/zprofile templates and are gated there, not in remove.
  # The input-method symlink and ~/.local/bin shims sit in shared trees;
  # the darwin setup script removes those on disable. brew zap covers the
  # rest.
  kiro-cli:
    when: *disabled
    zshrc:
      - at: before-omz
        body: |
          # Kiro CLI pre block. Keep before oh-my-zsh.
          source_if -n -t 0.02 "${HOME}/Library/Application Support/kiro-cli/shell/zshrc.pre.zsh"
      - at: tail
        body: |
          # Kiro CLI post block. Keep after the other tail hooks.
          source_if -n -t 0.02 "${HOME}/Library/Application Support/kiro-cli/shell/zshrc.post.zsh"
    purge:
      - ".kiro/**"
      - "Library/Application Support/kiro-cli/**"
      - "Library/Caches/com.amazon.codewhisperer/**"
      - "Library/Caches/dev.kiro.cli/**"
      - "Library/WebKit/com.amazon.codewhisperer/**"

  # Feishu Project MCP and its agent skill share this lifecycle switch. Keep
  # both declarations managed while the Meegle CLI replaces them at runtime.
  feishu-projects:
    when: *disabled

  lark-project-cli:
    when: *iv_only
    # The package postinstall registers its bundled Meegle plugin skills.
    # Keep this switch aligned with packages/node.toml and skills/external.yaml.

  # Business-data CLI and its official skill. This is separate from the lpm
  # plugin-development CLI and from the Feishu Project MCP integration.
  meegle-cli:
    when: *iv_only

  luvus:
    remove:
      - ".luvus/config.json"
    purge:
      - ".luvus/luvus.sock"
      - ".luvus/luvus-client.sock"
      - ".luvus/session.json"
      - ".luvus/orch.json"
      - ".luvus/modules.json"
      - ".luvus/modules/**"
      - ".luvus/sessions/**"
      # .luvus/worktrees/** is deliberately absent: Luvus builds worktree paths
      # from LUVUS_HOME (src/app/mod.rs worktrees_dir_for) and has no setting
      # to move them, so unlike Paseo and Orca it cannot point at
      # path.data.worktree. Purging this would trash real git worktrees and any
      # unmerged work in them. Remove them through Luvus, which also deletes
      # the now-empty parent.
      - ".luvus/reviews/**"

  lody:
    when: *disabled
    purge:
      - ".lody/**"

  # Client switch only. The gateway runs once on bwg-cn2-gia, not on
  # each machine: no formula, no launchd, no http://127.0.0.1:3425.
  # While this is on, the provider tables below gain
  # https://magpie.<VPS domain>. While it is off, those tables drop it.
  # ~/.config/magpie on the VPS holds upstream keys and is not managed here.
  magpie:
    when: *non_ci

  # Off. No Homebrew cask; the Applications external unpacks the GitHub
  # tarball on darwin, outside CI. The bundle is one path in shared
  # ~/Applications, so this names that path and no uninstaller.
  mygo-cloudmusic:
    when: *disabled
    purge:
      - when:
          enabled:
            os: [darwin]
        paths:
          - "Applications/MyGo 云音乐.app"

  # Account authorization remains interactive: run `ncm-cli login` after apply.
  ncm-cli:
    when:
      enabled:
        os: [darwin, linux, windows]
      disabled:
        host_env: [ci]
    setup:
      - command:
          - ncm-cli
          - config
          - set
          - appId
          - pass: {path: Personal/Tech/NetEase/Music, field: appid}
      - command:
          - ncm-cli
          - config
          - set
          - privateKey
          - pass: {path: Personal/Tech/NetEase/Music, field: private-key}

  omp:
    when: *non_ci
    plugin_upgrades:
      - command: [omp, plugin, marketplace, update]
      # This upgrades marketplace plugins only; npm plugins need --force.
      - command: [omp, plugin, upgrade]
      - command: [omp, plugin, install, "{source}", --force]
        for_each: enabled_plugins
    remove:
      - ".omp/agent/config.yml"
      - ".omp/agent/keybindings.yml"
      - ".omp/agent/mcp.json"
      - ".omp/agent/extensions/emacs-eof.ts"
      - ".omp/agent/models.yml"
    purge:
      - ".omp/**"

  openclaw:
    when: *disabled
    purge:
      - ".openclaw/**"

  opencode:
    when: *non_ci
    zshrc:
      - at: tail
        body: |
          if command -v opencode >/dev/null 2>&1; then
            source <(opencode completion)
          fi
    remove:
      - ".config/opencode/opencode.json"
      - ".config/opencode/tui.json"
    purge:
      - ".config/opencode/**"
      - ".local/share/opencode/**"

  orca:
    when: *disabled
    remove:
      - ".config/orca/profiles/local-default/orca-data.json"
    purge:
      - ".config/Orca/**"
      - ".config/orca/**"
      - ".orca-relay/**"
      - ".orca-remote/**"
      - ".orca/**"
      - "Library/Application Support/orca/**"
      - "orca/**"

  # The uv tool exists only to serve this MCP. Off while other converters
  # cover the same documents.
  markitdown:
    when: *disabled

  # Superseded by agent-device, iPhone Use, and Artemis. No local package
  # belongs to this server.
  mobile-device:
    when: *disabled

  # Accessibility-snapshot browser MCP. Off while agent-browser and
  # Chrome DevTools MCP cover the same work. Turning this on restores the
  # MCP entry and the weekly Chromium install in the bun upgrade script.
  playwright:
    when: *disabled

  # Self-hosted daemon that launches the other agent CLIs. The desktop cask
  # ships the binary on darwin; other hosts get @getpaseo/cli from npm.
  paseo:
    when: *disabled
    remove:
      - ".paseo/config.json"
    purge:
      # Safe to wipe wholesale: private_dot_paseo/modify_config.json points
      # worktrees.root at the shared path.data.worktree parent, so no git
      # worktree (and no unmerged work) lives under this tree. Keep that pin
      # and this entry together.
      - ".paseo/**"

  pi:
    when: *non_ci
    plugin_upgrades:
      - command: [pi, update, --extensions]
    remove:
      - ".pi/agent/models.json"
      - ".pi/agent/settings.json"
      - ".pi/agent/trust.json"
      - ".pi/agent/mcp.json"
      - ".pi/agent/keybindings.json"
      - ".pi/agent/pi-autoname.json"
      - ".config/pi/web-search.json"
    purge:
      - ".pi/**"
      - ".config/pi/**"

  rclone:
    when: *non_ci
    remove:
      - ".config/rclone/rclone.conf"
    purge:
      - ".config/rclone/**"

  rtk:
    when: *disabled
    remove:
      - ".config/rtk/config.toml"
    purge:
      # rtk init --uninstall leaves runtime data (history.db, tee/,
      # trusted_filters.json, telemetry). macOS Application Support is a
      # symlink to .config/rtk, so only the canonical directory is purged.
      - ".config/rtk/**"
      - ".local/share/rtk/**"
      - ".local/state/rtk/**"
      - ".cache/rtk/**"
      - "Library/Caches/rtk/**"
      - "AppData/Local/rtk/**"

  sentry:
    when: *iv_only

  sim-use:
    when: *disabled

  # Stencil's neoterminal, from omp's author. Closed beta: no public
  # package. tern.build is a different product and is not this switch.
  tern:
    when: *disabled

  termio:
    when: *disabled
    remove:
      - ".termio/settings.json"
    purge:
      - ".termio/**"

  # Chromium rendered into a terminal pane through the kitty graphics
  # protocol. No managed config: it is CLI-only, and its own installer owns
  # the bundled skill (see skills/external.yaml).
  terminal-browser:
    when: *non_ci
    purge:
      # Only this tree is exclusively ours. The cask zaps sibling paths
      # (.cache/terminal-browser-*, .local/share/terminal-browser-*) whose
      # dirname is a shared tree, so purging them here would make
      # disabled-ignore swallow .cache and .local/share. `brew zap` covers
      # those, and the bundled skill symlinks live in shared agent trees.
      - ".local/state/terminal-browser/**"

  warp:
    when:
      enabled:
        disk_gb:
          min: 256
    remove:
      - ".warp/settings.toml"
      - ".warp/tab_configs/startup_config.toml"
    purge:
      - ".warp/**"

  worktrunk:
    when: *non_ci
    zshrc:
      - at: tail
        body: |
          # `wt switch` needs this wrapper function to cd; the emitted code also
          # lazily registers completions, so it must come after oh-my-zsh's
          # compinit. `wt config shell install` would append this same line
          # itself, which this file must own instead.
          wt_bin=$(command -v wt 2>/dev/null) || true
          if [[ -n $wt_bin && $wt_bin != *WindowsApps* && $wt_bin != *WindowsTerminal* ]]; then
            eval "$(command wt config shell init zsh)"
          fi
    remove:
      - ".config/worktrunk/config.toml"
    purge:
      - ".config/worktrunk/**"

  # Live shell completion plugin loaded before oh-my-zsh.
  zsh-autocomplete:
    when: *disabled
    zshrc:
      - at: before-omz
        body: |
          # Must load before oh-my-zsh's compinit/compdef.
          # cdr writes chpwd-recent-dirs here and errors if the parent is missing.
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/zsh"
          source_if $HOMEBREW_PREFIX/share/zsh-autocomplete/zsh-autocomplete.plugin.zsh
          source_if /usr/share/zsh/plugins/zsh-autocomplete/zsh-autocomplete.plugin.zsh

  # After Effects .aep parsers. Independent switches; no managed dest files.
  dot-aep:
    when: *non_ci

  py-aep:
    when: *non_ci

  talkify:
    when:
      enabled:
        host_env: [personal]
        os:
          type: darwin
          version: ">=26"
    purge:
      - "Library/Application Support/Talkify/**"

  # Desktop control surface for the agents already installed here. The cask
  # ships the app and the t3 binary; server state lives under ~/.t3. The
  # cask zap covers Electron userData under shared Library trees.
  t3-code:
    when:
      enabled:
        host_env: [personal, iv]
        os: [darwin]
    purge:
      - ".t3/**"
