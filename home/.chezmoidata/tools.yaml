# Declared tools. A name listed here is the single enablement switch.
# Lifecycle affiliation in data files is `owner` (packages, skill
# providers, defaults). Services and environment groups use `tool` as
# identity and set `owner` only when they should follow a switch.
# Skill `when.*.tool`, plugin/mcp `tool`, and integrations `tool`
# values are the target agent, not the owner.
# Every `owner` must be a name listed here.
#
# remove: chezmoi-managed dest paths deleted via .chezmoiremove when the
# tool is off. purge: runtime data (login state, history, caches); applied
# only when policies.purge_disabled_tools is on.
# A trailing /** wipes directory contents. The directory itself is ignored
# in the source state so apply does not recreate it (ignore of that exact
# path would also block .chezmoiremove). Managed files at the dest root
# (e.g. .claude.json) are emptied in their templates instead.
tools:
  claude-code:
    when:
      enabled:
        host_env: [iv]
    remove:
      - ".claude/settings.json"
      - ".claude/statusline.sh"
    purge:
      - ".claude.json.backup"
      - ".claude/**"

  codex:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".codex/config.toml"
      - ".codex/model-catalog.json"
    purge:
      - ".codex/**"

  cursor:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".cursor/mcp.json"
      - ".cursor/cli-config.json"
    purge:
      - ".cursor/**"

  gemini-cli:
    when:
      enabled: false
    remove:
      - ".gemini/antigravity-cli/mcp_config.json"
    purge:
      - ".gemini/**"

  goose:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/goose/config.yaml"
    purge:
      - ".config/goose/**"

  grok:
    remove:
      - ".grok/config.toml"
      - ".grok/trusted_folders.toml"
    purge:
      - ".grok/**"

  github-copilot:
    when:
      disabled:
        host_env: [ci]
    purge:
      - ".copilot/**"

  hermes:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".hermes/config.yaml"
      - ".hermes/SOUL.md"
    purge:
      # The vendor checkout lives at .hermes/hermes-agent/. Do not
      # purge .hermes/** or a disable wipes the install.
      - ".hermes/auth.json"
      - ".hermes/.env"
      - ".hermes/memories/**"
      - ".hermes/sessions/**"
      - ".hermes/cron/**"
      - ".hermes/logs/**"
      - ".hermes/mcp-tokens/**"

  herdr:
    remove:
      - ".config/herdr/config.toml"
      - ".config/herdr/plugins/config/herdr-spreader/config.yaml"
      - "bin/herdr-layout"
    purge:
      - ".config/herdr/**"
    # `herdr integration install <args>`. Agent-owned hook files cannot
    # live in remove/purge (disabled-ignore would skip the parent).
    integrations:
      - tool: claude-code
        args: ["claude"]
      - tool: codex
        args: ["codex"]
      - tool: cursor
        args: ["cursor"]
      - tool: gemini-cli
        args: ["antigravity-cli"]
      - tool: github-copilot
        args: ["copilot"]
      - tool: grok
        args: ["grok"]
      - tool: opencode
        args: ["opencode"]
      - tool: pi
        args: ["pi"]

  luvus:
    remove:
      - ".luvus/config.json"
      - "bin/luvus-layout"
    purge:
      - ".luvus/luvus.sock"
      - ".luvus/luvus-client.sock"
      - ".luvus/session.json"
      - ".luvus/orch.json"
      - ".luvus/modules.json"
      - ".luvus/modules/**"
      - ".luvus/sessions/**"
      - ".luvus/worktrees/**"
      - ".luvus/reviews/**"

  lody:
    when:
      disabled:
        host_env: [ci]
    purge:
      - ".lody/**"

  omp:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".omp/agent/config.yml"
      - ".omp/agent/mcp.json"
    purge:
      - ".omp/**"

  openclaw:
    when:
      enabled: false
    purge:
      - ".openclaw/**"

  opencode:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/opencode/opencode.json"
      - ".config/opencode/tui.json"
    purge:
      - ".config/opencode/**"
      - ".local/share/opencode/**"

  orca:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/orca/profiles/local-default/orca-data.json"
    purge:
      - ".config/orca/**"
      - ".config/Orca/**"
      - "Library/Application Support/orca/**"

  pi:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".pi/agent/models.json"
      - ".pi/agent/settings.json"
      - ".pi/agent/trust.json"
      - ".pi/agent/mcp.json"
      - ".pi/agent/keybindings.json"
      - ".pi/web-search.json"
    purge:
      - ".pi/**"

  rclone:
    when:
      disabled:
        host_env: [ci]
    remove:
      - ".config/rclone/rclone.conf"
    purge:
      - ".config/rclone/**"

  rtk:
    when:
      enabled: false
    remove:
      - ".config/rtk/config.toml"
      - "Library/Application Support/rtk/config.toml"
    purge:
      # rtk init --uninstall leaves runtime data (history.db, tee/,
      # trusted_filters.json, telemetry). Cover every dirs crate path.
      - ".config/rtk/**"
      - ".local/share/rtk/**"
      - ".local/state/rtk/**"
      - ".cache/rtk/**"
      - "Library/Application Support/rtk/**"
      - "Library/Caches/rtk/**"
      - "AppData/Local/rtk/**"
    # Target agent for `rtk init`. `tool` here is the agent, not owner.
    # Agent-owned files (RTK.md, hooks) live inside other tools' dirs, so
    # they cannot be in remove/purge (disabled-ignore would skip the parent).
    integrations:
      - tool: claude-code
        args: ["--global", "--auto-patch"]
      - tool: codex
        args: ["--global", "--codex"]
      - tool: gemini-cli
        args: ["--global", "--gemini", "--auto-patch"]
      - tool: opencode
        args: ["--global", "--opencode"]
      - tool: pi
        args: ["--global", "--agent", "pi"]
      - tool: cursor
        args: ["--global", "--agent", "cursor", "--auto-patch"]
      - tool: github-copilot
        args: ["--global", "--copilot"]

  sentry:
    when:
      enabled:
        host_env: [iv]

  sim-use:
    when:
      enabled: false

  termio:
    when:
      enabled:
        os: [darwin]
    remove:
      - ".termio/settings.json"
    purge:
      - ".termio/**"
    # Termio writes hooks itself when the app runs. These names are the
    # agent dirs to strip when termio or the agent is off.
    integrations:
      - tool: claude-code
      - tool: codex
      - tool: cursor
      - tool: grok
      - tool: opencode
      - tool: pi

  warp:
    when:
      enabled:
        disk_gb:
          min: 256
    remove:
      - ".warp/settings.toml"
      - ".warp/tab_configs/startup_config.toml"
    purge:
      - ".warp/**"

  talkify:
    when:
      enabled:
        host_env: [personal]
        os:
          type: darwin
          version: ">=26"
    purge:
      - "Library/Application Support/Talkify/**"
