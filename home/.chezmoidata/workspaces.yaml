# Declared workspaces. One entry is one Herdr/Luvus workspace and one
# Zellij layout (~/.config/zellij/layouts/<name>.kdl, generated from this
# list). Zellij dest extras are removed (exact_layouts). Apply at runtime
# with `herdr-layout` or `luvus-layout`; Herdr also exposes prefix+alt+l.
# Entries may use shared `when` host conditions; disabled entries are
# omitted from every generated layout.
# Tabs hold panes; panes are the project roots.
#
# cwd accepts ~ and absolute paths. relative paths resolve from the
# workspace root when one is set.
# agent + kind: start a named agent through the target mux (NAME is
# [a-z][a-z0-9_-]{0,31}, unique among live agents). command runs in the pane
# when agent is unset.
# split: right | down | auto. auto uses the previous pane's cell rect,
# converted with tty cell pixels when available, else cells at ~1:2.
workspaces:
  - name: chezmoi
    focus: true
    tabs:
      - label: chezmoi
        panes:
          - cwd: ~/.local/share/chezmoi
            agent: chezmoi
            kind: pi
            focus: true

  - name: cat-emacs
    tabs:
      - label: emacs
        panes:
          - cwd: ~/.config/emacs
            agent: emacs
            kind: pi

  - name: proxy
    tabs:
      - label: proxy
        panes:
          - cwd: ~/Developer/Personal/proxy
            agent: proxy
            kind: pi
            focus: true

  - name: OpenTactic
    when:
      enabled:
        host_env: [personal]
    tabs:
      - label: OpenTactic
        panes:
          - cwd: ~/Developer/OpenTactic

  - name: AsahiArt
    when:
      enabled:
        host_env: [personal]
    tabs:
      - label: asahiart
        panes:
          - cwd: ~/Developer/AsahiArt
            agent: asahiart
            kind: pi
            focus: true

  - name: XingZhi
    when:
      enabled:
        host_env: [personal]
    tabs:
      - label: xingzhi
        panes:
          - cwd: ~/Developer/XingZhi
            agent: main
            kind: pi
            focus: true
