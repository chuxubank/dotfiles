# Declared workspaces. One entry is one Herdr/Luvus workspace and one
# Zellij layout (~/.config/zellij/layouts/<name>.kdl, generated from this
# list). Zellij dest extras are removed (exact_layouts). Apply at runtime
# with `herdr-layout` or `luvus-layout`; Herdr also exposes prefix+alt+l.
# Generation skips CI. Entries may also use shared `when` host
# conditions; disabled entries are omitted from every generated layout.
# Tabs hold panes; panes are the project roots.
#
# Every pane in one entry must share a single root directory. A Luvus
# workspace *is* a project directory: it reassigns a tab to the workspace
# matching its pane's live cwd and opens a new one when none matches, so a
# second root silently splits the entry in two. Herdr and Zellij accept
# per-tab roots, so a split entry is the only shape all three agree on.
#
# cwd accepts ~ and absolute paths. relative paths resolve from the
# workspace root when one is set.
# agent + kind: start a named agent through the target mux (NAME is
# [a-z][a-z0-9_-]{0,31}, unique among live agents). command runs in the pane
# when agent is unset.
# split: right | down | auto. auto uses the previous pane's cell rect,
# converted with tty cell pixels when available, else cells at ~1:2.
workspace_conditions:
  personal_only: &personal_only
    enabled:
      host_env: [personal]
  personal_or_iv: &personal_or_iv
    enabled:
      host_env: [personal, iv]
  iv_only: &iv_only
    enabled:
      host_env: [iv]

workspaces:
  - name: chezmoi
    focus: true
    tabs:
      - label: chezmoi
        panes:
          - cwd: ~/.local/share/chezmoi
            agent: chezmoi
            kind: pi
            focus: true

  - name: luvus
    tabs:
      - label: luvus
        panes:
          - path: [workspace, oss]
            dest: luvus
            agent: luvus
            kind: pi
            focus: true

  - name: cat-emacs
    tabs:
      - label: emacs
        panes:
          - path: [personal, emacs]
            agent: emacs
            kind: pi

  - name: proxy
    tabs:
      - label: proxy
        panes:
          - path: [personal, proxy]
            agent: proxy
            kind: pi
            focus: true

  - name: skills
    tabs:
      - label: skills
        panes:
          - path: [personal, skills]
            agent: skills
            kind: pi
            focus: true

  - name: ivc
    when: *iv_only
    tabs:
      - label: ivc
        panes:
          - path: [workspace, iv]
            dest: ivc
            agent: ivc
            kind: pi
            focus: true

  - name: agentia
    when:
      enabled: false
    tabs:
      - label: agentia
        panes:
          - path: [workspace, iv]
            dest: agentia
            agent: agentia
            kind: pi

  - name: OpenTactic
    when: *personal_only
    tabs:
      - label: OpenTactic
        panes:
          - path: [workspace, opentactic]

  - name: AsahiArt
    when: *personal_only
    tabs:
      - label: asahiart
        panes:
          - path: [workspace, asahiart]
            agent: asahiart
            kind: pi
            focus: true

  - name: Luvia
    when: *personal_or_iv
    tabs:
      - label: luvia
        panes:
          - path: [workspace, asahiart]
            dest: Luvia
            agent: luvia
            kind: pi
            focus: true

  - name: XingZhi
    when: *personal_only
    tabs:
      - label: xingzhi
        panes:
          - path: [workspace, xz]
            agent: main
            kind: pi
            focus: true
