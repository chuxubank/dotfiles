# Declared workspaces. One entry is one Herdr/Luvus workspace and one
# Zellij layout (~/.config/zellij/layouts/<name>.kdl, generated from this
# list). Zellij dest extras are removed (exact_layouts). Apply at runtime
# with `herdr-layout` or `luvus-layout`; Herdr also exposes prefix+alt+l.
# Generation skips CI. Entries may also use shared `when` host
# conditions; disabled entries are omitted from every generated layout.
# Tabs hold panes; panes are the project roots.
#
# Every pane in one entry must share a single root directory. A Luvus
# workspace *is* a project directory: it reassigns a tab to the workspace
# matching its pane's live cwd and opens a new one when none matches, so a
# second root silently splits the entry in two. Herdr and Zellij accept
# per-tab roots, so a split entry is the only shape all three agree on.
#
# cwd accepts ~ and absolute paths. relative paths resolve from the
# workspace root when one is set.
# name + kind: start a named process through the target mux; name must match
# [a-z][a-z0-9_-]{0,31} and be unique among live names. command runs in the
# pane when name and kind are unset. kind: pi is launched with --session-control.
# split: right | down | auto. auto uses the previous pane's cell rect,
# converted with tty cell pixels when available, else cells at ~1:2.
#
# pane_launch is merged into every pane. Set kind to start a named agent,
# or command to run a process instead. Change this map to retarget every
# pane that does not override the same key.
# Workspace focus selects the one workspace after apply. Pane or tab focus
# selects inside that workspace. A single pane needs no focus.
pane_launch: &pane_launch
  kind: pi

workspace_conditions:
  personal_only: &personal_only
    enabled:
      host_env: [personal]
  personal_or_iv: &personal_or_iv
    enabled:
      host_env: [personal, iv]
  iv_only: &iv_only
    enabled:
      host_env: [iv]

workspaces:
  - name: chezmoi
    focus: true
    tabs:
      - label: chezmoi
        panes:
          - <<: *pane_launch
            cwd: ~/.local/share/chezmoi
            name: chezmoi

  - name: luvus
    tabs:
      - label: luvus
        panes:
          - <<: *pane_launch
            path: [workspace, oss]
            dest: luvus
            name: luvus

  - name: cat-emacs
    tabs:
      - label: emacs
        panes:
          - <<: *pane_launch
            path: [personal, emacs]
            name: emacs

  - name: proxy
    when:
      disabled:
        host_env: [cloud]
    tabs:
      - label: proxy
        panes:
          - <<: *pane_launch
            path: [personal, proxy]
            name: proxy

  - name: skills
    tabs:
      - label: skills
        panes:
          - <<: *pane_launch
            path: [personal, skills]
            name: skills

  - name: ivc
    when: *iv_only
    tabs:
      - label: ivc
        panes:
          - <<: *pane_launch
            path: [workspace, iv]
            dest: ivc
            name: ivc

  - name: OpenTactic
    when: *personal_only
    tabs:
      - label: OpenTactic
        panes:
          - <<: *pane_launch
            path: [workspace, opentactic]
            dest: OpenTactic
            name: open-tactic

  - name: AsahiArt
    when: *personal_only
    tabs:
      - label: asahiart
        panes:
          - <<: *pane_launch
            path: [workspace, asahiart]
            name: asahiart

  - name: Luvia
    when: *personal_or_iv
    tabs:
      - label: luvia
        panes:
          - <<: *pane_launch
            path: [workspace, asahiart]
            dest: Luvia
            name: luvia

  - name: quote0
    when: *personal_only
    tabs:
      - label: quote0
        panes:
          - <<: *pane_launch
            path: [workspace, asahiart]
            dest: quote0-school-calendar
            name: quote0

  - name: PerlerPal
    when: *personal_only
    tabs:
      - label: perlerpal
        panes:
          - <<: *pane_launch
            path: [workspace, asahiart]
            dest: PerlerPal
            name: perlerpal

  - name: XingZhi
    when: *personal_only
    tabs:
      - label: xingzhi
        panes:
          - <<: *pane_launch
            path: [workspace, xz]
            name: main
