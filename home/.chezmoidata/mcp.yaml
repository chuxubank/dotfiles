mcp:
  providers:
    - name: Amap
      description: Amap's official MCP Server
      disabled:
        hosttype: ["iv"]
        tool: ["cc", "codex", "copilot", "gemini"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@amap/amap-maps-mcp-server"
        timeout: 300
        envs:
          AMAP_MAPS_API_KEY:
            path: Personal/Life/Amap
            field: token
    - name: Context7
      description: Up-to-date Docs for LLMs and AI code editors
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@upstash/context7-mcp"
        timeout: 300
        envs:
          CONTEXT7_API_KEY:
            path: Personal/Tech/AI/Context7
            field: api-key
    - name: Fetch
      description:
        A Model Context Protocol server that provides web content fetching
        capabilities. This server enables LLMs to retrieve and process content
        from web pages, converting HTML to markdown for easier consumption.
      execution:
        type: stdio
        cmd: uvx
        args:
          - mcp-server-fetch
        timeout: 300
        startup_timeout: 30
    - name: Feishu
      description:
        The Feishu Project MCP Server connects AI tools to Feishu's Project.
        Make project management more convenient.
      disabled:
        hosttype: ["home"]
      execution:
        type: http
        uri: "https://project.feishu.cn/mcp_server/v1"
        timeout: 300
    - name: Figma Desktop
      description: The MCP Server brings Figma directly into your workflow by providing important design information and context to AI agents generating code from Figma design files.
      execution:
        type: http
        uri: http://localhost:3845/mcp
        timeout: 300
    - name: GitHub
      description: The GitHub MCP Server connects AI tools directly to GitHub's
        platform. This gives AI agents, assistants, and chatbots the ability to
        read repositories and code files, manage issues and PRs, analyze code,
        and automate workflows. All through natural language interactions.
      disabled:
        tool: ["copilot"]
      execution:
        type: stdio
        cmd: github-mcp-server
        args:
          - stdio
        timeout: 300
        envs:
          GITHUB_PERSONAL_ACCESS_TOKEN:
            type: output
            cmd: gh
            args:
              - auth
              - token
            trim: true
    - name: Google Map
      description: Location services, directions, and place details
      disabled:
        hosttype: ["iv"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@modelcontextprotocol/server-google-maps"
        timeout: 300
        envs:
          GOOGLE_MAPS_API_KEY:
            path: Personal/Tech/Google
            field: goose-map-api-key
    - name: JetBrains
      description: The server proxies requests from client to JetBrains IDE.
      execution:
        type: sse
        uri: http://localhost:64342/sse
        timeout: 300
    - name: MarkItDown
      description: Python tool for converting files and office documents to Markdown.
      execution:
        type: stdio
        cmd: uvx
        args:
          - --python
          - "3.12"
          - markitdown-mcp
        timeout: 300
        startup_timeout: 30
    - name: Notion
      description: Allows AI apps and agents to interface with the Notion public API.
      disabled:
        hosttype: []
        tool: []
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@notionhq/notion-mcp-server"
        timeout: 300
        envs:
          NOTION_TOKEN:
            path: Personal/Tech/Notion
            field: asahi-art-token
    - name: Playwright
      description:
        A MCP server that provides browser automation capabilities using
        Playwright. This server enables LLMs to interact with web pages through
        structured accessibility snapshots, bypassing the need for screenshots
        or visually-tuned models.
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@playwright/mcp@latest"
        timeout: 300
    - name: Tavily
      description: Real-time web search and intelligent data extraction capabilities.
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - tavily-mcp
        timeout: 300
        envs:
          TAVILY_API_KEY:
            path: Personal/Tech/AI/Tavily
            field: api-key
