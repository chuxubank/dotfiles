mcp:
  providers:
    - name: Amap
      description: Amap's official MCP Server
      when:
        enabled:
          host_env: ["personal"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@amap/amap-maps-mcp-server"
        timeout: 20
        envs:
          AMAP_MAPS_API_KEY:
            path: Personal/Life/Amap
            field: token
    - name: Chrome DevTools MCP
      description:
        chrome-devtools-mcp lets your coding agent (such as Gemini, Claude, Cursor or Copilot) control and inspect a live Chrome browser.
        It acts as a Model-Context-Protocol (MCP) server, giving your AI coding assistant access to the full power of Chrome DevTools for reliable automation, in-depth debugging, and performance analysis.
      when:
        disabled:
          tool: ["opencode"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - chrome-devtools-mcp@latest
          - --no-usage-statistics
          - --autoConnect
        timeout: 20
    - name: Emacs MCP Server
      description: Connect Large Language Models directly to your Emacs environment! This MCP (Model Context Protocol) server exposes Emacs functionality through standardized tools, allowing LLMs like Claude to read and modify your buffers, execute elisp code, navigate files, and much more.
      when:
        disabled:
          tool: ["opencode"]
      execution:
        type: stdio
        cmd: emacs-mcp-server
        args: [""]
        timeout: 20
    - name: Fetch
      description:
        A Model Context Protocol server that provides web content fetching
        capabilities. This server enables LLMs to retrieve and process content
        from web pages, converting HTML to markdown for easier consumption.
      when:
        disabled:
          tool: ["claude-code", "codex", "opencode"]
      execution:
        type: stdio
        cmd: uvx
        args:
          - mcp-server-fetch
        timeout: 20
        tool_timeout: 30
    - name: Feishu
      description:
        The Feishu Project MCP Server connects AI tools to Feishu's Project.
        Make project management more convenient.
      when:
        enabled:
          host_env: iv
      execution:
        type: http
        uri: "https://project.feishu.cn/mcp_server/v1"
        timeout: 20
    - name: Figma Desktop
      description: The MCP Server brings Figma directly into your workflow by providing important design information and context to AI agents generating code from Figma design files.
      execution:
        type: http
        uri: http://localhost:3845/mcp
        timeout: 20
      when:
        enabled:
          host_env: iv
    - name: Context7
      description: Up-to-date Docs for LLMs and AI code editors
      execution:
        type: http
        uri: https://mcp.context7.com/mcp
        timeout: 20
        headers:
          CONTEXT7_API_KEY:
            path: Personal/Tech/AI/Context7
            field: api-key
    - name: Infinity API
      description: Infinity API MCP
      execution:
        type: stdio
        cmd: inapi
        args:
          - serve
        timeout: 20
        tool_timeout: 30
      when:
        enabled:
          host_env: iv
    - name: Figma Remote
      description: Remote Figma MCP
      execution:
        type: http
        uri: https://mcp.figma.com/mcp
        timeout: 20
      when:
        disabled:
          host_env: iv
    - name: GitHub
      description: >
        The GitHub MCP Server connects AI tools directly to GitHub's
        platform. This gives AI agents, assistants, and chatbots the ability to
        read repositories and code files, manage issues and PRs, analyze code,
        and automate workflows. All through natural language interactions.
      when:
        disabled: true
      execution:
        type: stdio
        cmd: github-mcp-server
        args:
          - stdio
        timeout: 20
        envs:
          GITHUB_PERSONAL_ACCESS_TOKEN:
            type: output
            cmd: gh
            args:
              - auth
              - token
            trim: true
    - name: GitLab
      description: |
        With the GitLab Model Context Protocol (MCP) server, you can securely connect AI tools and applications to your GitLab instance.
        AI assistants like Claude Desktop, Claude Code, Cursor, and other MCP-compatible tools can then access your GitLab data and perform actions on your behalf.
      when:
        disabled: true
      execution:
        type: http
        uri: https://git.infinityparadise.com/api/v4/mcp
        timeout: 20
    - name: Google Map
      description: Location services, directions, and place details
      when:
        enabled:
          host_env: ["personal"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@modelcontextprotocol/server-google-maps"
        timeout: 20
        envs:
          GOOGLE_MAPS_API_KEY:
            path: Personal/Tech/Google
            field: goose-map-api-key
    - name: JetBrains
      description: The server proxies requests from client to JetBrains IDE.
      execution:
        type: sse
        uri: http://localhost:64342/sse
        timeout: 20
      when:
        enabled:
          host_env: iv
    - name: MarkItDown
      description: Python tool for converting files and office documents to Markdown.
      when:
        disabled: true
      execution:
        type: stdio
        cmd: uvx
        args:
          - --python
          - "3.12"
          - markitdown-mcp
        timeout: 30
        tool_timeout: 30
    - name: Mobile Device MCP
      description:
        An MCP server that lets AI agents control iOS and Android devices (tap, scroll, type, take screenshots, read UI trees, and run code).
        Works with multiple devices at the same time.
      when:
        disabled: true
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@srmorete/mobile-device-mcp"
        timeout: 30
    - name: Notion
      description: Allows AI apps and agents to interface with the Notion public API.
      when:
        enabled:
          host_env: ["personal"]
          roles: ["daily"]
        disabled:
          tool: ["claude-code"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@notionhq/notion-mcp-server"
        timeout: 20
        envs:
          NOTION_TOKEN:
            path: Personal/Tech/Notion
            field: asahi-art-token
    - name: Playwright
      description:
        A MCP server that provides browser automation capabilities using
        Playwright. This server enables LLMs to interact with web pages through
        structured accessibility snapshots, bypassing the need for screenshots
        or visually-tuned models.
      when:
        disabled: true
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - "@playwright/mcp@latest"
        timeout: 20
    - name: Tavily
      description: Real-time web search and intelligent data extraction capabilities.
      when:
        disabled:
          tool: ["claude-code", "opencode"]
      execution:
        type: stdio
        cmd: bunx
        args:
          - -y
          - tavily-mcp
        timeout: 20
        envs:
          TAVILY_API_KEY:
            path: Personal/Tech/AI/Tavily
            field: api-key
