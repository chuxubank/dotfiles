[path]
[path.personal]
pass = ".password-store"
beancount = "Developer/Personal/beancount"
proxy = "Developer/Personal/proxy"
keyboard = "Developer/Personal/keyboard"
emacs = ".config/emacs"
org = "Developer/Personal/org"
org-roam = "Developer/Personal/org-roam"
blog = "Developer/Personal/blog"
skills = "Developer/Personal/skills"

# Git clone metadata for these paths lives in repositories.yaml. Work tree aa
# is cloned by hand. Infinity Valley clones on personal/iv; side-project org
# trees clone only on personal, except the XingZhi Gitee runtime config repos.
# oss holds third-party projects we contribute to; example holds third-party
# trees we only read or build against, including the role-gated qmk tree that
# QMK_HOME points at.
[path.workspace]
aa = "Developer/AssaAbloy"
asahiart = "Developer/AsahiArt"
iv = "Developer/InfinityValley"
opentactic = "Developer/OpenTactic"
xz = "Developer/XingZhi"
oss = "Developer/OpenSource"
example = "Developer/Example"

[path.tool]
bun = ".bun"
emacs-site-lisp = ".local/share/emacs/site-lisp"
isyncrc = ".config/isyncrc"
plum = ".config/plum"
raycast = ".config/raycast"
sdkman = ".sdkman"

[path.data]
nutstore = "Nutstore"
mail = ".maildir"
# Shared parent for agent-created git worktrees. Tools that expose a
# configurable root point at their own subdirectory here instead of hiding
# worktrees inside their state dir, so a `purge` of that state cannot reach a
# checkout holding unmerged work. One subdirectory per tool: each tool derives
# its own per-repo layout underneath and must not have to agree with another's.
# Luvus is absent on purpose — it builds worktree paths from LUVUS_HOME and has
# no setting for this. Worktrunk is absent too: it puts worktrees beside their
# checkout by deliberate choice (dot_config/worktrunk/config.toml).
worktree = "Developer/Worktrees"
rime = ".local/share/rime"
rime-sync = "Nutstore/RimeSync"
squirrel = "Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel"
zotero-ext = "Profiles/Misaka/extensions"

[path.cache]
models-dev-api = ".cache/llm/data-set/models-dev.json"
iv-default-models-api = ".cache/llm/models/iv-default.json"
iv-codex-models-api = ".cache/llm/models/iv-codex.json"
iv-cc-models-api = ".cache/llm/models/iv-cc.json"
openai-models-api = ".cache/llm/models/openai.json"
google-models-api = ".cache/llm/models/google.json"
google-openai-models-api = ".cache/llm/models/google-openai.json"
huggingface-models-api = ".cache/llm/models/huggingface.json"
nvidia-models-api = ".cache/llm/models/nvidia.json"
ollama-models-api = ".cache/llm/models/ollama.json"
siliconflow-cn-models-api = ".cache/llm/models/siliconflow-cn.json"
opencode-models-api = ".cache/llm/models/opencode.json"
opencode-go-models-api = ".cache/llm/models/opencode-go.json"
openrouter-models-api = ".cache/llm/models/openrouter.json"
