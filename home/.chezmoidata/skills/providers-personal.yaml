skills:
  provider_groups:
    30-personal:
      - name: feishu-projects
        source: chuxubank/skills
        when:
          enabled:
            host_env: iv

      - name: grok-subagent
        source: chuxubank/skills
        when:
          enabled:
            tool: [codex, cursor, grok, pi]

      - name: starlists
        source: chuxubank/starlists

      - name: "*"
