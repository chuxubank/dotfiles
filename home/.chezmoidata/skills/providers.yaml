# yaml-language-server: $schema=../../../schemas/skills.schema.json
skills:
  # Skills managed by the skills CLI. Group keys preserve traversal order;
  # they are not separate installation or retry boundaries.
  provider_groups:
    10-general:
      - name: find-skills
        source: vercel-labs/skills

      - name: find-docs
        source: upstash/context7-mcp

      - name: gstack
        source: garrytan/gstack
        when:
          enabled: false

      - name: herdr
        source: herdrdev/herdr
        owner: herdr

      - name:
          - luvus
          - luvus-module
        source: RizRiyz/luvus
        owner: luvus

      # Paseo bundles these and re-converges them from its own copy on daemon
      # startup. private_dot_paseo/modify_config.json pins an empty skill
      # selection so this stays the only writer.
      - name:
          - paseo
          - paseo-advisor
          - paseo-committee
          - paseo-handoff
          - paseo-help
          - paseo-plugin
        source: getpaseo/paseo
        owner: paseo

      - name: termio
        source: termio-sh/termio
        owner: termio

      - name: worktrunk
        source: max-sixty/worktrunk
        owner: worktrunk
        when:
          disabled:
            tool: [claude-code, codex]

      - name:
          - computer-use
          - orca-cli
          - orchestration
        source: stablyai/orca
        owner: orca

      - name: "*"
        source: mattpocock/skills/skills/productivity
        when:
          disabled:
            tool: claude-code

      - name: "*"
        source: mattpocock/skills/skills/engineering
        when:
          disabled:
            tool: claude-code

      - name: sim-use
        source: lycorp-jp/sim-use/skills
        owner: sim-use

      - name: agent-browser
        source: vercel-labs/agent-browser
        owner: agent-browser

      # The macOS app owns the ego-browser CLI; first-run onboarding is manual.
      - name: ego-browser
        source: citrolabs/ego-lite
        when:
          enabled:
            os: darwin
          disabled:
            host_env: ci

      - name: agent-device
        source: callstack/agent-device

      - name: [iphone-use, iphone-use-setup]
        source: zhongerxin/iPhone-use
        when:
          enabled:
            os: darwin
          disabled:
            host_env: ci

      - name: ["cli-creator", "figma-implement-design"]
        source: openai/skills
        when:
          enabled:
            tool: codex

      - name: android-emulator-qa
        source: openai/plugins/plugins/test-android-apps/skills
        when:
          disabled:
            tool: codex

      - name: conventional-commit
        source: github/awesome-copilot

      - name: "*"
        source: MindReset/dot_skill/skills
        when:
          disabled:
            tool: codex

      - name: sentry-cli
        source: https://cli.sentry.dev
        owner: sentry

      - name: monid
        source: https://monid.ai/SKILL.md

      - name: "*"
        source: emilkowalski/skills

      - name: mobile-app-ui-design
        source: ceorkm/mobile-app-ui-design

      - name:
          - mobile-android-design
          - mobile-ios-design
        source: wshobson/agents/plugins/ui-design/skills

      - name: swiftui-design-skill
        source: wholiver/swiftui-design-skill

    20-android:
      - name:
          - agp-9-upgrade
          - edge-to-edge
          - navigation-3
          - r8-analyzer
        source: android/skills

      - name: "*"
        source: android/skills/jetpack-compose
        full_depth: true

      - name:
          - adb-device-unlock
          - apk-device-install
        source: chuxubank/skills
        full_depth: true

      - name:
          - kotlin-tooling-agp9-migration
          - kotlin-tooling-cocoapods-spm-migration
          - kotlin-tooling-java-to-kotlin
          - kotlin-tooling-native-build-performance
        source: Kotlin/kotlin-agent-skills

    30-personal:
      - name: bugfix-delivery
        source: chuxubank/skills
        when:
          enabled:
            host_env: iv

      - name: feishu-projects
        source: chuxubank/skills
        owner: feishu-projects

      - name: meegle
        source: larksuite/meegle-cli
        owner: meegle-cli
        when:
          enabled:
            host_env: iv

      - name: grok-subagent
        source: chuxubank/skills
        when:
          enabled:
            tool: [codex, cursor, grok, pi]

      - name: starlists
        source: chuxubank/starlists

      - name: "*"
        source: larksuite/cli/skills
        when:
          enabled:
            host_env: iv

      - name: ip-as-logo
        source: s1dashu/ip-as-logo-skill

      - name: photo-abstract-editorial
        source: ZzzLc0405/photo-abstract-editorial

      - name: mono-color
        source: yanliudesign/mono-color-skill

      - name:
          - writing-dna-skill
          - lieflat-less-ai-tone
        source: larashero3-dotcom/writing-dna-skill
        full_depth: true

      - name:
          - rare-style-explorer
          - shan-ze-school
          - vibeshot-candid-photography
          - virtual-couple-travel-vlog
        source: vibeshotclub/vsc-skills

      - name: codex-image-to-eagle
        source: vibeshotclub/vsc-skills
        when:
          enabled:
            tool: codex
