llm:
  tools:
    aider:
      supported_provider_types: [openai-completions, anthropic-messages, google-generative-ai, ollama]
      # First resolved alias. The Gemini model remains while magpie is off.
      model:
        - magpie/grok/${grok_primary}-build-fast
        - gemini-2.5-pro
      providers:
        gemini:
          provider: google
          auth_field: aider-gemini-api-key
          # The list is the shared Gemini catalog. Aider's own key is only
          # for inference; a render-time fetch of that list times out.
          models_cache: google-models-api
