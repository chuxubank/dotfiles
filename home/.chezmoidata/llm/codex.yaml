llm:
  tools:
    codex:
      model:
        - iv-codex/gpt-5.6-sol
        - iv-cc/claude-opus-5
        - openai/gpt-5.6-sol
      reasoning_effort: high
      providers:
        iv:
          provider: iv
          auth_field: default-auth-token
        iv-codex:
          provider: iv
          auth_field: codex-auth-token
        iv-cc:
          provider: iv
          auth_field: cc-auth-token
        openai:
          provider: openai
        huggingface:
          provider: huggingface
        siliconflow-cn:
          provider: siliconflow-cn
        opencode:
          provider: opencode
