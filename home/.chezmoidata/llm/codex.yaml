llm:
  tools:
    codex:
      model:
        - iv/gpt-5.6-sol
        - openai/gpt-5.6-sol
        - openrouter/openai/gpt-oss-120b:free
      reasoning_effort: high
      providers:
        iv:
          provider: iv
          auth_field: codex-auth-token
        openai:
          provider: openai
        google-openai:
          provider: google-openai
        huggingface:
          provider: huggingface
        nvidia:
          provider: nvidia
        siliconflow-cn:
          provider: siliconflow-cn
        openrouter:
          provider: openrouter
        llama:
          provider: llama
        mlx:
          provider: mlx
        opencode:
          provider: opencode
        opencode-go:
          provider: opencode-go
