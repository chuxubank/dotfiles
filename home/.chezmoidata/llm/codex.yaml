llm:
  tools:
    codex:
      model:
        - iv-codex/${gpt_primary}
        - iv-cc/${opus_primary}
        - magpie/grok/${grok_primary}-build-fast
        - openai/${gpt_primary}
      reasoning_effort: high
      # IV aliases come from the shared set. Codex writes every alias with
      # the responses wire, so iv-cc stays completions and keeps /v1.
      # iv-anthropic is messages-only and is not representable here.
      provider_sets: [iv]
      exclude_providers: [iv-anthropic]
      providers:
        iv-cc:
          type: openai-completions
        openai:
          provider: openai
        huggingface:
          provider: huggingface
        siliconflow-cn:
          provider: siliconflow-cn
        opencode:
          provider: opencode
