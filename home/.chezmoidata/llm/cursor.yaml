llm:
  # Cursor prices shared by OMP and Pi. Keys are models.dev stems, or
  # `<stem>-fast` for the Cursor docs Fast rate. A stem omitted here keeps
  # its models.dev card. OMP expands these onto SKU siblings
  # (`-high`, `-high-fast`, `cursor-`). Pi projects the same cards onto
  # pi-cursor-sdk ids; see cursor_pi. longContext is OMP's field — Pi
  # emits it as cost.tiers.
  #
  # Fast list prices: https://cursor.com/docs/models-and-pricing and
  # https://cursor.com/docs/models/claude-opus-5-5 (2026-09-23).
  rates:
    cursor:
      composer-2.5:
        cost:
          input: 0.5
          output: 2.5
          cacheRead: 0.2
          cacheWrite: 0
      composer-2.5-fast:
        cost:
          input: 3
          output: 15
          cacheRead: 0.5
          cacheWrite: 0
      ${grok_primary}-fast:
        cost:
          input: 4
          output: 12
          cacheRead: 1
          cacheWrite: 0
      claude-opus-5-fast:
        cost:
          input: 10
          output: 50
          cacheRead: 1
          cacheWrite: 12.5
      # Not in models.dev. Cursor still serves this id.
      claude-opus-5-5:
        cost:
          input: 4
          output: 20
          cacheRead: 0.2
          cacheWrite: 5
      # Input/output are the published Fast rates (2x). Cache scales by the
      # same factor; Cursor does not list Fast cache separately.
      claude-opus-5-5-fast:
        cost:
          input: 8
          output: 40
          cacheRead: 0.4
          cacheWrite: 10
      gpt-5.6-luna-fast:
        cost:
          input: 0.4
          output: 2.4
          cacheRead: 0.04
          cacheWrite: 0.5
          longContext:
            inputThreshold: 272000
            input: 0.8
            output: 3.6
            cacheRead: 0.08
            cacheWrite: 1
      gpt-5.6-sol-fast:
        cost:
          input: 8
          output: 40
          cacheRead: 0.8
          cacheWrite: 10
          longContext:
            inputThreshold: 272000
            input: 16
            output: 60
            cacheRead: 1.6
            cacheWrite: 20
      gpt-5.6-terra-fast:
        cost:
          input: 4
          output: 24
          cacheRead: 0.4
          cacheWrite: 5
          longContext:
            inputThreshold: 272000
            input: 8
            output: 36
            cacheRead: 0.8
            cacheWrite: 10

  # pi-cursor-sdk id grammar for the stems above, plus list-price families
  # the picker can select. contexts become `@<window>`. fast registers
  # `:fast` and `:slow`. default_fast means the unsuffixed id keeps the
  # SDK's default fast flag (context is swapped, fast is not): Grok and
  # Composer bill the fast card, and `:slow` bills the stem. Alias ids
  # (composer, fable, gpt-5.6, muse) stay unpriced.
  cursor_pi:
    ${grok_primary}:
      contexts: ["256k", "500k"]
      fast: true
      default_fast: true
    composer-2.5:
      fast: true
      default_fast: true
    claude-opus-5:
      contexts: ["300k", "1m"]
      fast: true
    claude-opus-5-5:
      contexts: ["300k", "1m"]
      fast: true
    gpt-5.6-luna:
      contexts: ["272k", "1m"]
      fast: true
    gpt-5.6-sol:
      contexts: ["272k", "1m"]
      fast: true
    gpt-5.6-terra:
      contexts: ["272k", "1m"]
      fast: true
    claude-fable-5:
      contexts: ["300k", "1m"]
    claude-sonnet-5:
      contexts: ["300k", "1m"]
    muse-spark-1.3:
      contexts: ["300k", "1m"]
    gemini-3.8-flash: {}
