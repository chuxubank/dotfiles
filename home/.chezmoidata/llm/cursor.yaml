llm:
  # Price catalogs for providers whose tool ships no pricing. A provider
  # opts in with `catalog: <name>`; llm/tool-config resolves it.
  catalogs:
    # Pi only. pi-cursor-sdk discovers Cursor models at $0, so these cards
    # are projected onto its ids (llm/pi-cursor-costs). OMP's bundled Cursor
    # catalog already prices every served id, Fast lanes and context SKUs
    # included, and gets no overlay.
    cursor:
      # Standard rates copy the first-party models.dev card from these
      # providers, in preference order.
      data_set: models-dev
      data_set_providers:
        - anthropic
        - openai
        - google
        - meta
        - xai
        - moonshotai
        - zai
        - deepseek
      # Per stem, every key optional:
      #   cost    — standard rate; replaces the models.dev list price.
      #   fast    — Cursor docs Fast rate; registers `:fast` and `:slow`.
      #             The standard rate is never reused for Fast.
      #   pi_contexts     — pi-cursor-sdk windows, emitted as `<stem>@<window>`.
      #   pi_default_fast — the unsuffixed Pi id keeps the SDK's fast flag
      #                     (context is swapped, fast is not), so it bills
      #                     `fast`; `:slow` bills the stem.
      # longContext is emitted as cost.tiers. Alias ids
      # (composer, fable, gpt-5.6, muse) stay unpriced.
      #
      # Fast list prices: https://cursor.com/docs/models-and-pricing and
      # https://cursor.com/docs/models/claude-opus-5-5 (2026-09-23).
      models:
        ${grok_primary}:
          fast:
            input: 4
            output: 12
            cacheRead: 1
            cacheWrite: 0
          pi_contexts: ["256k", "500k"]
          pi_default_fast: true
        composer-2.5:
          cost:
            input: 0.5
            output: 2.5
            cacheRead: 0.2
            cacheWrite: 0
          fast:
            input: 3
            output: 15
            cacheRead: 0.5
            cacheWrite: 0
          pi_default_fast: true
        claude-opus-5:
          fast:
            input: 10
            output: 50
            cacheRead: 1
            cacheWrite: 12.5
          pi_contexts: ["300k", "1m"]
        # Not in models.dev. Cursor still serves this id. Fast input/output
        # are the published 2x; cache scales by the same factor because
        # Cursor does not list Fast cache separately.
        claude-opus-5-5:
          cost:
            input: 4
            output: 20
            cacheRead: 0.2
            cacheWrite: 5
          fast:
            input: 8
            output: 40
            cacheRead: 0.4
            cacheWrite: 10
          pi_contexts: ["300k", "1m"]
        # List price only; listed so Pi projects the models.dev card.
        claude-fable-5:
          pi_contexts: ["300k", "1m"]
        claude-sonnet-5:
          pi_contexts: ["300k", "1m"]
        muse-spark-1.3:
          pi_contexts: ["300k", "1m"]
        gemini-3.8-flash: {}
