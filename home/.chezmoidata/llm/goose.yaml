llm:
  tools:
    goose:
      supported_provider_types: [openai-completions, anthropic-messages, ollama]
      # First resolved alias. The free model remains while magpie is off.
      model:
        - magpie/grok/${grok_primary}-build-fast
        - openrouter/z-ai/glm-4.5-air:free
      # IV aliases come from the shared set. Goose writes one custom
      # provider per alias; this list is only the extra provider.
      providers: [openrouter]
