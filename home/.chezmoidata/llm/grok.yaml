llm:
  tools:
    grok:
      supported_provider_types: [openai-completions, openai-responses, anthropic-messages]
      # Provider-qualified custom catalog keys preserve endpoint identity.
      # The native Fast id remains the fallback when no alias resolves.
      model:
        - magpie/grok/${grok_primary}-build-fast@500k
        - ${grok_primary}-build-fast
