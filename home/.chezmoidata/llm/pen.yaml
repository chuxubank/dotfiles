# yaml-language-server: $schema=../../../schemas/llm-policy.schema.json
llm:
  tools:
    pen:
      # Desktop agent. The custom-provider form accepts completions,
      # responses, and Anthropic messages, and the bundled runtime dispatches
      # on each model's own api. Alias pins stay as declared, so the
      # Anthropic IV aliases are not relabeled and are not excluded.
      supported_provider_types:
        - openai-completions
        - openai-responses
        - anthropic-messages
      # First enabled alias. Subscription providers stay out: Pen has no
      # bundled catalog for them, and this file is only the custom map.
      model:
        - iv-codex/${gpt_primary}
        - magpie/grok/${grok_primary}-build-fast
        - iv-cc/${opus_primary}
