# Directory prefixes for the launch wrappers. Behavior: docs/llm/model-roles.md.
# Pi and OMP use `model`. `tools` replaces it for one command.
# Grok has one endpoint, so it still names GPT-6.1 Sol as Magpie's
# github-copilot row. Goose's iv-codex alias is custom_chezmoi_iv-codex.
llm:
  path_models:
    - path: [workspace, iv]
      model: iv-codex/${gpt_primary}
      tools:
        grok: github-copilot/${gpt_primary}
        goose:
          model: ${gpt_primary}
          provider: custom_chezmoi_iv-codex
    - path: [workspace, personal]
      model: magpie/grok/${grok_primary}-build-fast@500k
      tools:
        grok: grok/${grok_primary}-build-fast@500k
        goose:
          model: grok/${grok_primary}-build-fast@500k
          provider: custom_chezmoi_magpie
