llm:
  tools:
    omp:
      # Primary session prefers IV, then Cursor `${grok_primary}` Fast, then SuperGrok,
      # then ChatGPT/Codex OAuth. `openai`/`anthropic` are IV aliases (same as
      # Pi); the ChatGPT subscription is `openai-codex`.
      model:
        - openai/${gpt_primary}
        - anthropic/claude-opus-5
        - cursor/${grok_primary}-high-fast
        - xai-oauth/${grok_primary}
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5-high
      reasoning_effort: high
      # OMP roles, not model names. Same keys on every host; each list picks
      # the first candidate whose provider resolved here. IV is company-funded,
      # so every role leads with an IV alias and spends effort freely; the
      # trailing entries are the personal-subscription fallback for non-iv
      # hosts and stay deliberately cheaper. Grok has no IV entry, so SuperGrok
      # is only ever a fallback. Cycle is OMP's default: smol → default → slow.
      default_models:
        slow:
          - iv-anthropic/claude-fable-5:high
          - cursor/claude-fable-5-1-medium:medium
        # Prewalk target and background worker. Luna's thinking floor is `low`,
        # so the IV pick is a big model held at a low-ish effort rather than a
        # small model pushed hard. Personal takes Composer 2.5 Fast.
        smol:
          - openai/gpt-5.6-luna:medium
          - cursor/composer-2.5-fast
          - xai-oauth/${grok_primary}:medium
        # Every subagent's default, and the system's heaviest output producer.
        # Terra is the reason this is not Sonnet: same input price as Sol at
        # $1.5, but $2 output against Sonnet's $15. The 372K context is smaller
        # than Sonnet's 1M and that is affordable here — each subagent starts
        # on a fresh context rather than inheriting the parent's.
        task:
          - openai/gpt-5.6-terra:high
          - xai-oauth/${grok_primary}:high
        # Reviews every primary turn's delta, so it wants a family other than
        # the primary's. IV spends company-funded Sonnet; the personal fallback
        # is standard Composer 2.5 (Cursor Models pool), not Fast. Fast is
        # smol's interactive lane; a late review still lands on the current
        # primary, so the extra rate does not change what the agent sees.
        advisor:
          - anthropic/claude-sonnet-5
          - cursor/composer-2.5
        # Titles, memory, auto-thinking classification, unexpected-stop checks.
        # Unset would borrow @smol, which is the same model here — the point of
        # spelling it out is the lower effort.
        tiny:
          - openai/gpt-5.6-luna:low
          - xai-oauth/${grok_primary}:minimal
        # Architectural planning: once per session, low volume, and the one
        # place where the best available reasoning outranks its price. Opus is
        # $6/$30 — worth it at this call frequency, not at task's.
        plan:
          - anthropic/claude-opus-5:xhigh
          - cursor/claude-opus-5-high
        # No `vision` role on purpose. inspect_image falls back @vision →
        # @default → active model, each level requiring image input. IV's
        # @default (gpt-5.6-sol) advertises it. Personal @default
        # (cursor/${grok_primary}-high-fast) is text-only in the current
        # Cursor catalog, so a photo falls through to the active model.
        # Neither provider bills per image.
      # Allow-list for the picker. Generation globs, not catalogs: only the
      # current families. `${gpt_primary}` and `${grok_primary}` are the
      # default-model pins and stay selectable even if those ids move off
      # the globs. Role targets must
      # match too, or the role resolves to a model the session cannot select.
      # Pin the provider on every glob.
      enabled_models:
        - anthropic/claude-opus-5*
        - anthropic/claude-sonnet-5*
        # The cc token's copy of sol/terra/luna, which that group serves over
        # its Anthropic front (`/v1/messages`, translated server-side; probed
        # 2026-09-14). A second auth lane for the same three models, selectable
        # by hand. Pinned like every other glob here; `openai/gpt-5.6*` below
        # is the codex-token lane for the same ids.
        - anthropic/gpt-5.6*
        - iv-anthropic/claude-fable-5
        # IV's open-weight lines, served only by the default-token group; the
        # codex and cc groups list none of these ids. `kimi/kimi-k3*` keeps the
        # vendor segment because that is the id the endpoint returns.
        - iv/deepseek-v4.1*
        - iv/glm-5.3*
        - iv/kimi/kimi-k3*
        - openai/gpt-5.6*
        - openai/gpt-6*
        - xai-oauth/${grok_primary}*
        - openai-codex/gpt-5.6*
        - openai-codex/gpt-6*
        - cursor/gpt-5.6*
        - cursor/gpt-6*
        - cursor/claude-opus-5*
        - cursor/claude-sonnet-5*
        - cursor/claude-fable-5*
        - cursor/composer-2.5*
        - cursor/*${grok_primary}*
        - cursor/*muse-spark-1.3*
        - cursor/*gemini-3.8-flash*
        - cursor/default
      providers:
        openai:
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        # The IV endpoint's Anthropic surface on the default token. Named for
        # the surface, not its one model: `anthropic` above is the same surface
        # on the cc token, and `iv` below is the same token on the OpenAI one.
        #
        # claude-fable-5 needs exactly this combination. The cc-auth group 404s
        # the id, and the OpenAI-typed `iv` alias is rejected for sending
        # reasoning_effort. The catalog is scoped to that one id so the group's
        # OpenAI-format models are not mistyped as Anthropic.
        #
        # This group's Anthropic front is also stricter than the cc-auth one:
        # it rejects the `strict` tool field, and rejects the oauth,
        # prompt-caching-scope, and advanced-tool-use betas OMP sends by
        # default. allowAnthropicHeaderOverrides lets the header below replace
        # that set with the betas this endpoint accepts (probed 2026-09-02);
        # effort-2025-11-24 is what carries the role's `:high` thinking.
        iv-anthropic:
          provider: iv
          type: anthropic
          auth_field: default-auth-token
          disable_strict_tools: true
          compat:
            allowAnthropicHeaderOverrides: true
          headers:
            anthropic-beta: claude-code-20250219,interleaved-thinking-2025-05-14,effort-2025-11-24,context-management-2025-06-27
          models:
            - claude-fable-5
        iv:
          provider: iv
          auth_field: default-auth-token
        xai-oauth:
          provider: xai-oauth
          models: false
        openai-codex:
          provider: openai-codex
          models: false
        cursor:
          provider: cursor
          models: false
          # GetUsableModels ships no pricing. Third-party ids copy first-party
          # list prices from models-dev (preference order below). Fast keys are
          # only the lanes `enabled_models` or a role can pick; prices from
          # https://cursor.com/docs/models-and-pricing (2026-09-21).
          # `cursor-` covers GetUsableModels grok ids. Stems cover thinking-
          # effort siblings. A dedicated *-fast key expands to *-{effort}-fast.
          data_set: models-dev
          data_set_providers:
            - anthropic
            - openai
            - google
            - meta
            - xai
            - moonshotai
            - zai
            - deepseek
          model_override_prefixes:
            - cursor-
          model_overrides:
            composer-2.5:
              cost:
                input: 0.5
                output: 2.5
                cacheRead: 0.2
                cacheWrite: 0
            composer-2.5-fast:
              cost:
                input: 3
                output: 15
                cacheRead: 0.5
                cacheWrite: 0
            ${grok_primary}-fast:
              cost:
                input: 4
                output: 12
                cacheRead: 1
                cacheWrite: 0
            claude-opus-5-fast:
              cost:
                input: 10
                output: 50
                cacheRead: 1
                cacheWrite: 12.5
            gpt-5.6-luna-fast:
              cost:
                input: 0.4
                output: 2.4
                cacheRead: 0.04
                cacheWrite: 0.5
                longContext:
                  inputThreshold: 272000
                  input: 0.8
                  output: 3.6
                  cacheRead: 0.08
                  cacheWrite: 1
            gpt-5.6-sol-fast:
              cost:
                input: 8
                output: 40
                cacheRead: 0.8
                cacheWrite: 10
                longContext:
                  inputThreshold: 272000
                  input: 16
                  output: 60
                  cacheRead: 1.6
                  cacheWrite: 20
            gpt-5.6-terra-fast:
              cost:
                input: 4
                output: 24
                cacheRead: 0.4
                cacheWrite: 5
                longContext:
                  inputThreshold: 272000
                  input: 8
                  output: 36
                  cacheRead: 0.8
                  cacheWrite: 10
