llm:
  tools:
    omp:
      # Primary session prefers IV, then SuperGrok, then ChatGPT/Codex OAuth,
      # then Cursor. `openai`/`anthropic` are IV aliases (same as Pi); the
      # ChatGPT subscription is `openai-codex`.
      model:
        - anthropic/claude-opus-5
        - openai/gpt-5.6-sol
        - xai-oauth/grok-4.6
        - openai-codex/gpt-5.6-sol
        - cursor/claude-opus-5-high
      reasoning_effort: high
      # OMP roles, not model names. Same keys on every host; each list picks
      # the first candidate whose provider resolved here (IV aliases on iv,
      # subscriptions on personal). Grok has no IV entry, so SuperGrok stays
      # its only source. Cycle is OMP's default: smol → default → slow.
      default_models:
        slow:
          - iv-anthropic/claude-fable-5:high
          - cursor/claude-fable-5-1-medium:medium
        smol: xai-oauth/grok-4.6:medium
        task: xai-oauth/grok-4.6:high
      enabled_models:
        - anthropic/claude-opus-5
        - iv-anthropic/claude-fable-5
        - openai/gpt-5.6-sol
        - xai-oauth/grok-4.6
        - openai-codex/gpt-5.6-sol
        - cursor/claude-opus-5-high
        - cursor/claude-fable-5-1-medium
        - cursor/claude-fable-5-1-high
        - cursor/gpt-5.6-sol
      providers:
        openai:
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        # The IV endpoint's Anthropic surface on the default token. Named for
        # the surface, not its one model: `anthropic` above is the same surface
        # on the cc token, and `iv` below is the same token on the OpenAI one.
        #
        # claude-fable-5 needs exactly this combination. The cc-auth group 404s
        # the id, and the OpenAI-typed `iv` alias is rejected for sending
        # reasoning_effort. The catalog is scoped to that one id so the group's
        # OpenAI-format models are not mistyped as Anthropic.
        #
        # This group's Anthropic front is also stricter than the cc-auth one:
        # it rejects the `strict` tool field, and rejects the oauth,
        # prompt-caching-scope, and advanced-tool-use betas OMP sends by
        # default. allowAnthropicHeaderOverrides lets the header below replace
        # that set with the betas this endpoint accepts (probed 2026-09-02);
        # effort-2025-11-24 is what carries the role's `:high` thinking.
        iv-anthropic:
          provider: iv
          type: anthropic
          auth_field: default-auth-token
          disable_strict_tools: true
          compat:
            allowAnthropicHeaderOverrides: true
          headers:
            anthropic-beta: claude-code-20250219,interleaved-thinking-2025-05-14,effort-2025-11-24,context-management-2025-06-27
          models:
            - claude-fable-5
        iv:
          provider: iv
          auth_field: default-auth-token
        xai-oauth:
          provider: xai-oauth
          models: false
        openai-codex:
          provider: openai-codex
          models: false
        cursor:
          provider: cursor
          models: false
