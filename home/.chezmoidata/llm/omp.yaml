llm:
  tools:
    omp:
      # Primary session prefers IV, then Cursor `${grok_primary}` 500k Fast,
      # then SuperGrok, then ChatGPT/Codex OAuth. `openai`/`anthropic` are IV
      # aliases (same as Pi); the ChatGPT subscription is `openai-codex`.
      # The 500k id is the context SKU (`grok-4.7-500k-fast`), not the effort
      # sibling `grok-4.7-high-fast`. The window still needs extendedContext.
      model:
        - openai/${gpt_primary}
        - anthropic/claude-opus-5
        - cursor/${grok_primary}-500k-fast
        - xai-oauth/${grok_primary}
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5-1m:high
      reasoning_effort: high
      # OMP roles, not model names. Same keys on every host; each list picks
      # the first candidate whose provider resolved here. IV is company-funded,
      # so every role leads with an IV alias and spends effort freely; the
      # trailing entries are the personal-subscription fallback for non-iv
      # hosts and stay deliberately cheaper. Grok has no IV entry, so SuperGrok
      # is only ever a fallback. Cycle is OMP's default: smol → default → slow.
      default_models:
        # Thorough and infrequent (--slow, security-reviewer). IV keeps
        # fable on iv-anthropic: the cc group 404s that id. Personal takes
        # Opus 5.5, one Cursor id with an effort ladder rather than a
        # per-effort SKU, and stays at :medium.
        slow:
          - iv-anthropic/claude-fable-5:high
          - cursor/claude-opus-5-5:medium
        # Prewalk target and background worker. GPT-6 Luna's ladder starts at
        # `none`; the IV pick stays at medium. Personal takes Composer 2.5 Fast.
        smol:
          - openai/gpt-6-luna:medium
          - cursor/composer-2.5-fast
          - xai-oauth/${grok_primary}:medium
        # Every subagent's default, and the system's heaviest output producer.
        # Same Sol id as default, at medium. The personal fallback stays
        # SuperGrok at :high. Each subagent starts on a fresh context.
        task:
          - openai/${gpt_primary}:medium
          - xai-oauth/${grok_primary}:high
        # Reviews every primary turn's delta, so it wants a family other than
        # the primary's. IV spends company-funded Sonnet; the personal fallback
        # is standard Composer 2.5 (Cursor Models pool), not Fast. Fast is
        # smol's interactive lane; a late review still lands on the current
        # primary, so the extra rate does not change what the agent sees.
        advisor:
          - anthropic/claude-sonnet-5
          - cursor/composer-2.5
        # Titles, memory, auto-thinking classification, unexpected-stop checks.
        # Unset would borrow @smol, which is the same model here — the point of
        # spelling it out is the lower effort.
        tiny:
          - openai/gpt-6-luna:low
          - xai-oauth/${grok_primary}:minimal
        # Architectural planning: once per session, low volume, and the one
        # place where the best available reasoning outranks its price. Opus is
        # $6/$30 — worth it at this call frequency, not at task's.
        plan:
          - anthropic/claude-opus-5:xhigh
          - cursor/claude-opus-5-1m:high
        # No `vision` role on purpose. inspect_image falls back @vision →
        # @default → active model, each level requiring image input. Both
        # defaults advertise it, so a photo stays on @default. Neither
        # provider bills per image.
      # Allow-list for the picker. Generation globs, not catalogs: only the
      # current families. `${gpt_primary}` and `${grok_primary}` are the
      # default-model pins and stay selectable even if those ids move off
      # the globs. Role targets must
      # match too, or the role resolves to a model the session cannot select.
      # Pin the provider on every glob.
      enabled_models:
        - anthropic/claude-opus-5*
        - anthropic/claude-sonnet-5*
        - iv-anthropic/claude-fable-5
        # IV's open-weight lines, served only by the default-token group; the
        # codex and cc groups list none of these ids. `kimi/kimi-k3*` keeps the
        # vendor segment because that is the id the endpoint returns.
        - iv/deepseek-v4.1*
        - iv/glm-5.3*
        - iv/kimi/kimi-k3*
        - openai/gpt-6*
        - xai-oauth/${grok_primary}*
        - openai-codex/gpt-6*
        # cursor/* globs come from llm.providers.cursor.
      provider_sets: [iv]
      providers:
        # The default token's Anthropic front is stricter than the cc-auth
        # one: it rejects the `strict` tool field, and rejects the oauth,
        # prompt-caching-scope, and advanced-tool-use betas OMP sends by
        # default. allowAnthropicHeaderOverrides lets the header below replace
        # that set with the betas this endpoint accepts (probed 2026-09-02);
        # effort-2025-11-24 is what carries the role's `:high` thinking.
        iv-anthropic:
          disable_strict_tools: true
          compat:
            allowAnthropicHeaderOverrides: true
          headers:
            anthropic-beta: claude-code-20250219,interleaved-thinking-2025-05-14,effort-2025-11-24,context-management-2025-06-27
        xai-oauth:
          provider: xai-oauth
          models: false
          # SuperGrok discovery returns bare ids. models.dev supplies the
          # first-party card, including list prices — same overlay as Cursor.
          data_set: models-dev
          data_set_providers:
            - xai
        openai-codex:
          provider: openai-codex
          models: false
        # OMP's bundled Cursor catalog prices every served id, including Fast
        # lanes and context SKUs such as `grok-4.7-500k-fast`; no overlay.
        cursor:
          provider: cursor
          models: false
