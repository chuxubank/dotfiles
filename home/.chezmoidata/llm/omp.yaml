llm:
  tools:
    omp:
      # Primary session cycles Cursor Opus / Fable / Sol. Bundled task
      # agents stay on SuperGrok. OMP owns both OAuth flows and catalogs.
      model:
        - cursor/claude-opus-5-high
        - xai-oauth/grok-4.6
      reasoning_effort: high
      default_models:
        fable: cursor/claude-fable-5-high:high
        sol: cursor/gpt-5.6-sol:high
        task: xai-oauth/grok-4.6:high
        smol: xai-oauth/grok-4.6:medium
      cycle_order:
        - default
        - fable
        - sol
      enabled_models:
        - cursor/claude-opus-5-high
        - cursor/claude-fable-5-high
        - cursor/gpt-5.6-sol
        - xai-oauth/grok-4.6
      providers:
        cursor:
          provider: cursor
          models: false
        xai-oauth:
          provider: xai-oauth
          models: false
