llm:
  tools:
    omp:
      # Primary session prefers IV, then SuperGrok, then ChatGPT/Codex OAuth,
      # then Cursor. `openai`/`anthropic` are IV aliases (same as Pi); the
      # ChatGPT subscription is `openai-codex`.
      model:
        - openai/gpt-5.6-sol
        - anthropic/claude-opus-5
        - xai-oauth/grok-4.6
        - openai-codex/gpt-5.6-sol
        - cursor/claude-opus-5-high
      reasoning_effort: high
      # OMP roles, not model names. Same keys on every host; each list picks
      # the first candidate whose provider resolved here. IV is company-funded,
      # so every role leads with an IV alias and spends effort freely; the
      # trailing entries are the personal-subscription fallback for non-iv
      # hosts and stay deliberately cheaper. Grok has no IV entry, so SuperGrok
      # is only ever a fallback. Cycle is OMP's default: smol → default → slow.
      default_models:
        slow:
          - iv-anthropic/claude-fable-5:high
          - cursor/claude-fable-5-1-medium:medium
        # Prewalk target and background worker. Luna's thinking floor is `low`,
        # so the IV pick is a big model held at a low-ish effort rather than a
        # small model pushed hard.
        smol:
          - openai/gpt-5.6-luna:medium
          - xai-oauth/grok-4.6:medium
        # Every subagent's default, and the system's heaviest output producer.
        # Terra is the reason this is not Sonnet: same input price as Sol at
        # $1.5, but $2 output against Sonnet's $15. The 372K context is smaller
        # than Sonnet's 1M and that is affordable here — each subagent starts
        # on a fresh context rather than inheriting the parent's.
        task:
          - openai/gpt-5.6-terra:high
          - xai-oauth/grok-4.6:high
        # Reviews every primary turn's delta, so it wants a family other than
        # the primary's and a provider that does not bill per review.
        advisor:
          - anthropic/claude-sonnet-5:medium
          - xai-oauth/grok-4.6:medium
        # Titles, memory, auto-thinking classification, unexpected-stop checks.
        # Unset would borrow @smol, which is the same model here — the point of
        # spelling it out is the lower effort.
        tiny:
          - openai/gpt-5.6-luna:low
          - xai-oauth/grok-4.6:minimal
        # Architectural planning: once per session, low volume, and the one
        # place where the best available reasoning outranks its price. Opus is
        # $6/$30 — worth it at this call frequency, not at task's.
        plan:
          - anthropic/claude-opus-5:xhigh
          - cursor/claude-opus-5-high
        # No `vision` role on purpose. inspect_image falls back @vision →
        # @default → active model, each level requiring image input, and both
        # tiers' @default already advertises it (gpt-5.6-sol, grok-4.6). Neither
        # provider bills per image, so there is nothing to route away from.
      # Allow-list for the picker. Role targets must be listed too, or the role
      # resolves to a model the session cannot select.
      enabled_models:
        - anthropic/claude-opus-5
        - anthropic/claude-sonnet-5
        - iv-anthropic/claude-fable-5
        - openai/gpt-5.6-sol
        - openai/gpt-5.6-terra
        - openai/gpt-5.6-luna
        - xai-oauth/grok-4.6
        - openai-codex/gpt-5.6-sol
        - cursor/claude-opus-5-high
        - cursor/claude-fable-5-1-medium
        - cursor/claude-fable-5-1-high
        - cursor/gpt-5.6-sol
      providers:
        openai:
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        # The IV endpoint's Anthropic surface on the default token. Named for
        # the surface, not its one model: `anthropic` above is the same surface
        # on the cc token, and `iv` below is the same token on the OpenAI one.
        #
        # claude-fable-5 needs exactly this combination. The cc-auth group 404s
        # the id, and the OpenAI-typed `iv` alias is rejected for sending
        # reasoning_effort. The catalog is scoped to that one id so the group's
        # OpenAI-format models are not mistyped as Anthropic.
        #
        # This group's Anthropic front is also stricter than the cc-auth one:
        # it rejects the `strict` tool field, and rejects the oauth,
        # prompt-caching-scope, and advanced-tool-use betas OMP sends by
        # default. allowAnthropicHeaderOverrides lets the header below replace
        # that set with the betas this endpoint accepts (probed 2026-09-02);
        # effort-2025-11-24 is what carries the role's `:high` thinking.
        iv-anthropic:
          provider: iv
          type: anthropic
          auth_field: default-auth-token
          disable_strict_tools: true
          compat:
            allowAnthropicHeaderOverrides: true
          headers:
            anthropic-beta: claude-code-20250219,interleaved-thinking-2025-05-14,effort-2025-11-24,context-management-2025-06-27
          models:
            - claude-fable-5
        iv:
          provider: iv
          auth_field: default-auth-token
        xai-oauth:
          provider: xai-oauth
          models: false
        openai-codex:
          provider: openai-codex
          models: false
        cursor:
          provider: cursor
          models: false
          # GetUsableModels ships no pricing. Third-party ids copy first-party
          # API list prices; Composer copies Cursor's published table
          # (https://cursor.com/docs/models-and-pricing, 2026-09-03).
          # Stems cover thinking-effort siblings; -fast is a separate rate.
          model_overrides:
            claude-opus-5:
              cost:
                input: 5
                output: 25
                cacheRead: 0.5
                cacheWrite: 6.25
            claude-fable-5-1:
              cost:
                input: 10
                output: 50
                cacheRead: 1
                cacheWrite: 12.5
            gpt-5.6-sol:
              cost:
                input: 4
                output: 20
                cacheRead: 0.4
                cacheWrite: 5
                longContext:
                  inputThreshold: 272000
                  input: 10
                  output: 45
                  cacheRead: 1
                  cacheWrite: 12.5
            composer-2.5:
              cost:
                input: 0.5
                output: 2.5
                cacheRead: 0.2
                cacheWrite: 0
            composer-2.5-fast:
              cost:
                input: 3
                output: 15
                cacheRead: 0.5
                cacheWrite: 0
