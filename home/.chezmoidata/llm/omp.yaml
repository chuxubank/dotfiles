llm:
  tools:
    omp:
      # Select the first enabled provider. Context SKUs need extendedContext.
      model:
        - iv-codex/${gpt_primary}
        - iv-cc/claude-opus-5
        - cursor/${grok_primary}-500k-fast
        - xai-oauth/${grok_primary}
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5-1m:high
      reasoning_effort: high
      # IV first, personal subscriptions next; see docs/llm/model-roles.md.
      default_models:
        # Fable requires the default-token alias; the cc group rejects it.
        slow:
          - iv-anthropic/claude-fable-5:high
          - cursor/claude-opus-5-5:medium
        smol:
          - iv-codex/gpt-6-luna:medium
          - cursor/composer-2.5-fast
          - xai-oauth/${grok_primary}:medium
        task:
          - iv-codex/${gpt_primary}:medium
          - xai-oauth/${grok_primary}:high
        advisor:
          - iv-cc/claude-sonnet-5
          - cursor/composer-2.5
        # Explicit assignment lowers effort rather than inheriting @smol.
        tiny:
          - iv-codex/gpt-6-luna:low
          - xai-oauth/${grok_primary}:minimal
        plan:
          - iv-cc/claude-opus-5:xhigh
          - cursor/claude-opus-5-1m:high
        # Unset roles use native fallbacks; see docs/llm/model-roles.md.
      # Provider-pinned family globs; every role target must remain selectable.
      enabled_models:
        - iv-cc/claude-opus-5*
        - iv-cc/claude-sonnet-5*
        - iv-anthropic/claude-fable-5
        # Open-weight models require the default-token group; keep vendor ids.
        - iv/deepseek-v4.1*
        - iv/glm-5.3*
        - iv/kimi/kimi-k3*
        - iv-codex/gpt-6*
        - xai-oauth/${grok_primary}*
        - openai-codex/gpt-6*
        # cursor/* globs come from llm.providers.cursor.
      provider_sets: [iv]
      providers:
        # The default token's Anthropic front is stricter than the cc-auth
        # one: it rejects the `strict` tool field, and rejects the oauth,
        # prompt-caching-scope, and advanced-tool-use betas OMP sends by
        # default. allowAnthropicHeaderOverrides lets the header below replace
        # that set with the betas this endpoint accepts (probed 2026-09-02);
        # effort-2025-11-24 is what carries the role's `:high` thinking.
        iv-anthropic:
          disable_strict_tools: true
          compat:
            allowAnthropicHeaderOverrides: true
          headers:
            anthropic-beta: claude-code-20250219,interleaved-thinking-2025-05-14,effort-2025-11-24,context-management-2025-06-27
        xai-oauth:
          provider: xai-oauth
          models: false
          # Enrich discovered ids with first-party metadata and list prices.
          data_set: models-dev
          data_set_providers:
            - xai
        openai-codex:
          provider: openai-codex
          models: false
        # The native catalog owns prices and context windows; do not overlay.
        cursor:
          provider: cursor
          models: false
