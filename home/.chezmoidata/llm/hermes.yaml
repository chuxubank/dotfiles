llm:
  tools:
    hermes:
      model:
        - iv-codex/${gpt_primary}
        - magpie/grok/${grok_primary}-build-fast
        - xai-oauth/${grok_primary}
      reasoning_effort: high
      # IV aliases come from the shared set. Hermes emits each alias
      # that has an endpoint; this map is only the extra provider.
      providers:
        # Hermes owns this provider's OAuth flow and bundled model catalog.
        # models: false keeps llm/tool-config from trying to enumerate it.
        xai-oauth:
          provider: xai-oauth
          models: false
