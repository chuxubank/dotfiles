llm:
  tools:
    claude-code:
      supported_provider_types: [anthropic-messages]
      # Endpoint selection only. opusplan is not an upstream id; the
      # settings value is that client switch whenever default_models is set.
      # Plan uses opus, execution uses sonnet, whatever provider won.
      model:
        - iv-cc/${sonnet_primary}
        - magpie/grok/${grok_primary}-build-fast
        - ${sonnet_primary}
      # Each key → ANTHROPIC_DEFAULT_<KEY>_MODEL. Not gated on iv-cc.
      default_models:
        opus: ${opus_primary}
        sonnet: ${sonnet_primary}
        haiku: ${haiku_primary}
