llm:
  tools:
    claude-code:
      supported_provider_types: [anthropic-messages]
      # opusplan stays on the IV alias. Magpie is the messages row: the grok
      # fast id is served at /v1/responses, which this client cannot call.
      # The bare opusplan remains while both of those aliases are off.
      model:
        - anthropic/opusplan
        - magpie/github-copilot/claude-opus-5
        - opusplan
      # Each key → ANTHROPIC_DEFAULT_<KEY>_MODEL env var (opus/sonnet/haiku/fable).
      # Only emitted for the IV alias. Magpie's messages ids are not these stems.
      default_models:
        opus: claude-opus-5
        sonnet: claude-sonnet-5
        haiku: claude-haiku-4-5-20251001
      providers:
        anthropic:
          provider: iv
          type: anthropic-messages
          auth_field: cc-auth-token
