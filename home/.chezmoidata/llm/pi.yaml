# yaml-language-server: $schema=../../../schemas/llm-policy.schema.json
llm:
  tools:
    pi:
      # Select the first candidate whose provider alias is enabled.
      # The gateway Fast id is unsuffixed on purpose: its window suffix is
      # a different row from the other clients' context SKUs.
      model:
        - iv-codex/${gpt_primary}
        - magpie/grok/${grok_primary}-build-fast
        - iv-cc/${opus_primary}
        - xai/${grok_primary}
        - cursor/${grok_primary}@500k:fast
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5@1m
      reasoning_effort: high
      # Family selectors. The minimum release is llm.model_floors.
      # Unprefixed families keep every provider copy in the picker.
      # Fable and the open-weight families are pinned: another alias
      # cannot serve them, or an unprefixed glob warns when that alias is off.
      enabled_models:
        - grok-*
        - gpt-*
        - claude-opus-*
        - claude-sonnet-*
        - iv-anthropic/claude-fable-*
        - iv/qwen*
        - iv/gemini-*
        - iv/deepseek-v*
        - iv/glm-*
        - iv/kimi/kimi-k*
        # cursor/* globs come from llm.providers.cursor.
      session_title_model:
        - iv/deepseek-v4-flash
        - xai/${grok_primary}:low
      subagent_model:
        - iv-codex/${gpt_primary}
        - magpie/grok/${grok_primary}-build-fast
        - xai/${grok_primary}
      # One string in web-search.json. pi-web-access does not try the next
      # candidate when that call fails, so the order is resolved here.
      search_summary_model:
        - magpie/grok/${grok_primary}
        - xai/${grok_primary}
      providers:
        # Fable's adaptive reasoning is handled server-side.
        iv-anthropic:
          model_overrides:
            claude-fable-5:
              reasoning: false
        ollama:
          provider: ollama
        # Keep native catalogs; provider conditions control availability.
        xai:
          provider: xai
          models: false
        openai-codex:
          provider: openai-codex
          models: false
        opencode:
          provider: opencode
          models: false
        # The extension owns the catalog and auth. Prices are overlaid
        # separately. The alias follows that plugin: off, neither its ids
        # nor its picker globs are written.
        cursor:
          provider: cursor
          models: false
          catalog: cursor
          plugin: pi-cursor-sdk
