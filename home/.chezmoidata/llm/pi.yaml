llm:
  tools:
    pi:
      # Select the first candidate whose provider alias is enabled.
      model:
        - magpie/auto/grok-4.7@500k
        - iv-codex/${gpt_primary}
        - iv-cc/claude-opus-5
        - xai/${grok_primary}
        - cursor/${grok_primary}@500k:fast
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5@1m
      reasoning_effort: high
      enabled_models:
        - ${grok_primary}*
        - gpt-6*
        - claude-opus-5*
        - claude-sonnet-5*
        # This id is pinned because the other IV aliases cannot serve it.
        - iv-anthropic/claude-fable-5
        - qwen3.8*
        - gemini-3.8*
        - deepseek-v4.1*
        - glm-5.3*
        - kimi/kimi-k3*
        # cursor/* globs come from llm.providers.cursor.
      session_title_model:
        - iv/deepseek-v4-flash
        - xai/${grok_primary}:low
      subagent_model:
        - iv-codex/${gpt_primary}
        - xai/${grok_primary}
      provider_sets: [iv]
      providers:
        # Fable's adaptive reasoning is handled server-side.
        iv-anthropic:
          model_overrides:
            claude-fable-5:
              reasoning: false
        ollama:
          provider: ollama
        # Keep native catalogs; provider conditions control availability.
        xai:
          provider: xai
          models: false
        openai-codex:
          provider: openai-codex
          models: false
        opencode:
          provider: opencode
          models: false
        # Keep the extension's catalog and auth; overlay prices separately.
        cursor:
          provider: cursor
          models: false
          catalog: cursor
