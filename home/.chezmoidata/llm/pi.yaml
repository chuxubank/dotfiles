llm:
  tools:
    pi:
      # `models: false` means "leave pi's bundled catalog alone, only point it
      # at our endpoint". Use it where pi's own list is the accurate one.
      # The IV-backed aliases must enumerate instead: the proxy serves ids pi
      # does not ship (claude-opus-5, the -thinking variants) and omits others
      # it does, so the proxy is the source of truth. models-dev metadata is
      # merged in, so the enumerated entries keep real costs and limits.
      model:
        - openai/${gpt_primary}
        - anthropic/claude-opus-5
        - openai-codex/${gpt_primary}
        - xai/grok-4.6
      reasoning_effort: high
      # Ctrl+P cycles these patterns against whatever actually resolved.
      # Prefer globs: an alias that resolves to nothing warns at startup.
      # Pin a provider only to steer away from a broken duplicate id.
      enabled_models:
        # Pinned to the IV Codex surface (`openai` here = provider: iv on the
        # codex token). Bare `gpt-5.6-sol` also matches pi's bundled openrouter
        # catalog and resolved there instead, so the cycle served the wrong
        # endpoint for the same id. `${gpt_primary}` is that pin; gpt-5.6*/
        # gpt-6* are the rest of the current GPT line.
        - openai/${gpt_primary}
        - openai/gpt-5.6*
        - openai/gpt-6*
        - openai-codex/${gpt_primary}
        - openai-codex/gpt-5.6*
        - openai-codex/gpt-6*
        # The same three GPT ids on the cc token, which serves them over its
        # Anthropic front (`/v1/messages`, translated server-side; probed
        # 2026-09-14). A second auth lane for one model, selectable by hand.
        # Pinned, and deliberately not bare: ADR 0005's headline collision is
        # `gpt-5.6-sol` reaching pi's bundled openrouter catalog, and this id
        # now sits on three of our aliases, so a bare glob widens that.
        # Cannot be a candidate-list fallback instead — `anthropic` and
        # `openai` are both provider: iv behind one host_env gate, so
        # pick-model resolves them together and the cc entry never wins.
        - anthropic/gpt-5.6*
        # Bare on purpose, like the ADR 0005 example: both globs are meant to
        # surface the `anthropic` and `iv` copies. OMP pins its sonnet entry
        # because a role targets one endpoint; pi has no such role.
        - claude-opus-5*
        - claude-sonnet-5*
        # Pinned, not a `claude-fable-5*` glob: that also matches the two IV
        # aliases where the id resolves but every request fails.
        - iv-anthropic/claude-fable-5
        # IV's open-weight lines. Pinned because pi's bundled catalogs
        # (openrouter, opencode) ship deepseek/glm/kimi ids of their own and a
        # bare glob resolves against the union. Only the default-token group
        # serves these — the codex- and cc-token groups list none — so all
        # three globs drop out with the `iv` alias off `iv` hosts.
        #
        # `kimi/kimi-k3*` keeps the vendor segment because that is the id the
        # endpoint returns; llm/split-model only treats a leading segment as a
        # provider when it names a configured alias, so `kimi/` survives.
        - iv/deepseek-v4*
        - iv/glm-5.3*
        - iv/kimi/kimi-k3*
        - grok-4.6
      # @furbyhaxx/pi-session-naming title model. IV first (company-funded
      # flash); SuperGrok last. :low is the thinking suffix the plugin
      # parses; Grok 4.6 cannot turn thinking off. xai is bundled, not a
      # pi.yaml alias, so pick-model takes the last candidate when no
      # alias resolves.
      session_title_model:
        - iv/deepseek-v4-flash
        - xai/grok-4.6:low
      # pi-subagents defaultModel. Same split as OMP's task role: IV spends
      # company-funded terra, SuperGrok is only the personal-host fallback.
      # xai is bundled, not a pi.yaml alias, so pick-model takes the last
      # candidate when no alias resolves.
      subagent_model:
        - openai/gpt-5.6-terra
        - xai/grok-4.6
      providers:
        openai:
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        # The IV endpoint's Anthropic surface on the default token. Named for
        # the surface, not its one model: `anthropic` above is the same surface
        # on the cc token, and `iv` below is the same token on the OpenAI one.
        #
        # claude-fable-5 needs exactly this combination. The cc-auth group 404s
        # the id, and the OpenAI-typed `iv` alias sends a `developer` role this
        # group's Anthropic front rejects. The catalog is scoped to that one id
        # so the group's OpenAI-format models are not mistyped as Anthropic.
        #
        # reasoning: false is a lie about the model, told to shut pi up: this
        # endpoint rejects `thinking.enabled` with budget_tokens (wants adaptive
        # mode) and rejects `thinking.disabled` outright, and pi can only send
        # those two. Absent the field it thinks adaptively on its own, and pi
        # omits the field only for a non-reasoning model. So the server picks
        # the effort and pi's defaultThinkingLevel never reaches this model.
        iv-anthropic:
          provider: iv
          type: anthropic
          auth_field: default-auth-token
          model_overrides:
            claude-fable-5:
              reasoning: false
          models:
            - claude-fable-5
        iv:
          provider: iv
          auth_field: default-auth-token
        ollama:
          provider: ollama
        # Subscription providers have no base_url or API key here. Keeping
        # models false makes models.json leave pi's OAuth and bundled catalog
        # untouched while allowing model fallbacks to resolve the aliases.
        openai-codex:
          provider: openai-codex
          models: false
        opencode:
          provider: opencode
          models: false
