llm:
  tools:
    pi:
      # Same candidate order as omp.yaml. IV aliases enumerate models because
      # the proxy catalog differs from Pi's bundled catalog; subscription
      # providers keep models: false. Cursor ids are pi-cursor-sdk's, not
      # OMP SKUs. Personal default is `${grok_primary}@500k:fast`: the same
      # 500k Fast grok as OMP's `${grok_primary}-500k-fast` and Grok Build's
      # `${grok_primary}-build-fast` at a 500k window. Pi posts registry id
      # `${grok_primary}` plus context and fast; it cannot set Grok's
      # reasoning_effort. OMP's `claude-opus-5-1m` is `claude-opus-5@1m`; effort
      # follows reasoning_effort.
      model:
        - iv-codex/${gpt_primary}
        - iv-cc/claude-opus-5
        - xai/${grok_primary}
        - cursor/${grok_primary}@500k:fast
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5@1m
      reasoning_effort: high
      enabled_models:
        - ${grok_primary}*
        - gpt-6*
        - claude-opus-5*
        - claude-sonnet-5*
        # This id is pinned because the other IV aliases cannot serve it.
        - iv-anthropic/claude-fable-5
        - qwen3.8*
        - gemini-3.8*
        - deepseek-v4.1*
        - glm-5.3*
        - kimi/kimi-k3*
        # cursor/* globs come from llm.providers.cursor.
      # IV first; xAI is a bundled Pi provider and the personal fallback.
      session_title_model:
        - iv/deepseek-v4-flash
        - xai/${grok_primary}:low
      # IV first; xAI is a bundled Pi provider and the personal fallback.
      subagent_model:
        - iv-codex/${gpt_primary}
        - xai/${grok_primary}
      provider_sets: [iv]
      providers:
        # Fable's adaptive reasoning is handled server-side.
        iv-anthropic:
          model_overrides:
            claude-fable-5:
              reasoning: false
        ollama:
          provider: ollama
        # OAuth providers own their catalogs and authentication.
        openai-codex:
          provider: openai-codex
          models: false
        opencode:
          provider: opencode
          models: false
        # pi-cursor-sdk owns the catalog and the API key but prices every
        # model at $0. models: false keeps its list; llm.catalogs.cursor
        # supplies the prices.
        cursor:
          provider: cursor
          models: false
          catalog: cursor
