llm:
  tools:
    pi:
      # Same candidate order as omp.yaml. IV aliases enumerate models because
      # the proxy catalog differs from Pi's bundled catalog; subscription
      # providers keep models: false. Cursor ids are pi-cursor-sdk's, not
      # OMP SKUs. Personal default is `${grok_primary}@256k:fast`. The SDK
      # posts registry id `${grok_primary}` with params `context`,
      # `reasoning_effort`, and `fast`, not OMP's `${grok_primary}-500k-fast`
      # SKU. `models.list()` still advertises `500k` + high + fast as the
      # default, and local validation only checks the id, so the picker
      # shows it. The run registry then rejects `context=500k` with
      # `Invalid parameters for registry model` / `AI Model Not Found`.
      # `context=256k` completes; `context=500k` alone is rejected too, so
      # the failure is the window, not `reasoning_effort`. Pi still cannot
      # set Grok's reasoning_effort; the thinking map forwards the default.
      # `claude-opus-5-high` is `claude-opus-5@1m`; effort follows
      # reasoning_effort.
      model:
        - openai/${gpt_primary}
        - anthropic/claude-opus-5
        - cursor/${grok_primary}@256k:fast
        - xai/${grok_primary}
        - openai-codex/${gpt_primary}
        - cursor/claude-opus-5@1m
      reasoning_effort: high
      enabled_models:
        - ${grok_primary}*
        - gpt-6*
        - claude-opus-5*
        - claude-sonnet-5*
        # This id is pinned because the other IV aliases cannot serve it.
        - iv-anthropic/claude-fable-5
        - qwen3.8*
        - gemini-3.8*
        - deepseek-v4.1*
        - glm-5.3*
        - kimi/kimi-k3*
        # cursor/* globs come from llm.catalogs.cursor.
      # IV first; xAI is a bundled Pi provider and the personal fallback.
      session_title_model:
        - iv/deepseek-v4-flash
        - xai/${grok_primary}:low
      # IV first; xAI is a bundled Pi provider and the personal fallback.
      subagent_model:
        - openai/${gpt_primary}
        - xai/${grok_primary}
      providers:
        openai:
          provider: iv
          auth_field: codex-auth-token
        anthropic:
          provider: iv
          type: anthropic
          auth_field: cc-auth-token
        # Anthropic IV surface on the default token. This model needs the
        # Anthropic type and adaptive reasoning handled server-side.
        iv-anthropic:
          provider: iv
          type: anthropic
          auth_field: default-auth-token
          model_overrides:
            claude-fable-5:
              reasoning: false
          models:
            - claude-fable-5
        iv:
          provider: iv
          auth_field: default-auth-token
        ollama:
          provider: ollama
        # OAuth providers own their catalogs and authentication.
        openai-codex:
          provider: openai-codex
          models: false
        opencode:
          provider: opencode
          models: false
        # pi-cursor-sdk owns the catalog and the API key. models: false keeps
        # that list. llm.catalogs.cursor (shared with OMP) is projected onto
        # this extension's ids.
        cursor:
          provider: cursor
          models: false
          catalog: cursor
