llm:
  # ── Data sets (model catalogs, independent from inference providers) ──
  data_sets:
    models-dev:
      type: models-dev
      file_path: models-dev-api

  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools override only `auth.field` to pick a different API key from the
  # same pass path; the base_url stays shared.
  #
  # type: openai (default) | anthropic | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  #
  # Per-tool model selection lives in llm/<tool>.yaml.
  providers:
    iv:
      name: IV
      data_set: models-dev
      base_url: "http://llm.invalley.co"
      model_caches:
        iv-default-models-api:
          auth_field: default-auth-token
        iv-codex-models-api:
          auth_field: codex-auth-token
        iv-cc-models-api:
          auth_field: cc-auth-token
      auth:
        path: Work/IV/LLM
      when:
        enabled:
          host_env: ["iv"]

    openai:
      name: OpenAI
      base_url: "https://api.openai.com"
      model_caches:
        openai-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/AI/OpenAI
        field: api-key

    # Pi's built-in ChatGPT subscription provider. It has no endpoint or API
    # key here: pi owns its OAuth flow and bundled model catalog.
    openai-codex:
      name: OpenAI Codex

    # Hermes' built-in SuperGrok subscription provider. Hermes owns the OAuth
    # flow and model catalog, so there is no endpoint or API key here.
    xai-oauth:
      name: xAI OAuth

    # OMP's built-in Cursor subscription provider. It has no endpoint or API
    # key here: omp owns its OAuth flow and bundled model catalog.
    cursor:
      name: Cursor

    google:
      name: Google
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      model_caches:
        google-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    google-openai:
      name: Google (OpenAI Compatible)
      data_set: models-dev
      provider: google
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model_caches:
        google-openai-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    huggingface:
      name: Hugging Face
      data_set: models-dev
      provider: huggingface
      base_url: "https://router.huggingface.co/v1"
      model_caches:
        huggingface-models-api: {}
      auth:
        path: Personal/Tech/AI/HuggingFace

    nvidia:
      name: NVIDIA
      data_set: models-dev
      provider: nvidia
      base_url: "https://integrate.api.nvidia.com/v1"
      model_caches:
        nvidia-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/Nvidia
        field: api-key

    siliconflow-cn:
      name: SiliconFlow (China)
      data_set: models-dev
      provider: siliconflow-cn
      base_url: "https://api.siliconflow.cn/v1"
      model_caches:
        siliconflow-cn-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/AI/SiliconFlow
        field: api-key

    openrouter:
      name: OpenRouter
      base_url: "https://openrouter.ai/api"
      timeout: 10
      model_caches:
        openrouter-models-api:
          auth_field: api-key
          managed: external
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      name: Ollama
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      model_caches:
        ollama-models-api: {}
      when:
        enabled:
          roles: ["llm"]

    # OpenCode Zen's official provider ID is `opencode`. Both Zen and Go
    # expose an OpenAI-shaped /v1/models endpoint; models-dev supplies the
    # richer per-model protocol metadata used by OpenCode itself.
    opencode:
      name: OpenCode Zen
      data_set: models-dev
      provider: opencode
      base_url: "https://opencode.ai/zen"
      model_caches:
        opencode-models-api: {}

    opencode-go:
      name: OpenCode Go
      data_set: models-dev
      provider: opencode-go
      base_url: "https://opencode.ai/zen/go"
      model_caches:
        opencode-go-models-api: {}
