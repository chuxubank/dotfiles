llm:
  # ── Shared model ids ────────────────────────────────────────────────
  # Tool configs reference these as ${name}; llm/tool-config expands them
  # before provider selection. Keep provider aliases in each tool config.
  models:
    gpt_primary: gpt-6.1-sol
    grok_primary: grok-4.7

  # ── Data sets (model catalogs, independent from inference providers) ──
  data_sets:
    models-dev:
      type: models-dev
      file_path: models-dev-api

  # ── Provider sets ───────────────────────────────────────────────────
  # Alias groups a tool pulls in with `provider_sets: [<name>]`. A tool's
  # own `providers.<alias>` entry is deep-merged on top.
  provider_sets:
    # IV's surfaces under Pi/OMP's bundled provider names, so bare ids land
    # on IV first. `openai`/`anthropic` are the codex and cc token groups;
    # `iv` is the default token on the OpenAI surface.
    iv:
      openai:
        provider: iv
        auth_field: codex-auth-token
      anthropic:
        provider: iv
        type: anthropic
        auth_field: cc-auth-token
      # The default token's Anthropic surface. claude-fable-5 needs exactly
      # this: the cc group 404s the id, and the OpenAI-typed `iv` alias is
      # rejected for sending reasoning_effort. The catalog is scoped to that
      # one id so the group's OpenAI-format models are not mistyped.
      iv-anthropic:
        provider: iv
        type: anthropic
        auth_field: default-auth-token
        models:
          - claude-fable-5
      iv:
        provider: iv
        auth_field: default-auth-token

  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools override only `auth.field` to pick a different API key from the
  # same pass path; the base_url stays shared.
  #
  # type: openai (default) | anthropic | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  #
  # Per-tool model selection lives in llm/<tool>.yaml.
  providers:
    iv:
      name: IV
      data_set: models-dev
      base_url: "http://llm.invalley.co"
      model_caches:
        iv-default-models-api:
          auth_field: default-auth-token
        iv-codex-models-api:
          auth_field: codex-auth-token
        iv-cc-models-api:
          auth_field: cc-auth-token
      auth:
        path: Work/IV/LLM
      when:
        enabled:
          host_env: ["iv"]

    # Codex's built-in ChatGPT-login provider. No endpoint, key, or model
    # cache: the OpenAI API is not used. Codex skips this alias when writing
    # model_providers, so only the alias itself matters.
    openai:
      name: OpenAI

    # Pi/OMP ChatGPT subscription. Flip `when.enabled` to true to bring the
    # alias, picker globs, and OMP provider back; false hides it everywhere.
    openai-codex:
      name: OpenAI Codex
      when:
        enabled: false

    # Hermes' built-in SuperGrok subscription provider. Hermes owns the OAuth
    # flow and model catalog, so there is no endpoint or API key here.
    xai-oauth:
      name: xAI OAuth

    # OMP's built-in Cursor subscription provider. It has no endpoint or API
    # key here: omp owns its OAuth flow and bundled model catalog. Pi reaches
    # it through pi-cursor-sdk. Off on iv: the alias, its role candidates,
    # and cursor/* picker globs drop out for both tools.
    cursor:
      name: Cursor
      when:
        disabled:
          host_env: ["iv"]

    google:
      name: Google
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      model_caches:
        google-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    google-openai:
      name: Google (OpenAI Compatible)
      data_set: models-dev
      provider: google
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model_caches:
        google-openai-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    huggingface:
      name: Hugging Face
      data_set: models-dev
      provider: huggingface
      base_url: "https://router.huggingface.co/v1"
      model_caches:
        huggingface-models-api: {}
      auth:
        path: Personal/Tech/AI/HuggingFace

    nvidia:
      name: NVIDIA
      data_set: models-dev
      provider: nvidia
      base_url: "https://integrate.api.nvidia.com/v1"
      model_caches:
        nvidia-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/Nvidia
        field: api-key

    siliconflow-cn:
      name: SiliconFlow (China)
      data_set: models-dev
      provider: siliconflow-cn
      base_url: "https://api.siliconflow.cn/v1"
      model_caches:
        siliconflow-cn-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/AI/SiliconFlow
        field: api-key

    openrouter:
      name: OpenRouter
      base_url: "https://openrouter.ai/api"
      timeout: 10
      model_caches:
        openrouter-models-api:
          auth_field: api-key
          managed: external
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      name: Ollama
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      model_caches:
        ollama-models-api: {}
      when:
        enabled:
          roles: ["llm"]

    # OpenCode Zen's official provider ID is `opencode`. Both Zen and Go
    # expose an OpenAI-shaped /v1/models endpoint; models-dev supplies the
    # richer per-model protocol metadata used by OpenCode itself.
    opencode:
      name: OpenCode Zen
      data_set: models-dev
      provider: opencode
      base_url: "https://opencode.ai/zen"
      model_caches:
        opencode-models-api: {}

    opencode-go:
      name: OpenCode Go
      data_set: models-dev
      provider: opencode-go
      base_url: "https://opencode.ai/zen/go"
      model_caches:
        opencode-go-models-api: {}
