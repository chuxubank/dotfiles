llm:
  # ── Shared model ids ────────────────────────────────────────────────
  # Tool configs reference these as ${name}; llm/tool-config expands them
  # before provider selection. Keep provider aliases in each tool config.
  models:
    gpt_primary: gpt-6.1-sol
    grok_primary: grok-4.7

  # ── Data sets (model catalogs, independent from inference providers) ──
  data_sets:
    models-dev:
      type: models-dev
      file_path: models-dev-api

  # ── Default providers ───────────────────────────────────────────────
  # Inherited by every llm.tools entry. Sets and tool entries override
  # these refs; exclude_providers removes aliases for unsupported clients.
  # This adds selectable providers, not default models or OMP role targets.
  default_providers: [magpie]

  # ── Provider sets ───────────────────────────────────────────────────
  # Alias groups a tool pulls in with `provider_sets: [<name>]`. A tool's
  # own `providers.<alias>` entry is deep-merged on top.
  provider_sets:
    # Pi/OMP keep the bundled names `openai` and `anthropic` free for /login.
    # Codex token is `iv-codex`, cc token is `iv-cc`. Neither is a bundled
    # provider, so each catalog is the enumerated IV list. `iv` is the
    # default token's OpenAI surface.
    iv:
      iv-codex:
        provider: iv
        auth_field: codex-auth-token
      iv-cc:
        provider: iv
        type: anthropic
        auth_field: cc-auth-token
      # The default token's Anthropic surface. claude-fable-5 needs exactly
      # this: the cc group 404s the id, and the OpenAI-typed `iv` alias is
      # rejected for sending reasoning_effort. The catalog is scoped to that
      # one id so the group's OpenAI-format models are not mistyped.
      iv-anthropic:
        provider: iv
        type: anthropic
        auth_field: default-auth-token
        models:
          - claude-fable-5
      iv:
        provider: iv
        auth_field: default-auth-token

  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools override only `auth.field` to pick a different API key from the
  # same pass path; the base_url stays shared.
  #
  # type: openai (default) | anthropic | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  #
  # Per-tool model selection lives in llm/<tool>.yaml.
  provider_conditions:
    disabled: &disabled { enabled: false }

  providers:
    iv:
      name: IV
      data_set: models-dev
      base_url: "http://llm.invalley.co"
      model_caches:
        iv-default-models-api:
          auth_field: default-auth-token
        iv-codex-models-api:
          auth_field: codex-auth-token
        iv-cc-models-api:
          auth_field: cc-auth-token
      auth:
        path: Work/IV/LLM
      # Company token. Off outside host_env iv, so an IV-first candidate
      # list falls through to its personal entry.
      when:
        enabled:
          host_env: ["iv"]

    # Codex's built-in ChatGPT-login provider. No endpoint, key, or model
    # cache: the OpenAI API is not used. Codex skips this alias when writing
    # model_providers, so only the alias itself matters.
    openai:
      name: OpenAI

    # Pi/OMP ChatGPT subscription. Tools list it as an alias with
    # models: false. Replace this `when` with { enabled: true } to bring the
    # alias and its picker globs back.
    openai-codex:
      name: OpenAI Codex
      when: *disabled

    # Pi's built-in xAI provider. No endpoint or key: Pi owns login and the
    # catalog. Tools list the alias with models: false. No when, so the alias
    # is on wherever it is listed.
    xai:
      name: xAI

    # Hermes' built-in SuperGrok subscription provider. Hermes owns the OAuth
    # flow and model catalog, so there is no endpoint or API key here.
    xai-oauth:
      name: xAI OAuth

    # OMP's built-in Cursor subscription provider. It has no endpoint or API
    # key here: omp owns its OAuth flow and bundled model catalog. Pi reaches
    # it through pi-cursor-sdk. Both tools keep the alias on every host.
    cursor:
      name: Cursor
      # Picker globs, appended as `<alias>/<glob>` to the enabled_models of
      # every tool with a cursor alias. Cursor does not serve GPT-6.
      enabled_models:
        - claude-opus-5*
        - claude-sonnet-5*
        - claude-fable-5*
        - composer-2.5*
        - "*${grok_primary}*"
        - "*muse-spark-1.3*"
        - "*gemini-3.8-flash*"
        - default

    google:
      name: Google
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      model_caches:
        google-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    google-openai:
      name: Google (OpenAI Compatible)
      data_set: models-dev
      provider: google
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model_caches:
        google-openai-models-api:
          auth_field: gemini-api-key
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    huggingface:
      name: Hugging Face
      data_set: models-dev
      provider: huggingface
      base_url: "https://router.huggingface.co/v1"
      model_caches:
        huggingface-models-api: {}
      auth:
        path: Personal/Tech/AI/HuggingFace

    nvidia:
      name: NVIDIA
      data_set: models-dev
      provider: nvidia
      base_url: "https://integrate.api.nvidia.com/v1"
      model_caches:
        nvidia-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/Nvidia
        field: api-key

    siliconflow-cn:
      name: SiliconFlow (China)
      when: *disabled
      data_set: models-dev
      provider: siliconflow-cn
      base_url: "https://api.siliconflow.cn/v1"
      model_caches:
        siliconflow-cn-models-api:
          auth_field: api-key
      auth:
        path: Personal/Tech/AI/SiliconFlow
        field: api-key

    openrouter:
      name: OpenRouter
      base_url: "https://openrouter.ai/api"
      timeout: 10
      model_caches:
        openrouter-models-api:
          auth_field: api-key
          managed: external
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      name: Ollama
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      model_caches:
        ollama-models-api: {}
      when:
        enabled:
          roles: ["llm"]

    # One gateway, on the VPS. The origin is https://magpie.<domain from
    # the same pass entry the proxy inventory uses. OpenAI-compatible
    # clients append /v1; an anthropic or gemini type keeps the origin.
    # Pi, OMP, and Codex read the gateway key through pass-field. OpenCode
    # and Hermes have no command field, so they still receive the key.
    # The model list is GET /v1/models, cached like the other OpenAI
    # catalogs. A missing cache is fetched at render; the daily refresh
    # rewrites it. Codex does not read that list. The picker glob is
    # appended as magpie/* by tools that have a pool.
    magpie:
      name: Magpie
      api_types: [openai, anthropic, gemini]
      public_scheme: https
      public_prefix: magpie
      public_domain:
        path: Network/Host/BandwagonHost/CN2/ssh
        field: domain
      owner: magpie
      auth:
        path: Personal/Tech/AI/Magpie
        field: gateway-key
      model_caches:
        magpie-models-api:
          auth_field: gateway-key
      enabled_models:
        - "*"

    # OpenCode Zen's official provider ID is `opencode`. Both Zen and Go
    # expose an OpenAI-shaped /v1/models endpoint; models-dev supplies the
    # richer per-model protocol metadata used by OpenCode itself.
    opencode:
      name: OpenCode Zen
      when: *disabled
      data_set: models-dev
      provider: opencode
      base_url: "https://opencode.ai/zen"
      model_caches:
        opencode-models-api: {}

    opencode-go:
      name: OpenCode Go
      when: *disabled
      data_set: models-dev
      provider: opencode-go
      base_url: "https://opencode.ai/zen/go"
      model_caches:
        opencode-go-models-api: {}
