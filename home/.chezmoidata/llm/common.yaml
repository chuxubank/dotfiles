llm:
  # ── Data sets (model catalogs, independent from inference providers) ──
  data_sets:
    models-dev:
      type: models-dev
      file_path: models-dev-api

  model_caches:
    iv-default-models-api:
      provider: iv
      auth_field: default-auth-token
      when:
        enabled:
          host_env: ["iv"]
    iv-codex-models-api:
      provider: iv
      auth_field: codex-auth-token
      when:
        enabled:
          host_env: ["iv"]
    iv-cc-models-api:
      provider: iv
      auth_field: cc-auth-token
      when:
        enabled:
          host_env: ["iv"]
    openai-models-api:
      provider: openai
      auth_field: api-key
    google-models-api:
      provider: google
      auth_field: aider-gemini-api-key
    ollama-models-api:
      provider: ollama
      when:
        enabled:
          roles: ["llm"]
    openrouter-models-api:
      provider: openrouter
      auth_field: api-key
      managed: external

  # ── Providers ───────────────────────────────────────────────────────
  # Each provider = one API endpoint (base_url + default auth).
  # Tools override only `auth.field` to pick a different API key from the
  # same pass path; the base_url stays shared.
  #
  # type: openai (default) | anthropic | ollama | gemini
  #   Controls model list endpoint path and response parsing.
  #
  # Per-tool model selection lives in llm/<tool>.yaml.
  providers:
    iv:
      name: IV
      data_set: models-dev
      base_url: "http://llm.invalley.co"
      auth:
        path: Work/IV/LLM
      when:
        enabled:
          host_env: ["iv"]

    openai:
      name: OpenAI
      base_url: "https://api.openai.com"
      auth:
        path: Personal/Tech/AI/OpenAI
        field: api-key

    # Pi's built-in ChatGPT subscription provider. It has no endpoint or API
    # key here: pi owns its OAuth flow and bundled model catalog.
    openai-codex:
      name: OpenAI Codex

    google:
      name: Google
      type: gemini
      base_url: "https://generativelanguage.googleapis.com"
      auth:
        path: Personal/Tech/Google
        field: gemini-api-key

    openrouter:
      name: OpenRouter
      base_url: "https://openrouter.ai/api"
      timeout: 10
      auth:
        path: Personal/Tech/AI/OpenRouter
        field: api-key

    llama:
      name: Ollama
      base_url: "http://localhost:8080"
      when:
        enabled:
          roles: ["llm"]

    mlx:
      base_url: "http://localhost:8000"
      when:
        enabled:
          roles: ["llm"]

    ollama:
      type: ollama
      base_url: "http://localhost:11434"
      when:
        enabled:
          roles: ["llm"]

    opencode:
      data_set: models-dev
      provider: opencode
      filter:
        cost:
          input: 0
          output: 0
        modalities:
          input: ["text", "image"]
