services:
  - tool: isync
    brew: true
    logrotate:
      stderr:
        rotate: 2
        interval: weekly
    runAtLoad: true
    startInterval: 300
    programArguments:
      - usrBin: mbsync
      - "-a"
    environmentVariables:
      PATH:
        pathList:
          - usrPath: bin
          - usrPath: sbin
          - /usr/bin
          - /bin
          - /usr/sbin
          - /sbin
      PASSWORD_STORE_DIR:
        homePath: pass

  - tool: freedesktop
    target: dbus-session
    limitLoadToSessionType: false
    programArguments:
      - usrBin: dbus-daemon
      - "--nofork"
      - "--session"
    extra: |
      <key>Sockets</key>
      <dict>
        <key>unix_domain_listener</key>
        <dict>
          <key>SecureSocketWithKey</key>
          <string>DBUS_LAUNCHD_SESSION_BUS_SOCKET</string>
        </dict>
      </dict>

  - tool: gitwatch
    target: org
    keepAlive: true
    runAtLoad: true
    programArguments:
      - usrBin: gitwatch
      - "-r"
      - origin
      - "-s"
      - "120"
      - "-R"
      - "-M"
      - homePath:
          - personal
          - org
    environmentVariables:
      PATH:
        format: "%s/bin:/bin:/usr/bin"
        value:
          path: usr

  - tool: rclone
    target: nutstore
    keepAlive: true
    runAtLoad: true
    programArguments:
      - usrBin: rclone
      - nfsmount
      - "nutstore:"
      - homePath:
          - data
          - nutstore
      - "--volname"
      - path:
          - data
          - nutstore
      - "-vv"
      - "--dir-cache-time"
      - "3m"
      - "--poll-interval"
      - "1m"
      - "--vfs-cache-mode"
      - full
      - "--vfs-cache-max-age"
      - "4w"
      - "--vfs-fast-fingerprint"

  - tool: rclone
    target: rpi
    programArguments:
      - usrBin: rclone
      - nfsmount
      - "rpi:"
      - home:
          - rpi
      - "--vfs-cache-mode"
      - full
      - "--volname"
      - rpi

  - tool: uv
    target: rapid-mlx
    programArguments:
      - home:
          - .local
          - bin
          - rapid-mlx
      - serve
      - mlx-community/LFM2-8B-A1B-8bit
      - "--gpu-memory-utilization"
      - "0.82"
      - "--kv-cache-quantization"
      - "--kv-cache-quantization-bits"
      - "4"
      - "--max-num-seqs"
      - "2"
      - "--prefill-batch-size"
      - "256"
      - "--completion-batch-size"
      - "64"
      - "--prefill-step-size"
      - "1024"
      - "--chunked-prefill-tokens"
      - "1024"
      - "--cache-memory-percent"
      - "0.08"
      - "--stream-interval"
      - "2"
      - "--pin-system-prompt"
