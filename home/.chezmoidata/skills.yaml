skills:
  agents:
    - amp
    - claude-code
    - codex
    - droid
    - gemini-cli
    - goose
    - github-copilot
    - kimi-cli
    - kiro-cli
    - opencode
    - pi
    - warp
  providers:
    - name: find-skills
      source: vercel-labs/skills

    - name: gstack
      source: garrytan/gstack
      when:
        enabled: false

    - name: ["cli-creator", "figma-implement-design"]
      source: openai/skills
      when:
        enabled:
          tool: codex

    - name: android-emulator-qa
      source: openai/plugins/plugins/test-android-apps
      when:
        disabled:
          tool: codex

    - name: conventional-commit
      source: github/awesome-copilot

    - name: feishu-projects
      source: chuxubank/skills
      when:
        enabled:
          host_env: iv

    - name:
        - agp-9-upgrade
        - edge-to-edge
        - navigation-3
        - r8-analyzer
      source: android/skills

    - name:
        - kotlin-tooling-agp9-migration
        - kotlin-tooling-cocoapods-spm-migration
        - kotlin-tooling-java-to-kotlin
      source: Kotlin/kotlin-agent-skills

    - name:
        - lark-approval
        - lark-attendance
        - lark-base
        - lark-calendar
        - lark-contact
        - lark-doc
        - lark-drive
        - lark-event
        - lark-im
        - lark-mail
        - lark-markdown
        - lark-minutes
        - lark-okr
        - lark-openapi-explorer
        - lark-shared
        - lark-sheets
        - lark-skill-maker
        - lark-slides
        - lark-task
        - lark-vc-agent
        - lark-vc
        - lark-whiteboard
        - lark-wiki
        - lark-workflow-meeting-summary
        - lark-workflow-standup-report
      source: larksuite/cli
      when:
        enabled:
          host_env: iv
