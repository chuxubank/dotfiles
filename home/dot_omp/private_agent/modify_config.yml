{{- /* chezmoi:modify-template */ -}}

{{- /* OMP settings — schema: https://github.com/can1357/oh-my-pi/blob/main/docs/settings.md
       Preserve settings written by `omp config` and `/settings` while managing
       model roles and the subagent execution policy declaratively. */ -}}

{{- $cfg := includeTemplate "llm/tool-config" (merge (dict "tool" "omp") .) | fromJson -}}
{{- $effort := default "high" (index $cfg "reasoning_effort") -}}
{{- $roles := dict "default" (printf "%s:%s" $cfg.model $effort) -}}
{{- range $role, $model := default dict (index $cfg "default_models") -}}
  {{- $_ := set $roles $role $model -}}
{{- end -}}

{{- /* Per-agent model overrides are role aliases, not model ids: they
       re-resolve per host through modelRoles, so IV gets the aggressive pick
       and personal hosts fall back to the subscription entry without a second
       table here. Unlisted agents keep @task. */ -}}
{{- $agentModels := dict
  "scout" "@smol"
  "sonic" "@smol"
  "security-reviewer" "@slow"
-}}

{{- $disabledProviders := list
  "claude"
  "claude-plugins"
  "cline"
  "codex"
  "gemini"
  "github"
  "opencode"
  "openrouter"
  "vscode"
  "windsurf"
-}}
{{- if not (hasKey $cfg.providers "openai-codex") -}}
  {{- $disabledProviders = append $disabledProviders "openai-codex" -}}
{{- end -}}

{{- /* Extended Context stays on. Off clamps every non-xai-oauth model to
       cost.longContext.inputThreshold, and Cursor's bundled grok-4.7*-fast
       rule sets that threshold at 256000, so grok-4.7-500k-fast displays
       256k. xai-oauth is exempt and already shows 500k. Above 256k, Fast
       bills the long-context rate. */ -}}
{{- /* OMP accepts provider/id or a prefix whose only star is the last
       character. Each shared rule becomes alias/name* for every alias,
       plus alias/dirs/name* when a catalog id has directories before
       that final segment. The percent comes from llm.compaction.
       reserve_tokens is an absolute Pi reserve, so OMP skips that rule. */ -}}
{{- $rules := includeTemplate "llm/compaction-thresholds" . | fromJson -}}
{{- $thresholds := dict -}}
{{- range $rule := $rules -}}
  {{- if hasKey $rule "percent" -}}
    {{- $pct := printf "%v%%" (int $rule.percent) -}}
    {{- range $alias, $_ := $cfg.providers -}}
      {{- $_ := set $thresholds (printf "%s/%s*" $alias $rule.stem) $pct -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $catalog := includeTemplate "llm/custom-providers" (merge (dict "tool" "omp") .) | fromJson -}}
{{- range $alias, $provider := $catalog -}}
  {{- range $model := default (list) (index $provider "models") -}}
    {{- $id := printf "%v" (index $model "id") -}}
    {{- $key := printf "%s/%s" $alias $id -}}
    {{- range $rule := $rules -}}
      {{- if and (hasKey $rule "percent") (regexMatch $rule.regex $key) -}}
        {{- $head := initial (splitList "/" $id) -}}
        {{- $dir := "" -}}
        {{- if gt (len $head) 0 -}}{{- $dir = printf "%s/" (join "/" $head) -}}{{- end -}}
        {{- $_ := set $thresholds (printf "%s/%s%s*" $alias $dir $rule.stem) (printf "%v%%" (int $rule.percent)) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- /* update.auto installs through the PATH launcher and would replace the
       ~/bin/omp wrapper. docs/llm/model-roles.md */ -}}
{{- $managed := dict
  "extendedContext" true
  "update" (dict "auto" false)
  "advisor" (dict
    "enabled" true
  )
  "async" (dict
    "enabled" true
  )
  "composer" (dict
    "shape" "claude"
    "tokenRate" true
  )
  "display" (dict
    "cacheMissMarker" true
    "showTokenUsage" true
    "showTurnTime" true
  )
  "disabledProviders" $disabledProviders
  "modelRoles" $roles
  "cycleOrder" (default (list "smol" "default" "slow") (index $cfg "cycle_order"))
  "enabledModels" (default (list) (index $cfg "enabled_models"))
  "symbolPreset" "nerd"
  "statusLine" (dict
    "preset" "custom"
    "leftSegments" (list "vim" "model" "mode" "path" "git" "pr" "session_name")
    "rightSegments" (list "token_total" "cache_read" "cache_write" "cache_hit" "cost" "context_pct")
  )
  "task" (dict
    "batch" true
    "eager" "preferred"
    "enableEffort" true
    "enableLsp" true
    "maxConcurrency" 3
    "maxRecursionDepth" 2
    "showResolvedModelBadge" true
    "agentModelOverrides" $agentModels
    "isolation" (dict
      "enabled" true
      "apply" true
      "merge" "patch"
    )
  )
  "theme" (dict
    "dark" "dark-gruvbox"
    "light" "light-gruvbox"
  )
-}}
{{- includeTemplate "config/merge" (dict
  "format" "yaml"
  "input" (dig "stdin" "" .chezmoi)
  "managed" $managed
  "replace" (dict "modelRoles" $roles "isolation.backend" "auto" "compaction.modelThresholds" $thresholds)
  "remove" (list "task.isolation.mode")
) -}}
