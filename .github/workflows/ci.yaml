name: CI

on:
  push:
  pull_request:

jobs:
  clone-and-install:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('home/.chezmoidata/packages/apt.toml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache chezmoi
        uses: actions/cache@v4
        with:
          path: ~/.cache/chezmoi
          key: ${{ runner.os }}-chezmoi-${{ hashFiles('home/.chezmoi.toml.tmpl', 'home/.chezmoiexternals/**/*.toml.tmpl') }}
          restore-keys: |
            ${{ runner.os }}-chezmoi-

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('home/.chezmoidata/packages/node.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache sdkman
        uses: actions/cache@v4
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-${{ hashFiles('home/.chezmoidata/packages/sdkman.toml') }}
          restore-keys: |
            ${{ runner.os }}-sdkman-

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('home/.chezmoidata/packages/python.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run install
        run: ./install.sh

      - name: Chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'
