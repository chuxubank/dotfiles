name: CI

on:
  push:
    branches:
      - chezmoi
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate declarations and templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y zsh shellcheck
          curl -LsSf https://astral.sh/uv/0.12.11/install.sh | sh
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install chezmoi
        run: |
          ./install.sh --install-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Init chezmoi
        run: chezmoi init --source "${{ github.workspace }}"

      - name: Verify
        run: make verify

  bootstrap-linux:
    name: Bootstrap (Linux)
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache apt
        id: cache-apt
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('home/.chezmoidata/packages/apt.toml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache chezmoi
        uses: actions/cache@v5
        with:
          path: ~/.cache/chezmoi
          key: ${{ runner.os }}-chezmoi-${{ hashFiles('home/.chezmoi.toml.tmpl', 'home/.chezmoiexternals/**/*.toml.tmpl', 'home/**/.chezmoiexternal.toml.tmpl') }}
          restore-keys: |
            ${{ runner.os }}-chezmoi-

      - name: Cache sdkman
        uses: actions/cache@v5
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-${{ hashFiles('home/.chezmoidata/packages/sdkman.toml') }}
          restore-keys: |
            ${{ runner.os }}-sdkman-

      - name: Cache rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/cargo/bin/
            ~/.local/share/cargo/.crates.toml
            ~/.local/share/cargo/.crates2.json
            ~/.local/share/cargo/registry/index/
            ~/.local/share/cargo/registry/cache/
            ~/.local/share/cargo/git/db/
          key: ${{ runner.os }}-rust-${{ hashFiles('home/.chezmoidata/packages/rust.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache bun
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun
            ~/.local/share/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('home/.chezmoidata/packages/node.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('home/.chezmoidata/packages/python.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache go
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/go
            ~/.local/share/go
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('home/.chezmoidata/packages/go.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install python3
        run: |
          if command -v python3 >/dev/null; then
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          if command -v sudo >/dev/null && [ "$(id -u)" -ne 0 ]; then
            sudo apt-get update && sudo apt-get install -y python3
          else
            apt-get update && apt-get install -y python3
          fi

      - name: Run install
        run: ./install.sh

      - name: Chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'

  apply:
    name: Apply managed files (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            shell: bash
          - name: macOS
            os: macos-latest
            shell: bash
          - name: Windows
            os: windows-latest
            shell: "msys2 {0}"
    steps:
      - name: Disable git autocrlf
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: zsh curl git unzip

      - name: Configure Windows env
        if: runner.os == 'Windows'
        run: |
          win_home=$(cygpath -u "$USERPROFILE")
          echo "HOME=$win_home" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$win_home/.local/bin")" >> "$GITHUB_PATH"

      - name: Configure Unix env
        if: runner.os != 'Windows'
        run: echo "SOURCE_DIR=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: |
          ./install.sh --install-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install chezmoi (macOS)
        if: runner.os == 'macOS'
        run: brew install chezmoi

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS https://chezmoi.io/get)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi --version

      - name: Initialize source
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --source "$SOURCE_DIR"

      - name: Apply managed files
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi apply --force --no-tty --exclude=encrypted,scripts,externals

      - name: Verify target state
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --exclude=encrypted,scripts,externals

  bootstrap-windows:
    name: Bootstrap (Windows)
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: "msys2 {0}"
    steps:
      - name: Disable git autocrlf
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: zsh curl git unzip mingw-w64-ucrt-x86_64-python

      - name: Configure env
        run: |
          win_home=$(cygpath -u "$USERPROFILE")
          echo "HOME=$win_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$win_home/.local/share/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$win_home/.local/share/rustup" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$win_home/.local/bin")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$win_home/.local/share/cargo/bin")" >> "$GITHUB_PATH"

      - name: Cache rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/cargo
            ~/.local/share/rustup
          key: ${{ runner.os }}-msys2-rustup-${{ hashFiles('home/.chezmoidata/packages/rust.toml', 'home/.chezmoiscripts/run_onchange_after_100_setup-rust.sh.tmpl', 'home/.chezmoiscripts/run_onchange_before_000_install-packages.sh.tmpl') }}
          restore-keys: |
            ${{ runner.os }}-msys2-rustup-

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS https://chezmoi.io/get)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi --version

      - name: Initialize source
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --source "$SOURCE_DIR"

      - name: Apply scripts and managed files
        run: |
          export PATH="$HOME/.local/bin:${CARGO_HOME:+$CARGO_HOME/bin:}$PATH"
          chezmoi apply --force --no-tty --exclude=encrypted,externals

      - name: Verify rust
        run: |
          export PATH="${CARGO_HOME:+$CARGO_HOME/bin:}$PATH"
          rustc --version
          cargo --version
          rustup show
