name: CI

on:
  push:
    branches:
      - chezmoi
  pull_request:

jobs:
  clone-and-install:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache apt
        id: cache-apt
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('home/.chezmoidata/packages/apt.toml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache chezmoi
        uses: actions/cache@v5
        with:
          path: ~/.cache/chezmoi
          key: ${{ runner.os }}-chezmoi-${{ hashFiles('home/.chezmoi.toml.tmpl', 'home/.chezmoiexternals/**/*.toml.tmpl', 'home/**/.chezmoiexternal.toml.tmpl') }}
          restore-keys: |
            ${{ runner.os }}-chezmoi-

      - name: Cache sdkman
        uses: actions/cache@v5
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-${{ hashFiles('home/.chezmoidata/packages/sdkman.toml') }}
          restore-keys: |
            ${{ runner.os }}-sdkman-

      - name: Cache rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/cargo/bin/
            ~/.local/share/cargo/.crates.toml
            ~/.local/share/cargo/.crates2.json
            ~/.local/share/cargo/registry/index/
            ~/.local/share/cargo/registry/cache/
            ~/.local/share/cargo/git/db/
          key: ${{ runner.os }}-rust-${{ hashFiles('home/.chezmoidata/packages/rust.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache bun
        if: false
        uses: actions/cache@v5
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('home/.chezmoidata/packages/node.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache uv
        if: false
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('home/.chezmoidata/packages/python.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run install
        run: ./install.sh

      - name: Chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install chezmoi (macOS)
        if: runner.os == 'macOS'
        run: brew install chezmoi

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        run: choco install chezmoi -y

      - name: Init chezmoi
        run: chezmoi init --source "${{ github.workspace }}"

      - name: Chezmoi data
        run: chezmoi data

      - name: Dry-run apply
        run: chezmoi apply --dry-run --exclude=encrypted,scripts,externals

      - name: Syntax-check rendered scripts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          failed=0
          while IFS= read -r tmpl; do
            if ! rendered=$(chezmoi execute-template <"$tmpl"); then
              echo "template failed: $tmpl" >&2
              failed=1
              continue
            fi
            if [ -z "$(printf '%s' "$rendered" | tr -d '[:space:]')" ]; then
              continue
            fi
            out="$tmpdir/script"
            printf '%s\n' "$rendered" >"$out"
            first=$(printf '%s\n' "$rendered" | sed -n '/[^[:space:]]/{p;q;}')
            case $first in
              '#!'*zsh*)
                zsh -n "$out" || { echo "zsh -n failed: $tmpl" >&2; failed=1; }
                ;;
              '#!'*'/bin/sh'* | '#!'*'/usr/bin/env sh'* | '#!/bin/sh')
                sh -n "$out" || { echo "sh -n failed: $tmpl" >&2; failed=1; }
                ;;
            esac
          done < <(find home/.chezmoiscripts -type f -name '*.tmpl' | sort)
          exit "$failed"
